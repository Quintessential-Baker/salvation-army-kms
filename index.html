    let ln = String(rawLine || '').trim();
    Object.keys(uniMap).forEach(k => { ln = ln.split(k).join(uniMap[k]); });
    ln = ln.replace(/^[-*•]\s*/, '').replace(/\s+/g, ' ').trim();
    const m = ln.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*(fl\s+oz|[a-zA-Z#]+)?\s+(.+)$/i);
    if (!m) return { name: ln, qty: 0, unit: 'to taste', inv_id: '', stock_per_unit: 0, per100: 0 };
    const parseFrac = (tok) => {
      const parts = String(tok).trim().split(/\s+/);
      let sum = 0;
      parts.forEach(p => {
        if (p.includes('/')) { const [a, b] = p.split('/').map(Number); sum += b ? (a / b) : 0; }
        else sum += parseFloat(p) || 0;
      });
      return sum || 1;
    };
    const q = parseFrac(m[1]);
    const rawU = (m[3] || '').toLowerCase();
    const knownUnit = rawU && (UNIT_ALIASES[rawU] || KITCHEN_UNITS.includes(rawU));
    const unit = knownUnit ? normUnit(rawU) : 'pieces';
    const ingName = cleanItemName(knownUnit ? m[4] : ((m[3] ? m[3] + ' ' : '') + m[4]));
    const words = ingName.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
    const matchInv = state.items.find(i => {
      const iname = i.name.toLowerCase();
      return words.some(w => iname.includes(w));
    });
    const ingObj = { name: ingName, qty: Math.round(q * 100) / 100, unit, inv_id: matchInv ? matchInv.id : '', stock_per_unit: 0, per100: 0 };
    recomputeIngredientPer100(ingObj, baseServings);
    return ingObj;
  }

  function normalizeRecipe(r) {
    if (!r || typeof r !== 'object') return r;
    const baseServ = Math.max(1, Number(r.base_servings) || 65);
    const rawSteps = Array.isArray(r.steps) && r.steps.length
      ? r.steps
      : String(r.directions || '').split(/\r?\n+/).filter(Boolean);
    const steps = rawSteps.map(s => String(s || '').replace(/^\d+[\.\)]\s*/, '').trim()).filter(Boolean);
    const ingredients = (Array.isArray(r.ingredients) ? r.ingredients : []).map(g => {
      const unit = normUnit(g.unit || (Number(g.qty) > 0 ? 'pieces' : 'to taste'));
      const ing = {
        name: cleanItemName(g.name || 'Ingredient'),
        qty: unit === 'to taste' ? 0 : (Number(g.qty) || 0),
        unit,
        inv_id: g.inv_id || '',
        stock_per_unit: Number(g.stock_per_unit) || 0,
        per100: Number(g.per100) || 0
      };
      recomputeIngredientPer100(ing, baseServ);
      return ing;
    });
    const out = {
      ...r,
      name: String(r.name || 'Untitled Recipe').trim(),
      category: String(r.category || 'Main Entree').trim() || 'Main Entree',
      base_servings: baseServ,
      prep_min: Math.max(0, Number(r.prep_min) || 20),
      cook_min: Math.max(0, Number(r.cook_min) || 35),
      allergens: Array.from(new Set((Array.isArray(r.allergens) ? r.allergens : []).map(a => String(a || '').toLowerCase().trim()).filter(Boolean))),
      photo_url: String(r.photo_url || '').trim(),
      notes: String(r.notes || '').trim(),
      steps,
      ingredients
    };
    delete out.directions;
    return out;
  }

  function getFederalHoliday(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d.getTime())) return '';
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), dow = d.getDay();
    if (m === 1 && day === 1) return "New Year's Day";
    if (m === 1 && dow === 1 && day >= 15 && day <= 21) return 'MLK Jr. Day';
    if (m === 2 && dow === 1 && day >= 15 && day <= 21) return "Presidents' Day";
    if (m === 5 && dow === 1 && day >= 25) return 'Memorial Day';
    if (m === 6 && day === 19) return 'Juneteenth';
    if (m === 7 && day === 4) return 'Independence Day';
    if (m === 9 && dow === 1 && day <= 7) return 'Labor Day';
    if (m === 10 && dow === 1 && day >= 8 && day <= 14) return 'Columbus Day';
    if (m === 11 && day === 11) return 'Veterans Day';
    if (m === 11) {
      const nov1Dow = new Date(y, 10, 1).getDay();
      const thx = 1 + ((4 - nov1Dow + 7) % 7) + 21;
      if (day === thx) return 'Thanksgiving Day';
      if (day === thx + 1) return 'Thanksgiving Friday (Closed)';
    }
    if (m === 12 && day === 25) return 'Christmas Day';
    return '';
  }

  function getThirdFriday(year, month0) {
    const firstDow = new Date(year, month0, 1).getDay();
    const firstFri = 1 + ((5 - firstDow + 7) % 7);
    return localDateStr(new Date(year, month0, firstFri + 14));
  }

  function isHolidayOrClosedDay(ds) {
    if (getFederalHoliday(ds)) return getFederalHoliday(ds);
    const mp = (state.menuPlan || []).find(m => m.service_date === ds && m.status === 'CLOSED');
    return mp ? (mp.custom_title || 'Office Closed') : '';
  }

  function adjustOrderDateForHoliday(targetDateStr) {
    let d = targetDateStr;
    const holOn = isHolidayOrClosedDay(d);
    const holPrev = getFederalHoliday(addDays(d, -1));
    const holNext = getFederalHoliday(addDays(d, 1));
    const nearHol = holOn || holPrev || holNext;
    if (!nearHol) return { date: d, adjusted: false, reason: '' };
    let cursor = d;
    for (let i = 0; i < 7; i++) {
      const dow = new Date(cursor + 'T12:00:00').getDay();
      if ([1, 2, 3, 4, 5].includes(dow) && !isHolidayOrClosedDay(cursor) && !getFederalHoliday(addDays(cursor, 1))) {
        return { date: cursor, adjusted: cursor !== targetDateStr, reason: nearHol };
      }
      cursor = addDays(cursor, -1);
    }
    return { date: d, adjusted: false, reason: nearHol };
  }

  function getAutoHolidayAndOrderAnnouncements(todayStr) {
    const today = todayStr || localDateStr();
    const list = [];

    const holHits = [];
    for (let i = 0; i <= 14; i++) {
      const ds = addDays(today, i);
      const h = getFederalHoliday(ds);
      if (h) holHits.push({ date: ds, name: h, daysAway: i });
    }
    if (holHits.length) {
      const first = holHits[0];
      const labels = holHits.map(x => `${dLabel(x.date)} (${x.name})`).join(', ');
      list.push({
        id: 'auto-hol-' + first.date,
        isAuto: true,
        priority: 'urgent',
        title: `Upcoming Holiday Closing: ${first.name}`,
        body: `Salvation Army Community Kitchen is closed on ${labels}. Plan extra portions on the open service day before the holiday and adjust deliveries accordingly.`,
        author: 'Holiday Schedule',
        created_at: today
      });
    }

    const todayDow = new Date(today + 'T12:00:00').getDay();
    const daysToFri = (5 - todayDow + 7) % 7;
    const nextFri = addDays(today, daysToFri);
    const wAdj = adjustOrderDateForHoliday(nextFri);
    const wLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'W' && itemStatus(x) !== 'OK').length;
    if (wAdj.date >= today && wAdj.date <= addDays(today, 4)) {
      list.push({
        id: 'auto-ord-w-' + wAdj.date,
        isAuto: true,
        priority: wAdj.adjusted ? 'urgent' : 'reminder',
        title: wAdj.adjusted
          ? `Weekly Marberger & Produce Order — Adjusted for ${wAdj.reason}`
          : `Weekly Marberger & Produce Order Due ${wAdj.date === today ? 'Today' : dLabel(wAdj.date)}`,
        body: wAdj.adjusted
          ? `Normal Friday order (${dLabel(nextFri)}) falls on or near ${wAdj.reason}. Submit & approve your weekly PO early on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`
          : `Review Orders & POs and submit your weekly Marberger & Produce order on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }

    const nowD = new Date(today + 'T12:00:00');
    let m3Fri = getThirdFriday(nowD.getFullYear(), nowD.getMonth());
    if (addDays(m3Fri, 1) < today) {
      const nextMo = new Date(nowD.getFullYear(), nowD.getMonth() + 1, 1, 12);
      m3Fri = getThirdFriday(nextMo.getFullYear(), nextMo.getMonth());
    }
    const mAdj = adjustOrderDateForHoliday(m3Fri);
    const mLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'M' && itemStatus(x) !== 'OK').length;
    if (mAdj.date >= today && mAdj.date <= addDays(today, 7)) {
      list.push({
        id: 'auto-ord-m-' + mAdj.date,
        isAuto: true,
        priority: mAdj.adjusted ? 'urgent' : 'reminder',
        title: mAdj.adjusted
          ? `Monthly Jordan Banana Order — Adjusted for ${mAdj.reason}`
          : `Monthly Jordan Banana Order Due ${mAdj.date === today ? 'Today' : dLabel(mAdj.date)}`,
        body: mAdj.adjusted
          ? `3rd-Friday order (${dLabel(m3Fri)}) falls on or near ${mAdj.reason}. Submit & approve your monthly whole-case PO early on ${dLabel(mAdj.date)}. (${mLowCount} item(s) below par)`
          : `Monthly dry & frozen whole-case order for Jordan Banana is due ${dLabel(mAdj.date)}. (${mLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }
    return list;
  }

  function sortUsersByRoleAndName(list) { return [...(list || [])].sort((a, b) => (ROLE_RANK[normalizeRole(b.role)] || 0) - (ROLE_RANK[normalizeRole(a.role)] || 0) || (a.name || '').localeCompare(b.name || '')); }
  function isAdminRole(u) { return normalizeRole((u || getActiveUser()).role) === 'ADMIN'; }
  function canManageUserAccount(actor, target) {
    const a = actor || getActiveUser();

    if (!target) return false;
    if (target.id === 'usr-1') return false;
    const tRank = ROLE_RANK[normalizeRole(target.role)] || 0;

  // Auto-Learning Par Levels
  function recordUsage(item, amount) {
    if (amount <= 0) return;
    item.usage_log = item.usage_log || [];
    const now = Date.now();
    item.usage_log.push([now, amount]);
    item.usage_log = item.usage_log.filter(e => now - e[0] < 8 * WK_MS);
  }
  function relearnPars() {
    const weeks = Math.min(8, (Date.now() - (state.startTimestamp || Date.now())) / WK_MS);
    if (weeks < 1) return;
    const now = Date.now();
    state.items.forEach(x => {
      if (x.par_manual || !x.usage_log || !x.usage_log.length) return;
      let total = 0;
      x.usage_log.forEach(e => { if (now - e[0] <= weeks * WK_MS) total += e[1]; });
      if (total <= 0) return;
      const cycleWeeks = x.cadence === 'W' ? 1 : 4.33;
      x.par = Math.round(((total / weeks) * cycleWeeks * 1.25) * 100) / 100;
      x.par_learned = true;
    });
  }
  function learnMessage() {
    const weeks = (Date.now() - (state.startTimestamp || Date.now())) / WK_MS;
    if (weeks < 1) {
      return `Learning: ${Math.max(1, Math.ceil(7 - weeks * 7))} more day(s) of use needed before par levels auto-update.`;
    }
    return `Par levels auto-update from the last ${Math.min(8, Math.floor(weeks))} week(s) of use (+25% safety stock). Editing a par manually locks that item.`;
  }

  // Stock Status & Forecasting Helpers
  function itemStatus(x) {
    if (x.on_hand <= 0) return 'OUT';
    if (x.par > 0 && itemNeed(x) >= 1) return 'LOW';
    return 'OK';
  }
  function itemNeed(x) { return Math.max(0, Math.round(((Number(x.par) || 0) - (Number(x.on_hand) || 0)) * 100) / 100); }

  function serviceDaysBetween(startStr, endStr) {
    const res = [];
    let cur = startStr;
    while (cur <= endStr) {
      const dow = new Date(cur + 'T12:00:00').getDay();
      if ([1, 2, 3, 5].includes(dow) && !getFederalHoliday(cur)) res.push(cur);
      cur = addDays(cur, 1);
    }
    return res;
  }

  function getOpenServedHistory() {
    return (state.menuPlan || [])
      .filter(m => m.status === 'SERVED' && Number(m.served_portions) > 0 && m.circumstance !== 'Closed / Federal Holiday')
      .sort((a, b) => a.service_date.localeCompare(b.service_date));
  }

  function isNearFederalHoliday(dateStr) {
    for (let o = -3; o <= 3; o++) {
      if (o === 0) continue;
      const hol = getFederalHoliday(addDays(dateStr, o));
      if (hol) return hol;
    }
    return '';
  }

  function getForecastMetrics() {
    const open = getOpenServedHistory().slice(-210);
    const recent = open.slice(-40);
    const avgAll = open.length ? open.reduce((s, m) => s + Number(m.served_portions), 0) / open.length : 60;
    const avgRecent = recent.length ? recent.reduce((s, m) => s + Number(m.served_portions), 0) / recent.length : avgAll;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowFactor = {};
    [1, 2, 3, 5].forEach(d => {
      const arr = recent.filter(m => new Date(m.service_date + 'T12:00:00').getDay() === d);
      const dAvg = arr.length ? arr.reduce((s, m) => s + Number(m.served_portions), 0) / arr.length : avgRecent;
      dowFactor[dowNames[d]] = avgRecent > 0 ? Math.min(1.4, Math.max(0.65, dAvg / avgRecent)) : 1;
    });
    const buckets = { start: [], mid: [], end: [] };
    recent.forEach(m => {
      const day = parseInt(String(m.service_date).slice(8, 10), 10) || 15;
      buckets[day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end'].push(Number(m.served_portions));
    });
    const bucketFactor = {};
    ['start', 'mid', 'end'].forEach(k => {
      const arr = buckets[k];
      const bAvg = arr.length >= 2 ? arr.reduce((a, b) => a + b, 0) / arr.length : avgRecent;
      bucketFactor[k] = avgRecent > 0 ? Math.min(1.25, Math.max(0.8, bAvg / avgRecent)) : 1;
    });

    const mealMap = {};
    open.forEach(m => {
      const r = m.recipe_id ? state.recipes.find(x => x.id === m.recipe_id) : null;
      const title = ((r ? r.name : m.custom_title) || '').trim();
      if (!title || /bulk history/i.test(title)) return;
      const key = title.toLowerCase();
      if (!mealMap[key]) mealMap[key] = { title, vals: [] };
      mealMap[key].vals.push(Number(m.served_portions));
    });
    const mealStats = Object.values(mealMap).map(g => {
      const avg = g.vals.reduce((a, b) => a + b, 0) / g.vals.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.7, avg / avgRecent)) : 1;
      return { title: g.title, count: g.vals.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    }).sort((a, b) => b.avg - a.avg);

    function mealFactor(titleOrId) {
      if (!titleOrId) return 1;
      const r = state.recipes.find(x => x.id === titleOrId);
      const q = ((r ? r.name : titleOrId) || '').trim().toLowerCase();
      if (!q) return 1;
      const hit = mealStats.find(ms => ms.title.toLowerCase() === q || ms.title.toLowerCase().includes(q) || q.includes(ms.title.toLowerCase()));
      return hit ? hit.mult : 1;
    }

    const circMap = {};
    open.forEach(m => {
      const c = (m.circumstance || 'Normal Day').trim();
      if (!circMap[c]) circMap[c] = [];
      circMap[c].push(Number(m.served_portions));
    });
    const defaultCircMult = { 'Normal Day': 1, 'Holiday Week': 1.15, 'Local Event / Drive': 1.15, 'Snow / Cold Snap': 0.85, 'Heavy Rain / Storm': 0.88 };
    const circStats = Object.keys(circMap).map(c => {
      const arr = circMap[c];
      const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.6, avg / avgRecent)) : (defaultCircMult[c] || 1);
      return { name: c, count: arr.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    });
    function circFactor(cName) {
      if (!cName || cName === 'Normal Day') return 1;
      const hit = circStats.find(cs => cs.name === cName);
      return hit ? hit.mult : (defaultCircMult[cName] || 1);
    }

    const nearHolVals = open.filter(m => isNearFederalHoliday(m.service_date)).map(m => Number(m.served_portions));
    const nearHolAvg = nearHolVals.length >= 2 ? nearHolVals.reduce((a, b) => a + b, 0) / nearHolVals.length : avgRecent * 1.10;
    const nearHolFactor = avgRecent > 0 ? Math.min(1.35, Math.max(0.75, nearHolAvg / avgRecent)) : 1.10;

    return { openCount: open.length, avgAll, avgRecent, dowFactor, bucketFactor, mealStats, mealFactor, circStats, circFactor, nearHolFactor };
  }

  function suggestPortionsOverall() {
    const m = getForecastMetrics();
    return m.openCount ? Math.round(m.avgRecent * 1.1) : 65;
  }

  function predictedPortions(dateStr) {
    const f = forecastWeekday(dateStr);
    return f > 0 ? f : (suggestPortionsOverall() || 65);
  }

  function forecastWeekday(dateStr, mealTitleOrId, circumstance) {
    if (getFederalHoliday(dateStr)) return 0;
    const mp = (state.menuPlan || []).find(x => x.service_date === dateStr);
    if (mp && mp.status === 'CLOSED') return 0;
    const m = getForecastMetrics();
    if (!m.openCount) return 65;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dn = dowNames[new Date(dateStr + 'T12:00:00').getDay()];
    const day = parseInt(String(dateStr).slice(8, 10), 10) || 15;
    const bKey = day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end';
    const mRef = mealTitleOrId || (mp ? (mp.recipe_id || mp.custom_title) : '');
    const mMult = mRef ? m.mealFactor(mRef) : 1;
    const cRef = circumstance || (mp ? mp.circumstance : '');
    const cMult = cRef ? m.circFactor(cRef) : 1;
    const holMult = isNearFederalHoliday(dateStr) ? m.nearHolFactor : 1;
    const raw = m.avgRecent * (m.dowFactor[dn] || 1) * ((1 + (m.bucketFactor[bKey] || 1)) / 2) * mMult * cMult * holMult;
    return Math.max(10, Math.round(raw));
  }

  function onOrderQty(itemId) {
    let total = 0;
    (state.purchaseOrders || []).forEach(po => {
      if (['requested', 'approved', 'ordered'].includes(po.status)) {
        (po.lines || []).forEach(l => {
          if (l.item_id === itemId) total += Math.max(0, (l.qty || 0) - (l.received || 0));
        });
      }
    });
    return total;
  }

  function demandForDays(dayList) {
    const d = {};
    dayList.forEach(ds => {
      const mp = state.menuPlan.find(m => m.service_date === ds && m.status !== 'SERVED' && m.status !== 'CLOSED');
      if (!mp || !mp.recipe_id) return;
      const rec = state.recipes.find(r => r.id === mp.recipe_id);
      if (!rec) return;
      const portions = mp.planned_portions || predictedPortions(ds);
      (rec.ingredients || []).forEach(ing => {
        if (ing.inv_id && ing.per100) {
          d[ing.inv_id] = (d[ing.inv_id] || 0) + (ing.per100 * portions) / 100;
        }
      });
    });
    return d;
  }

  function suggestedOrderAmount(x, d7, d30) {
    const dem = (x.cadence === 'W' ? d7 : d30)[x.id] || 0;
    const demTarget = Math.round(dem * 1.1 * 100) / 100;
    const target = Math.max(Number(x.par) || 0, demTarget);
    const gap = Math.round((target - (Number(x.on_hand) || 0) - onOrderQty(x.id)) * 100) / 100;
    if (gap <= 0) return 0;
    if ((Number(x.on_hand) || 0) <= 0 && target > 0) return Math.max(1, Math.floor(gap));
    return gap >= 1 ? Math.floor(gap) : 0;
  }

  async function rpcLogin(userId, pin) {
    const { data, error } = await sbClient.rpc('kms_login', { p_user_id: userId, p_pin: String(pin) });
    if (error) return { ok: false, error: 'network' };
    return data || { ok: false, error: 'network' };
  }
  async function rpcSetPin(actorId, actorPin, targetId, newPin, mustChange) {
    const { data, error } = await sbClient.rpc('kms_set_pin', {
      p_actor_id: actorId, p_actor_pin: String(actorPin), p_target_id: targetId,
      p_new_pin: String(newPin), p_must_change: !!mustChange
    });
    if (error) return { ok: false, error: 'network' };
    return data || { ok: false, error: 'network' };
  }
  function pinErrorText(res) {
    if (!res) return 'Could not reach the cloud. Check Wi-Fi and try again.';
    if (res.error === 'locked') return `Too many wrong PINs. Try again in ${Math.max(1, Math.ceil((res.retry_seconds || 300) / 60))} min.`;
    if (res.error === 'bad_pin' || res.error === 'bad_actor_pin') return 'Incorrect PIN.';
    if (res.error === 'weak_pin') return 'Choose a stronger PIN (6+ characters, nothing obvious like 123456).';
    if (res.error === 'not_allowed') return 'Your role cannot change that account.';
    if (res.error === 'network') return 'Could not reach the cloud. Check Wi-Fi and try again.';
    return 'Sign-in failed.';
  }
  function randomTempPin() {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; const a = new Uint8Array(8);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a).map(b => chars[b % chars.length]).join('');
  }
  function stripLocalPins() { (state.users || []).forEach(u => { delete u.pin_hash; delete u.pin_salt; }); }
  function requireRelogin() {

  async function fetchAllRows(table, orderCol, maxRows) {
    const out = []; const page = 1000;
    for (let from = 0; from < maxRows; from += page) {
      const { data, error } = await sbClient.from(table).select('*').order(orderCol, { ascending: false }).range(from, from + page - 1);
      if (error || !data) break;
      out.push(...data);
      if (data.length < page) break;
    }
    return out;
  }

  let sbRealtimeChannel = null;
  let sbRefreshTimer = null;
  let sbRefreshing = false;

  async function refreshFromCloud() {
    if (!sbClient || sbRefreshing) return;
    sbRefreshing = true;
    try {
      const { data: invData, error } = await sbClient.from('kms_inventory_items').select('*');
      if (error) {
        syncStatus = 'local';
        updateSyncUI();
        return;
      }
      if (invData && invData.length > 0) {
        const [recR, mpR, poR, txAll, tagR, chkR, usrR, annR, msgR, safR, actR, setR, audR] = await Promise.all([
          sbClient.from('kms_recipes').select('*'),
          sbClient.from('kms_menu_plan').select('*'),
          sbClient.from('kms_purchase_orders').select('*'),
          fetchAllRows('kms_transactions', 'created_at', 3000),
          sbClient.from('kms_storage_tags').select('*'),
          sbClient.from('kms_checklists').select('*'),
          sbClient.from('kms_users').select('*'),
          sbClient.from('kms_announcements').select('*'),
          sbClient.from('kms_messages').select('*').order('created_at_ms', { ascending: true }).limit(50),
          sbClient.from('kms_safety_logs').select('*'),
          sbClient.from('kms_activity_logs').select('*').order('created_at_ms', { ascending: false }).limit(150),
          sbClient.from('kms_settings').select('*').eq('key', 'suggestions'),
          sbClient.from('kms_blind_audits').select('*').order('created_at', { ascending: false }).limit(60)
        ]);
        state.items = invData.map(normalizeInventoryItem);
        if (recR.data && recR.data.length) state.recipes = recR.data.map(normalizeRecipe);
        if (mpR.data && mpR.data.length) state.menuPlan = mpR.data;
        if (poR.data) state.purchaseOrders = poR.data;
        if (txAll && txAll.length) {
          const byTx = new Map();
          [...txAll, ...(state.transactions || [])].forEach(t => { if (t && t.id && !byTx.has(t.id)) byTx.set(t.id, t); });
          state.transactions = Array.from(byTx.values()).sort((a, b) => String(b.created_at || b.tx_date || '').localeCompare(String(a.created_at || a.tx_date || '')));
        }
        if (audR && audR.data && audR.data.length) {
          const byAud = new Map();
          [...audR.data.map(a => ({ id: a.id, audit_date: a.audit_date, auditor: a.auditor, zone: a.zone, rows: a.rows || [] })), ...(state.blindAudits || [])]
            .forEach(a => { if (a && a.id && !byAud.has(a.id)) byAud.set(a.id, a); });
          state.blindAudits = Array.from(byAud.values()).sort((a, b) => String(b.audit_date || '').localeCompare(String(a.audit_date || '')));
        }
        if (tagR.data) state.storageTags = tagR.data;
        if (chkR.data && chkR.data.length) state.checklists = chkR.data;
        if (usrR.data && usrR.data.length) { state.users = usrR.data; stripLocalPins(); state.cloudManaged = true; ensureOwnerIntegrity(); }
        if (annR.data) state.announcements = annR.data;
        if (msgR.data) state.messages = msgR.data;
        if (actR && actR.data && actR.data.length) {
          const byId = new Map();
          [...(state.activityLogs || []), ...actR.data].forEach(a => { if (a && a.id) byId.set(a.id, a); });
          state.activityLogs = Array.from(byId.values()).sort((a, b) => (Number(b.created_at_ms) || 0) - (Number(a.created_at_ms) || 0)).slice(0, 200);
        }
        if (setR && setR.data && setR.data[0] && setR.data[0].value) {
          const sv = setR.data[0].value;
          if (Array.isArray(sv.recipeSuggestions)) state.recipeSuggestions = sv.recipeSuggestions;
          if (Array.isArray(sv.menuSuggestions)) state.menuSuggestions = sv.menuSuggestions;
          if (Array.isArray(sv.donations)) {
            const byDon = new Map();
            [...sv.donations, ...(state.donations || [])].forEach(d => { if (d && d.id && !byDon.has(d.id)) byDon.set(d.id, d); });
            state.donations = Array.from(byDon.values());
          }
        }
        if (safR.data) {
          safR.data.forEach(s => { state.safetyLogs[s.log_date] = s; });
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      } else {
        syncStatus = 'live';
        await syncToSupabase();
      }
      syncStatus = 'live';
      updateSyncUI();
      render();
    } catch (e) {
      syncStatus = 'local';
      updateSyncUI();
    } finally {
      sbRefreshing = false;
    }
  }

  async function startCloud() {
    if (!sbClient) { syncStatus = 'local'; updateSyncUI(); return; }
    if (syncStatus !== 'live') { syncStatus = 'connecting'; updateSyncUI(); }
    await refreshFromCloud();
    if (!sbRealtimeChannel && sbClient) {
      sbRealtimeChannel = sbClient.channel('kms_relational_live')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          clearTimeout(sbRefreshTimer);
          sbRefreshTimer = setTimeout(() => { refreshFromCloud(); }, 900);
        }).subscribe();
    }
  }

  async function initSupabase() {
    if (!window.supabase || !window.supabase.createClient) {
      syncStatus = 'local';
      updateSyncUI();
      return;
    }
    if (!sbClient) {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    state.cloudManaged = true;
    stripLocalPins();
    await startCloud();
  }

  // Mandatory Modals (PIN Change & Training)
  function checkMandatoryModals() {
    const u = getActiveUser();
    const pinB = document.getElementById('pin-change-backdrop');
    const trnB = document.getElementById('training-backdrop');
    if (state.isLocked) {
      pinB.classList.add('hidden'); pinB.classList.remove('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    if (u.must_change_pin) {
      document.getElementById('pin-change-sub').textContent = `Hi ${u.name}, please set your personal 6+ character PIN before using the system.`;
      pinB.classList.remove('hidden'); pinB.classList.add('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    pinB.classList.add('hidden'); pinB.classList.remove('flex');
    const pendingTrn = (state.trainingModules || []).filter(m => (m.role === 'ALL' || normalizeRole(m.role) === normalizeRole(u.role)) && !(u.completed_training_ids || []).includes(m.id));
    if (pendingTrn.length && !u.onboarding_completed) {
      if (trainingStep >= pendingTrn.length) trainingStep = pendingTrn.length - 1;
      const mod = pendingTrn[trainingStep];
      document.getElementById('trn-title').textContent = mod.title;
      document.getElementById('trn-body').textContent = mod.content;
      document.getElementById('trn-step').textContent = `${trainingStep + 1} / ${pendingTrn.length}`;
      document.getElementById('btn-trn-prev').disabled = trainingStep === 0;
      document.getElementById('btn-trn-next').textContent = trainingStep === pendingTrn.length - 1 ? 'Complete Training ✓' : 'Next →';
      trnB.classList.remove('hidden'); trnB.classList.add('flex');
    } else {
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
    }
  }

  function renderMenu(main) {

    const today = localDateStr();
    const days = [];
    for (let i = -3; i <= 21; i++) {
      const ds = addDays(today, i);
      const dow = new Date(ds + 'T12:00:00').getDay();
      if ([1, 2, 3, 5].includes(dow)) days.push(ds);
    }
    const recOpts = state.recipes.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
    const isMgr = isMgmtOrHigher();

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold">Menu Planner (Mon / Tue / Wed / Fri)</h2>

          </div>
          ${(() => {
            const next1 = serviceDaysBetween(today, addDays(today, 7)).slice(0, 1);
            const next7 = serviceDaysBetween(today, addDays(today, 14)).slice(0, 4);
            const next30 = serviceDaysBetween(today, addDays(today, 30));
            const p1 = next1.reduce((s, d) => s + forecastWeekday(d), 0);
            const p7 = next7.reduce((s, d) => s + forecastWeekday(d), 0);
            const p30 = next30.reduce((s, d) => s + forecastWeekday(d), 0);
            return `
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                <div class="p-2.5 rounded-lg bg-black/5 border border-[var(--line)]"><strong>Daily (Next Service):</strong> <span class="text-[#b3122b] font-bold">${p1} portions</span></div>
                <div class="p-2.5 rounded-lg bg-black/5 border border-[var(--line)]"><strong>Weekly (Next 4 Services):</strong> <span class="text-[#b3122b] font-bold">${p7} portions</span></div>
                <div class="p-2.5 rounded-lg bg-black/5 border border-[var(--line)]"><strong>Monthly (Next 30 Days):</strong> <span class="text-[#b3122b] font-bold">${p30} portions</span></div>

              <button type="submit" class="kms-btn-navy px-3 py-1.5 text-xs">Fill Empty Days</button>
            </form>
          ` : `
            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 text-xs no-print">
              <span class="opacity-75">Menu schedule changes require <strong>ADMIN</strong> or <strong>MANAGER</strong> approval.</span>
              ${isStaffOrHigher() ? `<button type="button" id="btn-suggest-menu" class="kms-btn-primary px-3 py-1.5 text-xs">+ Suggest Recipe / Menu Change</button>` : ''}
            </div>
          `}
        </div>

        <div class="space-y-2">
          ${days.map(ds => {
            const hol = getFederalHoliday(ds);
            const mp = state.menuPlan.find(m => m.service_date === ds) || { service_date: ds, recipe_id: '', planned_portions: forecastWeekday(ds), status: hol ? 'CLOSED' : 'PLANNED' };
            return `

                      ${state.recipes.map(r => `<option value="${r.id}" ${mp.recipe_id === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}

  function renderDailySheet(main, dateStr) {
    const mp = state.menuPlan.find(m => m.service_date === dateStr) || {};
    const rec = state.recipes.find(r => r.id === mp.recipe_id);
    if (!rec) { state.selectedSheetDate = null; renderMenu(main); return; }
    const n = mp.planned_portions || predictedPortions(dateStr);
    const f = n / (rec.base_servings || 65);

    const byLoc = {};
    (rec.ingredients || []).forEach(g => {
      const x = g.inv_id ? state.items.find(i => i.id === g.inv_id) : null;
      if (x && g.per100) {
        (byLoc[x.location] = byLoc[x.location] || []).push({ item: x, amt: (g.per100 * n) / 100 });
      }
    });

    main.innerHTML = `
      <div class="kms-card print-flow p-5 space-y-4">
        <div class="flex flex-wrap gap-2 justify-between items-center no-print">
          <button type="button" id="btn-back-menu" class="kms-btn-alt px-3 py-1.5 text-xs">&larr; Back to Menu</button>

          ${(rec.allergens || []).length ? `<p class="text-xs font-bold text-[#b3122b]">ALLERGENS: ${esc(rec.allergens.join(', '))}</p>` : ''}
          <p class="text-xs mt-1"><strong>Portions Planned: ${n}</strong> &nbsp;|&nbsp; Served: _______ &nbsp;|&nbsp; Cook: ______________</p>
        </div>
        <div>
          <h3 class="text-sm font-bold border-b border-[var(--line)] pb-1 mb-2">Scaled Ingredients</h3>
          <table class="w-full text-xs">
            <thead><tr class="border-b border-[var(--line)] uppercase opacity-65"><th class="py-1 text-left">Ingredient</th><th class="py-1 text-right">Amount Needed</th></tr></thead>
            <tbody>
              ${(rec.ingredients || []).map(g => `<tr class="border-b border-[var(--line)]"><td class="py-1.5">&#9744; ${esc(g.name)}</td><td class="py-1.5 text-right font-bold">${esc(formatKitchenAmt((g.qty || 0) * f, g.unit))}</td></tr>`).join('')}
            </tbody>

  // 7. RECIPES
  function parsePastedRecipe(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const name = lines[0] || 'Imported Recipe';
    let servings = 4;
    const srvMatch = raw.match(/servings?\s*[:\-]?\s*(\d+)/i) || raw.match(/makes?\s*(\d+)/i);
    if (srvMatch) servings = Math.max(1, parseInt(srvMatch[1], 10));

    const allergenKeywords = {
      milk: /milk|butter|cheese|cream|yogurt|cheddar|mozzarella|parmesan/i,
      eggs: /\beggs?\b/i,
      wheat: /flour|pasta|spaghetti|penne|noodles|macaroni|bread|biscuit|cracker|wheat/i,
      soy: /\bsoy\b|tofu/i,
      peanuts: /peanut/i,
      'tree nuts': /almond|walnut|pecan|cashew/i,
      fish: /tuna|salmon|fish|cod/i,
      shellfish: /shrimp|crab|lobster/i,
      sesame: /sesame|tahini/i
    };
    const allergens = Object.keys(allergenKeywords).filter(a => allergenKeywords[a].test(raw));

    const ingredients = [];
    const steps = [];
    let mode = 'ing';
    lines.slice(1).forEach(ln => {
      if (/^(directions|instructions|steps|method)/i.test(ln)) { mode = 'step'; return; }
      if (/^(ingredients)/i.test(ln)) { mode = 'ing'; return; }
      if (mode === 'step' || /^\d+[\.\)]\s/.test(ln)) {
        steps.push(ln.replace(/^\d+[\.\)]\s*/, ''));
      } else {
        ingredients.push(parseIngredientLine(ln, servings));
      }
    });
    return normalizeRecipe({ id: uid('rec'), name, category: 'Main Entree', base_servings: servings, prep_min: 20, cook_min: 35, allergens, steps, ingredients });
  }

  // 11. FORECASTING & SERVED
  function renderForecasting(main) {
    const today = localDateStr();
    const fc = getForecastMetrics();
    const hz = state.horizon || 'days';
    let rows = [];

    const whatIfMeal = state._fcMealFilter || '';
    const whatIfCirc = state._fcCircFilter || 'Normal Day';
    const circMult = fc.circFactor(whatIfCirc);
    const mealMult = whatIfMeal ? fc.mealFactor(whatIfMeal) : 1;

    if (hz === 'days') {
      const days = serviceDaysBetween(today, addDays(today, 14)).slice(0, 7);
      rows = days.map(d => {
        const pred = forecastWeekday(d, whatIfMeal, whatIfCirc);
        return { label: dLabel(d), predicted: pred, prep: pred > 0 ? Math.max(10, Math.ceil(pred / 5) * 5) : 0 };
      });
    } else if (hz === 'weeks') {
      for (let i = 1; i <= 8; i++) {
        const p = Math.round(fc.avgRecent * 4 * mealMult * circMult);
        rows.push({ label: 'Week +' + i, predicted: p, prep: Math.round(p * 1.05) });
      }
    } else if (hz === 'months') {
      const mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const curM = new Date().getMonth();
      for (let i = 1; i <= 12; i++) {
        const p = Math.round(fc.avgRecent * 17 * mealMult * circMult);
        rows.push({ label: mNames[(curM + i) % 12], predicted: p, prep: Math.round(p * 1.05) });
      }
    } else {
      const curY = new Date().getFullYear();
      for (let i = 0; i < 3; i++) {
        const p = Math.round(fc.avgRecent * 200 * (1 + 0.03 * i) * mealMult * circMult);
        rows.push({ label: String(curY + i), predicted: p, prep: Math.round(p * 1.05) });
      }
    }

    const history = (state.menuPlan || [])
      .filter(m => m.status === 'SERVED' || m.served_portions !== null && m.served_portions !== undefined)
      .sort((a, b) => b.service_date.localeCompare(a.service_date));

            <select name="circumstance" class="kms-input text-sm">
              <option>Normal Day</option>
              <option>Closed / Federal Holiday</option>

          <button type="submit" class="kms-btn-primary px-4 py-2 text-sm">Save &amp; Update Forecast</button>
        </form>

        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <div>
              <h3 class="text-sm font-bold">Attendance Forecast &amp; Trend Breakdown</h3>
              <p class="text-xs opacity-75">${fc.openCount ? `Based on ${fc.openCount} open service(s) · Overall avg: <strong>${fc.avgAll.toFixed(1)}</strong>/day · Recent avg: <strong>${fc.avgRecent.toFixed(1)}</strong>/day` : 'No past attendance logged yet — using 65 baseline.'}</p>

                  return `<span class="tag ${pct >= 5 ? 'tag-OUT' : pct <= -5 ? 'tag-LOW' : 'tag-OK'}">${d}: ${pct >= 0 ? '+' : ''}${pct}%</span>`;

          <!-- Count Rows -->
          ${!sectionItems.length ? '<p class="text-xs opacity-70 py-2">No matching items in this section.</p>' : mode === 'hardcopy' ? `

  // 13. MONTHLY REPORT
  function renderReport(main) {
    if (!isMgmtOrHigher()) {
      main.innerHTML = `
        <div class="kms-card p-6 max-w-lg mx-auto text-center space-y-2">
          <div class="tag tag-OUT inline-block">MANAGEMENT ONLY</div>
          <h2 class="text-base font-bold">Restricted Executive &amp; Funding Reports</h2>
          <p class="text-xs opacity-75">This section contains financial, donation, and management reports and is restricted to Management accounts.</p>
        </div>
      `;
      return;
    }

    const today = localDateStr();
    const rm = state.reportMonth || today.slice(0, 7);
    const rangeMode = state.reportRange || 'month';
    const months = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push(localDateStr(d).slice(0, 7));
    }

    let startStr = rm + '-01';
    let endStr = rm + '-31';
    let periodLabel = `Month: ${rm}`;
    if (rangeMode === '30d') { startStr = addDays(today, -29); endStr = today; periodLabel = `Last 30 Days (${startStr} to ${today})`; }
    else if (rangeMode === '90d') { startStr = addDays(today, -89); endStr = today; periodLabel = `Last 90 Days (${startStr} to ${today})`; }
    else if (rangeMode === 'ytd') { startStr = today.slice(0, 4) + '-01-01'; endStr = today; periodLabel = `Year-to-Date (${today.slice(0, 4)})`; }
    else if (rangeMode === '365d') { startStr = addDays(today, -364); endStr = today; periodLabel = `Last 12 Months (${startStr} to ${today})`; }

    const inPeriod = (ds) => { const s = String(ds || '').slice(0, 10); return s >= startStr && s <= endStr; };

    const servedDays = state.menuPlan.filter(m => m.status === 'SERVED' && inPeriod(m.service_date));
    const meals = servedDays.reduce((s, m) => s + (m.served_portions || 0), 0);
    const avgPerDay = servedDays.length ? (meals / servedDays.length) : 0;

    const recvs = state.transactions.filter(t => t.tx_type === 'RECEIVE' && inPeriod(t.tx_date));
    const donatedRecvs = recvs.filter(t => /donat|food bank/i.test(t.source || ''));
    const purchasedRecvs = recvs.filter(t => !/donat|food bank/i.test(t.source || ''));
    const spend = purchasedRecvs.reduce((s, t) => {
      const item = state.items.find(i => i.id === t.item_id);
      const unitP = Number(t.cost || (item ? item.unit_price : 0) || 0);
      return s + (t.cost ? Number(t.cost) : (Number(t.qty || 0) * unitP));
    }, 0);
    const costPerMeal = meals > 0 && spend > 0 ? (spend / meals) : 0;

    const waste = state.transactions.filter(t => t.tx_type === 'WASTE' && inPeriod(t.tx_date));
    const savedLeftovers = (state.storageTags || []).filter(t => t.status === 'USED' && inPeriod(t.prep_date)).length;

    let checks = 0, fails = 0;
    Object.keys(state.safetyLogs || {}).filter(d => inPeriod(d)).forEach(d => {
      const t = state.safetyLogs[d].temps || {};
      TEMP_CHECKS.forEach((c, i) => {
        if (t[i] === undefined || t[i] === null || t[i] === '') return;
        checks++;
        if (c[1] === 'max' ? Number(t[i]) > c[2] : Number(t[i]) < c[2]) fails++;
      });
    });
    const safetyPct = checks ? Math.round(((checks - fails) / checks) * 100) : null;

    const activeItems = state.items.filter(x => !x.discontinued);
    const stockValue = activeItems.reduce((s, x) => s + (x.on_hand || 0) * (x.unit_price || 0), 0);
    const lowItems = activeItems.filter(x => itemStatus(x) !== 'OK').map(x => {
      const needCases = x.on_hand <= 0 ? Math.max(1, Math.floor(x.par || 1)) : Math.floor(itemNeed(x));
      const estCost = needCases * (x.unit_price || 0);
      return { item: x, needCases, estCost };
    }).sort((a, b) => b.needCases - a.needCases);
    const restockCost = lowItems.reduce((s, r) => s + r.estCost, 0);
    const parHealthPct = activeItems.length ? Math.round(((activeItems.length - lowItems.length) / activeItems.length) * 100) : 100;

    const fc = getForecastMetrics();
    const proj30Meals = Math.round(fc.avgRecent * 17);
    const proj90Meals = Math.round(fc.avgRecent * 51);
    const proj365Meals = Math.round(fc.avgRecent * 204);
    const benchPerMeal = costPerMeal > 0 ? costPerMeal : 3.25;
    const usingBench = costPerMeal <= 0;
    const proj30Budget = Math.round(proj30Meals * benchPerMeal);
    const proj90Budget = Math.round(proj90Meals * benchPerMeal);
    const proj365Budget = Math.round(proj365Meals * benchPerMeal);
    const next7Days = serviceDaysBetween(today, addDays(today, 14)).slice(0, 7);
    const next7Meals = next7Days.reduce((s, d) => s + forecastWeekday(d), 0);
    const peakDow = Object.entries(fc.dowFactor || {}).sort((a, b) => b[1] - a[1])[0];

    const suggestions = [];
    if (lowItems.length > 0) {
      suggestions.push(`<strong>Restock Funding / Purchase Request:</strong> ${lowItems.length} staple item(s) are below Par (${lowItems.reduce((s, r) => s + r.needCases, 0)} whole cases needed${restockCost > 0 ? ', est. $' + restockCost.toFixed(2) : ''}). Prioritize: ${lowItems.slice(0, 4).map(r => esc(r.item.name) + ' (' + r.needCases + ' cs)').join(', ')}.`);
    } else {
      suggestions.push('<strong>Inventory Readiness:</strong> 100% of active inventory items are at or above Par Level.');
    }
    if (donatedRecvs.length > 0 || purchasedRecvs.length > 0) {
      suggestions.push(`<strong>Donation Leverage:</strong> ${donatedRecvs.length} Food Bank / Donor check-in(s) and ${purchasedRecvs.length} vendor purchase(s) recorded in this period. Targeting in-kind donations for top-turn items (${lowItems.slice(0, 3).map(r => esc(r.item.name)).join(', ') || 'canned proteins & dry pasta'}) directly lowers cash cost per meal.`);
    }
    if (fc.avgRecent > 0) {
      suggestions.push(`<strong>Demand &amp; Staffing Outlook:</strong> Recent trend averages <strong>${fc.avgRecent.toFixed(1)} patrons/day</strong> (${proj90Meals.toLocaleString()} meals next quarter)${peakDow ? `; highest-turnout day is <strong>${peakDow[0]}</strong> (${Math.round((peakDow[1] - 1) * 100) >= 0 ? '+' : ''}${Math.round((peakDow[1] - 1) * 100)}% vs. avg)` : ''}. Plan prep &amp; volunteer coverage accordingly.`);
    }
    if (fails > 0) {
      suggestions.push(`<strong>Food Safety Action:</strong> ${fails} temperature check(s) were flagged out of range in this period — review equipment calibration and corrective actions before leadership audit.`);
    } else if (checks > 0) {
      suggestions.push(`<strong>Food Safety Compliance:</strong> 100% pass rate across ${checks} logged HACCP temperature check(s).`);
    }
    if (waste.length > 3) {
      suggestions.push(`<strong>Waste Reduction Opportunity:</strong> ${waste.length} waste entries logged — tighten FIFO rotation in Storage &amp; Date Labels and shift surplus to Leftovers Service.`);
    }

    const fundingBrief = [
      `THE SALVATION ARMY COMMUNITY MEALS (BUTLER, PA) — FUNDING & OPERATIONS BRIEF (${periodLabel})`,
      `• Community Impact: ${meals.toLocaleString()} hot lunches served across ${servedDays.length} open service day(s) (avg ${avgPerDay.toFixed(1)} patrons/day).`,
      `• Financial & Donation Snapshot: $${spend.toFixed(2)} vendor spend recorded (${costPerMeal > 0 ? '$' + costPerMeal.toFixed(2) + '/meal' : 'est. $3.25/meal benchmark'}), supplemented by ${donatedRecvs.length} in-kind/food bank deliveries. Current inventory value: $${stockValue.toFixed(2)} (${parHealthPct}% items at/above Par).`,
      `• Forecasted Need: Projecting ${proj30Meals.toLocaleString()} meals next 30 days (~$${proj30Budget.toLocaleString()}), ${proj90Meals.toLocaleString()} meals next 90 days (~$${proj90Budget.toLocaleString()}), and ${proj365Meals.toLocaleString()} meals annually (~$${proj365Budget.toLocaleString()}).`,
      `• Immediate Restock / Donation Priorities (${lowItems.length} items below Par${restockCost > 0 ? ', est. $' + restockCost.toFixed(2) : ''}): ${lowItems.slice(0, 6).map(r => r.item.name + ' (' + r.needCases + ' cases)').join('; ') || 'All items at Par'}.`,
      `• Compliance & Stewardship: ${safetyPct !== null ? safetyPct + '% HACCP temp pass rate (' + checks + ' checks)' : 'HACCP active'}, ${savedLeftovers} leftover container(s) safely reused via FIFO.`
    ].join('\n');

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="tag tag-OK">MANAGEMENT ONLY</span>
                <h2 class="text-lg font-bold">Executive, Funding &amp; Donation Reports</h2>
              </div>
              <p class="text-xs opacity-75">Dynamic operational stats, demand forecasts, restock funding needs, and ready-to-share leadership &amp; grant briefs (${esc(periodLabel)}).</p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 no-print">
              <button type="button" id="btn-copy-funding-brief" class="kms-btn-primary px-3 py-1.5 text-xs">Copy Funding Brief</button>
              <button type="button" id="btn-export-exec-csv" class="kms-btn-alt px-3 py-1.5 text-xs">Export CSV</button>
              <button type="button" id="btn-print-exec-report" class="kms-btn-navy px-3 py-1.5 text-xs">Print Report (Letter)</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-1.5 text-xs no-print">
            ${[['month', 'By Month'], ['30d', 'Last 30 Days'], ['90d', 'Last 90 Days'], ['ytd', 'Year-to-Date'], ['365d', 'Last 12 Months']].map(([k, lbl]) => `
              <button type="button" data-rep-range="${k}" class="px-2.5 py-1 rounded-lg border font-semibold ${rangeMode === k ? 'bg-[#b3122b] text-white border-[#b3122b]' : 'border-[var(--line)] hover:bg-black/5'}">${lbl}</button>
            `).join('')}
            ${rangeMode === 'month' ? `<select id="rep-month" class="kms-input text-xs ml-1">${months.map(m => `<option ${m === rm ? 'selected' : ''}>${m}</option>`).join('')}</select>` : ''}
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
          <div class="kms-card p-4 print-keep">
            <div class="text-xs uppercase opacity-65 font-semibold">Meals Served</div>
            <div class="text-2xl font-bold text-[#b3122b] mt-1">${meals.toLocaleString()}</div>
            <div class="text-xs opacity-75 mt-1">${servedDays.length} service day(s) &bull; Avg ${avgPerDay.toFixed(1)}/day</div>
          </div>
          <div class="kms-card p-4 print-keep">
            <div class="text-xs uppercase opacity-65 font-semibold">Food Spend &amp; Donations</div>
            <div class="text-2xl font-bold mt-1">$${spend.toFixed(2)}</div>
            <div class="text-xs opacity-75 mt-1">${costPerMeal > 0 ? '$' + costPerMeal.toFixed(2) + ' / meal' : 'Est. $3.25/meal'} &bull; ${donatedRecvs.length} donated drop(s)</div>
          </div>
          <div class="kms-card p-4 print-keep">
            <div class="text-xs uppercase opacity-65 font-semibold">Inventory &amp; Restock Gap</div>
            <div class="text-2xl font-bold mt-1">${parHealthPct}% At Par</div>
            <div class="text-xs opacity-75 mt-1">Stock value: $${stockValue.toFixed(2)} &bull; ${lowItems.length} item(s) below par</div>
          </div>
          <div class="kms-card p-4 print-keep">
            <div class="text-xs uppercase opacity-65 font-semibold">Safety &amp; Stewardship</div>
            <div class="text-2xl font-bold text-emerald-700 mt-1">${safetyPct !== null ? safetyPct + '% Pass' : 'N/A'}</div>
            <div class="text-xs opacity-75 mt-1">${checks} temp check(s), ${fails} flagged &bull; ${waste.length} waste / ${savedLeftovers} reused</div>
          </div>
        </div>

        <div class="kms-card p-4 space-y-3 print-keep">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <div>
              <h3 class="text-sm font-bold">Demand Forecasts &amp; Funding Projections</h3>
              <p class="text-xs opacity-75">Based on ${fc.openCount} recorded open service day(s) (recent trend: ${fc.avgRecent.toFixed(1)} patrons/day)${usingBench ? ' &bull; Using $3.25/meal benchmark where item prices are blank' : ''}.</p>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5">
              <div class="font-bold uppercase opacity-65">Next 7 Service Days</div>
              <div class="text-lg font-bold mt-1">${next7Meals.toLocaleString()} meals</div>
              <div class="opacity-75">Est. food need: $${Math.round(next7Meals * benchPerMeal).toLocaleString()}</div>
            </div>
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5">

              <div class="text-lg font-bold mt-1">${proj30Meals.toLocaleString()} meals</div>
              <div class="opacity-75">Est. budget: $${proj30Budget.toLocaleString()}</div>
            </div>
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5">
              <div class="font-bold uppercase opacity-65">Next 90 Days (Quarterly)</div>
              <div class="text-lg font-bold mt-1">${proj90Meals.toLocaleString()} meals</div>
              <div class="opacity-75">Est. budget: $${proj90Budget.toLocaleString()}</div>
            </div>

              <div class="font-bold uppercase opacity-65">Annual Projection (12 Mo)</div>
              <div class="text-lg font-bold text-[#b3122b] mt-1">${proj365Meals.toLocaleString()} meals</div>
              <div class="opacity-75">Est. annual budget: $${proj365Budget.toLocaleString()}</div>
            </div>
          </div>

  function invokeScrapeRecipe(payload) {
    const fallbackClientFetch = async (url) => {
      if (!url) throw new Error('Edge Function unavailable');
      const r = await fetch('https://r.jina.ai/' + url, { headers: { 'Accept': 'text/plain' } });
      if (!r.ok) throw new Error('Could not fetch recipe from URL (HTTP ' + r.status + '). Try copying and pasting the recipe text below.');
      const md = await r.text();
      const lines = md.split(/\r?\n/).map(l => l.trim());
      let name = '', baseServings = 4, mode = 'none';
      const ingredients = [], steps = [];
      for (const raw of lines) {
        if (!raw) continue;
        const tm = raw.match(/^Title:\s*(.+)$/i);
        if (tm && !name) { name = tm[1].replace(/\s*[-|].*(Allrecipes|Food Network|Recipe).*$/i, '').trim(); continue; }
        if (!name && /^#\s+/.test(raw)) { name = raw.replace(/^#+\s*/, '').trim(); continue; }
        const ym = raw.match(/^(?:Yield|Servings|Serves)\s*:?\s*(\d+)/i);
        if (ym) { baseServings = Math.max(1, Number(ym[1])); continue; }
        if (/^#{1,4}\s*Ingredients\b|^Ingredients\s*:?$/i.test(raw)) { mode = 'ing'; continue; }
        if (/^#{1,4}\s*(?:Directions|Instructions|Method|Steps)\b|^(?:Directions|Instructions|Method)\s*:?$/i.test(raw)) { mode = 'step'; continue; }
        if (/^#{1,4}\s*(?:Nutrition|Reviews|Shop|Related|More|Video|Cook's Note|Notes)\b/i.test(raw)) { if (ingredients.length && steps.length) break; mode = 'none'; continue; }
        const clean = raw.replace(/^[-*•\[\]xX\s]+(?=[A-Za-z0-9¼½¾⅓⅔⅛])/, '').replace(/^\*+|\*+$/g, '').trim();
        if (!clean || /^!\[|^\[.*\]\(http/.test(raw)) continue;
        if (mode === 'ing' && clean.length < 180) ingredients.push(clean);
        else if (mode === 'step') { const st = clean.replace(/^\d+[\.\)]\s*/, '').trim(); if (st.length > 8) steps.push(st); }
      }
      if (!ingredients.length) throw new Error('No recipe ingredients found on that page. Copy and paste the recipe text below instead.');
      return { ok: true, recipe: { name: name || 'Imported Recipe', category: 'Main Entree', base_servings: baseServings, prep_min: 20, cook_min: 35, ingredients, steps, source_url: url } };
    };

    return edgeFetch('scrape-recipe', { body: JSON.stringify(payload) })
      .then(async res => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || (data && data.ok === false)) {
          if (payload && payload.url) return await fallbackClientFetch(payload.url);
          throw new Error((data && data.error) || ('Edge Function HTTP ' + res.status));
        }
        return data;
      })
      .catch(async err => {
        if (payload && payload.url) return await fallbackClientFetch(payload.url);
        throw err;
      });
  }
