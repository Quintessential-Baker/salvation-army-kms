  function formatRepeatLabel(a) {

  function isAnnouncementActiveToday(a, nowObj) {
    const now = nowObj || new Date();

    if (a.expires_at && a.expires_at < todayStr) return false;
    const rep = a.repeat_rule || 'none';
    if (rep === 'none') {
      if (!a.alert_at) return true;
      const goLiveMs = new Date(a.alert_at).getTime();
      return isNaN(goLiveMs) || goLiveMs <= now.getTime();
    }
    const startStr = (a.alert_at && a.alert_at.slice(0, 10)) || a.created_at || todayStr;
    if (todayStr < startStr) return false;
    if (a.alert_at && a.alert_at.includes('T')) {

  const KITCHEN_UNITS = ['tsp', 'tbsp', 'fl oz', 'cups', 'pints', 'quarts', 'gallons', 'oz', 'lbs', 'pieces', 'cans', 'boxes', 'bags', 'packs', 'cases', 'to taste'];
  const UNIT_ALIASES = {
    teaspoon: 'tsp', teaspoons: 'tsp', tsp: 'tsp',
    tablespoon: 'tbsp', tablespoons: 'tbsp', tbsp: 'tbsp', tbs: 'tbsp',
    'fl oz': 'fl oz', floz: 'fl oz', 'fluid oz': 'fl oz',
    cup: 'cups', cups: 'cups', c: 'cups',
    pint: 'pints', pints: 'pints', pt: 'pints',
    quart: 'quarts', quarts: 'quarts', qt: 'quarts', qts: 'quarts',
    gallon: 'gallons', gallons: 'gallons', gal: 'gallons',
    ounce: 'oz', ounces: 'oz', oz: 'oz',
    pound: 'lbs', pounds: 'lbs', lb: 'lbs', lbs: 'lbs',
    gram: 'g', grams: 'g', g: 'g', kg: 'kg', ml: 'ml', l: 'l',
    piece: 'pieces', pieces: 'pieces', pc: 'pieces', pcs: 'pieces', each: 'pieces',
    can: 'cans', cans: 'cans', box: 'boxes', boxes: 'boxes', bag: 'bags', bags: 'bags',
    bottle: 'bottles', bottles: 'bottles', jug: 'jugs', jugs: 'jugs',
    pack: 'packs', packs: 'packs', 'case': 'cases', cases: 'cases', crate: 'crates', crates: 'crates'
  };
  const VOL_TSP = { tsp: 1, tbsp: 3, 'fl oz': 6, cups: 48, pints: 96, quarts: 192, gallons: 768, ml: 0.202884, l: 202.884 };
  const WT_OZ = { oz: 1, lbs: 16, g: 0.035274, kg: 35.274 };

  function normUnit(u) {
    const k = String(u || 'pieces').trim().toLowerCase();
    return UNIT_ALIASES[k] || k || 'pieces';
  }
  function convertCulinaryUnit(qty, fromU, toU) {
    const f = normUnit(fromU), t = normUnit(toU);
    if (f === t) return qty;
    if (VOL_TSP[f] && VOL_TSP[t]) return (qty * VOL_TSP[f]) / VOL_TSP[t];
    if (WT_OZ[f] && WT_OZ[t]) return (qty * WT_OZ[f]) / WT_OZ[t];
    return null;
  }
  function formatKitchenFraction(val) {
    const v = Math.max(0, Number(val) || 0);
    if (v === 0) return '0';
    const whole = Math.floor(v + 1e-6);
    const rem = v - whole;
    const fracs = [
      [0.125, '⅛'], [0.25, '¼'], [1/3, '⅓'], [0.375, '⅜'],
      [0.5, '½'], [0.625, '⅝'], [2/3, '⅔'], [0.75, '¾'], [0.875, '⅞']
    ];
    for (const [f, sym] of fracs) {
      if (Math.abs(rem - f) < 0.035) return (whole > 0 ? String(whole) : '') + sym;
    }
    if (rem > 0.965) return String(whole + 1);
    if (rem < 0.035 && whole > 0) return String(whole);
    return fmtNum(v);
  }
  function formatKitchenAmt(qty, unit) {
    const rawU = String(unit || '').trim().toLowerCase();
    if (rawU === 'to taste' || rawU === 'as needed') return 'To taste';
    let q = Number(qty) || 0;
    if (q <= 0) return 'To taste';
    let u = normUnit(unit);
    if (u === 'tsp' && q >= 3) { q = q / 3; u = 'tbsp'; }
    if (u === 'cups' && q > 0 && q < 0.25) { q = q * 16; u = 'tbsp'; }
    if (u === 'tbsp' && q > 0 && q < 1) { q = q * 3; u = 'tsp'; }
    else if (u === 'tbsp' && q >= 16) { q = q / 16; u = 'cups'; }
    if (u === 'oz' && q >= 16) { q = q / 16; u = 'lbs'; }
    else if (u === 'lbs' && q > 0 && q < 1) { q = q * 16; u = 'oz'; }
    if (u === 'quarts' && q > 0 && q < 1) { q = q * 4; u = 'cups'; }
    if (u === 'gallons' && q > 0 && q < 1) { q = q * 4; u = 'quarts'; }
    return formatKitchenFraction(q) + ' ' + u;
  }
  function recomputeIngredientPer100(ing, baseServings) {
    const base = Math.max(1, Number(baseServings) || 65);
    const inv = ing.inv_id ? state.items.find(x => x.id === ing.inv_id) : null;
    if (!inv) return;
    if (Number(ing.stock_per_unit) > 0) {
      ing.per100 = Math.round(((Number(ing.qty) || 0) / Number(ing.stock_per_unit)) * (100 / base) * 1000) / 1000;
      return;
    }
    const conv = convertCulinaryUnit(Number(ing.qty) || 0, ing.unit, inv.unit);
    if (conv !== null) {
      ing.per100 = Math.round(conv * (100 / base) * 1000) / 1000;
    }
  }

  function parseIngredientLine(rawLine, baseServings) {
    const uniMap = { '⅛': ' 1/8', '¼': ' 1/4', '⅓': ' 1/3', '⅜': ' 3/8', '½': ' 1/2', '⅝': ' 5/8', '⅔': ' 2/3', '¾': ' 3/4', '⅞': ' 7/8' };
    let ln = String(rawLine || '').trim();
    Object.keys(uniMap).forEach(k => { ln = ln.split(k).join(uniMap[k]); });
    ln = ln.replace(/^[-*•]\s*/, '').replace(/\s+/g, ' ').trim();
    const m = ln.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*(fl\s+oz|[a-zA-Z#]+)?\s+(.+)$/i);
    if (!m) return { name: ln, qty: 0, unit: 'to taste', inv_id: '', stock_per_unit: 0, per100: 0 };
    const parseFrac = (tok) => {
      const parts = String(tok).trim().split(/\s+/);
      let sum = 0;
      parts.forEach(p => {
        if (p.includes('/')) { const [a, b] = p.split('/').map(Number); sum += b ? (a / b) : 0; }
        else sum += parseFloat(p) || 0;
      });
      return sum || 1;
    };
    const q = parseFrac(m[1]);
    const rawU = (m[3] || '').toLowerCase();
    const knownUnit = rawU && (UNIT_ALIASES[rawU] || KITCHEN_UNITS.includes(rawU));
    const unit = knownUnit ? normUnit(rawU) : 'pieces';
    const ingName = (knownUnit ? m[4] : ((m[3] ? m[3] + ' ' : '') + m[4])).trim();
    const words = ingName.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
    const matchInv = state.items.find(i => {
      const iname = i.name.toLowerCase();
      return words.some(w => iname.includes(w));
    });
    const ingObj = { name: ingName, qty: Math.round(q * 100) / 100, unit, inv_id: matchInv ? matchInv.id : '', stock_per_unit: 0, per100: 0 };
    recomputeIngredientPer100(ingObj, baseServings);
    return ingObj;
  }

  function normalizeRecipe(r) {
    if (!r || typeof r !== 'object') return r;

    const rawSteps = Array.isArray(r.steps) && r.steps.length

  function getFederalHoliday(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d.getTime())) return '';
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), dow = d.getDay();
    if (m === 1 && day === 1) return "New Year's Day";
    if (m === 1 && dow === 1 && day >= 15 && day <= 21) return 'MLK Jr. Day';
    if (m === 2 && dow === 1 && day >= 15 && day <= 21) return "Presidents' Day";
    if (m === 5 && dow === 1 && day >= 25) return 'Memorial Day';
    if (m === 6 && day === 19) return 'Juneteenth';
    if (m === 7 && day === 4) return 'Independence Day';
    if (m === 9 && dow === 1 && day <= 7) return 'Labor Day';
    if (m === 10 && dow === 1 && day >= 8 && day <= 14) return 'Columbus Day';
    if (m === 11 && day === 11) return 'Veterans Day';
    if (m === 11) {
      const nov1Dow = new Date(y, 10, 1).getDay();
      const thx = 1 + ((4 - nov1Dow + 7) % 7) + 21;
      if (day === thx) return 'Thanksgiving Day';
      if (day === thx + 1) return 'Thanksgiving Friday (Closed)';
    }
    if (m === 12 && day === 25) return 'Christmas Day';
    return '';
  }

  function getThirdFriday(year, month0) {

  function isHolidayOrClosedDay(ds) {

  function adjustOrderDateForHoliday(targetDateStr) {
    let d = targetDateStr;
    const holOn = isHolidayOrClosedDay(d);
    const holPrev = getFederalHoliday(addDays(d, -1));
    const holNext = getFederalHoliday(addDays(d, 1));
    const nearHol = holOn || holPrev || holNext;
    if (!nearHol) return { date: d, adjusted: false, reason: '' };
    let cursor = d;
    for (let i = 0; i < 7; i++) {
      const dow = new Date(cursor + 'T12:00:00').getDay();
      if ([1, 2, 3, 4, 5].includes(dow) && !isHolidayOrClosedDay(cursor) && !getFederalHoliday(addDays(cursor, 1))) {
        return { date: cursor, adjusted: cursor !== targetDateStr, reason: nearHol };
      }
      cursor = addDays(cursor, -1);
    }
    return { date: d, adjusted: false, reason: nearHol };
  }

  function getAutoHolidayAndOrderAnnouncements(todayStr) {
    const today = todayStr || localDateStr();
    const list = [];

    const holHits = [];
    for (let i = 0; i <= 14; i++) {
      const ds = addDays(today, i);
      const h = getFederalHoliday(ds);
      if (h) holHits.push({ date: ds, name: h, daysAway: i });
    }
    if (holHits.length) {
      const first = holHits[0];
      const labels = holHits.map(x => `${dLabel(x.date)} (${x.name})`).join(', ');
      list.push({
        id: 'auto-hol-' + first.date,
        isAuto: true,
        priority: 'urgent',
        title: `Upcoming Holiday Closing: ${first.name}`,
        body: `Salvation Army Community Kitchen is closed on ${labels}. Plan extra portions on the open service day before the holiday and adjust deliveries accordingly.`,
        author: 'Holiday Schedule',
        created_at: today
      });
    }

    const todayDow = new Date(today + 'T12:00:00').getDay();
    const daysToFri = (5 - todayDow + 7) % 7;
    const nextFri = addDays(today, daysToFri);
    const wAdj = adjustOrderDateForHoliday(nextFri);
    const wLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'W' && itemStatus(x) !== 'OK').length;
    if (wAdj.date >= today && wAdj.date <= addDays(today, 4)) {
      list.push({
        id: 'auto-ord-w-' + wAdj.date,
        isAuto: true,
        priority: wAdj.adjusted ? 'urgent' : 'reminder',
        title: wAdj.adjusted
          ? `Weekly Marberger & Produce Order — Adjusted for ${wAdj.reason}`
          : `Weekly Marberger & Produce Order Due ${wAdj.date === today ? 'Today' : dLabel(wAdj.date)}`,
        body: wAdj.adjusted
          ? `Normal Friday order (${dLabel(nextFri)}) falls on or near ${wAdj.reason}. Submit & approve your weekly PO early on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`
          : `Review Orders & POs and submit your weekly Marberger & Produce order on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }

    const nowD = new Date(today + 'T12:00:00');
    let m3Fri = getThirdFriday(nowD.getFullYear(), nowD.getMonth());
    if (addDays(m3Fri, 1) < today) {
      const nextMo = new Date(nowD.getFullYear(), nowD.getMonth() + 1, 1, 12);
      m3Fri = getThirdFriday(nextMo.getFullYear(), nextMo.getMonth());
    }
    const mAdj = adjustOrderDateForHoliday(m3Fri);
    const mLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'M' && itemStatus(x) !== 'OK').length;
    if (mAdj.date >= today && mAdj.date <= addDays(today, 7)) {
      list.push({
        id: 'auto-ord-m-' + mAdj.date,
        isAuto: true,
        priority: mAdj.adjusted ? 'urgent' : 'reminder',
        title: mAdj.adjusted

        body: mAdj.adjusted

          : `Monthly dry & frozen whole-case order for Jordan Banana is due ${dLabel(mAdj.date)}. (${mLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }
    return list;
  }

  // Role Access Control (ADMIN, MANAGER, STAFF, VOLUNTEER)
  const ROLE_TABS = {
    ADMIN: ['dashboard', 'stock', 'orders', 'receive', 'menu', 'prep', 'recipes', 'safety', 'storage', 'checklists', 'forecasting', 'records', 'report', 'users', 'help'],

  function normalizeRole(role) {
    const r = String(role || '').trim().toUpperCase();
    if (r === 'ADMIN') return 'ADMIN';
    if (r === 'MANAGER') return 'MANAGER';
    if (r === 'STAFF') return 'STAFF';
    if (r === 'VOLUNTEER') return 'VOLUNTEER';
    return 'VOLUNTEER';
  }
  const ROLE_RANK = { ADMIN: 4, MANAGER: 3, STAFF: 2, VOLUNTEER: 1 };
  function sortUsersByRoleAndName(list) { return [...(list || [])].sort((a, b) => (ROLE_RANK[normalizeRole(b.role)] || 0) - (ROLE_RANK[normalizeRole(a.role)] || 0) || (a.name || '').localeCompare(b.name || '')); }
  function isAdminRole(u) { return normalizeRole((u || getActiveUser()).role) === 'ADMIN'; }
  function canManageUserAccount(actor, target) {
    const a = actor || getActiveUser();
    const aRole = normalizeRole(a.role);
    if (aRole !== 'ADMIN' && aRole !== 'MANAGER') return false;
    if (!target) return false;
    if (target.id === 'usr-1') return false;
    const tRank = ROLE_RANK[normalizeRole(target.role)] || 0;
    const aRank = ROLE_RANK[aRole] || 0;
    return aRole === 'ADMIN' ? tRank <= aRank : tRank < aRank;
  }
  function isMgmtOrHigher(u) { const r = normalizeRole((u || getActiveUser()).role); return r === 'ADMIN' || r === 'MANAGER'; }
  function isStaffOrHigher(u) { const r = normalizeRole((u || getActiveUser()).role); return r === 'ADMIN' || r === 'MANAGER' || r === 'STAFF'; }

  function getActiveUser() {

  // Auto-Learning Par Levels
  function recordUsage(item, amount) {
    if (amount <= 0) return;
    item.usage_log = item.usage_log || [];
    const now = Date.now();
    item.usage_log.push([now, amount]);
    item.usage_log = item.usage_log.filter(e => now - e[0] < 8 * WK_MS);
  }
  function relearnPars() {
    const weeks = Math.min(8, (Date.now() - (state.startTimestamp || Date.now())) / WK_MS);
    if (weeks < 1) return;
    const now = Date.now();
    state.items.forEach(x => {
      if (x.par_manual || !x.usage_log || !x.usage_log.length) return;
      let total = 0;
      x.usage_log.forEach(e => { if (now - e[0] <= weeks * WK_MS) total += e[1]; });
      if (total <= 0) return;
      const cycleWeeks = x.cadence === 'W' ? 1 : 4.33;
      x.par = Math.round(((total / weeks) * cycleWeeks * 1.25) * 100) / 100;
      x.par_learned = true;
    });
  }
  function learnMessage() {
    const weeks = (Date.now() - (state.startTimestamp || Date.now())) / WK_MS;
    if (weeks < 1) {
      return `Learning: ${Math.max(1, Math.ceil(7 - weeks * 7))} more day(s) of use needed before par levels auto-update.`;
    }
    return `Par levels auto-update from the last ${Math.min(8, Math.floor(weeks))} week(s) of use (+25% safety stock). Editing a par manually locks that item.`;
  }

  // Stock Status & Forecasting Helpers
  function itemStatus(x) {
    if (x.on_hand <= 0) return 'OUT';
    if (x.par > 0 && itemNeed(x) >= 1) return 'LOW';
    return 'OK';
  }
  function itemNeed(x) { return Math.max(0, Math.round(((Number(x.par) || 0) - (Number(x.on_hand) || 0)) * 100) / 100); }

  function serviceDaysBetween(startStr, endStr) {
    const res = [];
    let cur = startStr;
    while (cur <= endStr) {
      const dow = new Date(cur + 'T12:00:00').getDay();
      if ([1, 2, 3, 5].includes(dow) && !getFederalHoliday(cur)) res.push(cur);
      cur = addDays(cur, 1);
    }
    return res;
  }

  function getOpenServedHistory() {
    return (state.menuPlan || [])
      .filter(m => m.status === 'SERVED' && Number(m.served_portions) > 0 && m.circumstance !== 'Closed / Federal Holiday')
      .sort((a, b) => a.service_date.localeCompare(b.service_date));
  }

  function isNearFederalHoliday(dateStr) {
    for (let o = -3; o <= 3; o++) {
      if (o === 0) continue;
      const hol = getFederalHoliday(addDays(dateStr, o));
      if (hol) return hol;
    }
    return '';
  }

  function getForecastMetrics() {
    const open = getOpenServedHistory().slice(-210);
    const recent = open.slice(-40);
    const avgAll = open.length ? open.reduce((s, m) => s + Number(m.served_portions), 0) / open.length : 60;
    const avgRecent = recent.length ? recent.reduce((s, m) => s + Number(m.served_portions), 0) / recent.length : avgAll;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowFactor = {};
    [1, 2, 3, 5].forEach(d => {
      const arr = recent.filter(m => new Date(m.service_date + 'T12:00:00').getDay() === d);
      const dAvg = arr.length ? arr.reduce((s, m) => s + Number(m.served_portions), 0) / arr.length : avgRecent;
      dowFactor[dowNames[d]] = avgRecent > 0 ? Math.min(1.4, Math.max(0.65, dAvg / avgRecent)) : 1;
    });
    const buckets = { start: [], mid: [], end: [] };
    recent.forEach(m => {
      const day = parseInt(String(m.service_date).slice(8, 10), 10) || 15;
      buckets[day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end'].push(Number(m.served_portions));
    });
    const bucketFactor = {};
    ['start', 'mid', 'end'].forEach(k => {
      const arr = buckets[k];
      const bAvg = arr.length >= 2 ? arr.reduce((a, b) => a + b, 0) / arr.length : avgRecent;
      bucketFactor[k] = avgRecent > 0 ? Math.min(1.25, Math.max(0.8, bAvg / avgRecent)) : 1;
    });

    const mealMap = {};
    open.forEach(m => {
      const r = m.recipe_id ? state.recipes.find(x => x.id === m.recipe_id) : null;
      const title = ((r ? r.name : m.custom_title) || '').trim();
      if (!title || /bulk history/i.test(title)) return;
      const key = title.toLowerCase();
      if (!mealMap[key]) mealMap[key] = { title, vals: [] };
      mealMap[key].vals.push(Number(m.served_portions));
    });
    const mealStats = Object.values(mealMap).map(g => {
      const avg = g.vals.reduce((a, b) => a + b, 0) / g.vals.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.7, avg / avgRecent)) : 1;
      return { title: g.title, count: g.vals.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    }).sort((a, b) => b.avg - a.avg);

    function mealFactor(titleOrId) {
      if (!titleOrId) return 1;
      const r = state.recipes.find(x => x.id === titleOrId);
      const q = ((r ? r.name : titleOrId) || '').trim().toLowerCase();
      if (!q) return 1;
      const hit = mealStats.find(ms => ms.title.toLowerCase() === q || ms.title.toLowerCase().includes(q) || q.includes(ms.title.toLowerCase()));
      return hit ? hit.mult : 1;
    }

    const circMap = {};
    open.forEach(m => {
      const c = (m.circumstance || 'Normal Day').trim();
      if (!circMap[c]) circMap[c] = [];
      circMap[c].push(Number(m.served_portions));
    });
    const defaultCircMult = { 'Normal Day': 1, 'Holiday Week': 1.15, 'Local Event / Drive': 1.15, 'Snow / Cold Snap': 0.85, 'Heavy Rain / Storm': 0.88 };
    const circStats = Object.keys(circMap).map(c => {
      const arr = circMap[c];
      const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.6, avg / avgRecent)) : (defaultCircMult[c] || 1);
      return { name: c, count: arr.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    });
    function circFactor(cName) {
      if (!cName || cName === 'Normal Day') return 1;
      const hit = circStats.find(cs => cs.name === cName);
      return hit ? hit.mult : (defaultCircMult[cName] || 1);
    }

    const nearHolVals = open.filter(m => isNearFederalHoliday(m.service_date)).map(m => Number(m.served_portions));
    const nearHolAvg = nearHolVals.length >= 2 ? nearHolVals.reduce((a, b) => a + b, 0) / nearHolVals.length : avgRecent * 1.10;
    const nearHolFactor = avgRecent > 0 ? Math.min(1.35, Math.max(0.75, nearHolAvg / avgRecent)) : 1.10;

    return { openCount: open.length, avgAll, avgRecent, dowFactor, bucketFactor, mealStats, mealFactor, circStats, circFactor, nearHolFactor };
  }

  function suggestPortionsOverall() {
    const m = getForecastMetrics();
    return m.openCount ? Math.round(m.avgRecent * 1.1) : 65;
  }

  function forecastWeekday(dateStr, mealTitleOrId, circumstance) {
    if (getFederalHoliday(dateStr)) return 0;
    const mp = (state.menuPlan || []).find(x => x.service_date === dateStr);
    if (mp && mp.status === 'CLOSED') return 0;
    const m = getForecastMetrics();
    if (!m.openCount) return 65;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dn = dowNames[new Date(dateStr + 'T12:00:00').getDay()];
    const day = parseInt(String(dateStr).slice(8, 10), 10) || 15;
    const bKey = day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end';
    const mRef = mealTitleOrId || (mp ? (mp.recipe_id || mp.custom_title) : '');
    const mMult = mRef ? m.mealFactor(mRef) : 1;
    const cRef = circumstance || (mp ? mp.circumstance : '');
    const cMult = cRef ? m.circFactor(cRef) : 1;
    const holMult = isNearFederalHoliday(dateStr) ? m.nearHolFactor : 1;
    const raw = m.avgRecent * (m.dowFactor[dn] || 1) * ((1 + (m.bucketFactor[bKey] || 1)) / 2) * mMult * cMult * holMult;
    return Math.max(10, Math.round(raw));
  }

  function onOrderQty(itemId) {
    let total = 0;
    (state.purchaseOrders || []).forEach(po => {
      if (['requested', 'approved', 'ordered'].includes(po.status)) {
        (po.lines || []).forEach(l => {
          if (l.item_id === itemId) total += Math.max(0, (l.qty || 0) - (l.received || 0));
        });
      }
    });
    return total;
  }

  function demandForDays(dayList) {
    const d = {};
    dayList.forEach(ds => {
      const mp = state.menuPlan.find(m => m.service_date === ds && m.status !== 'SERVED' && m.status !== 'CLOSED');
      if (!mp || !mp.recipe_id) return;
      const rec = state.recipes.find(r => r.id === mp.recipe_id);
      if (!rec) return;
      const portions = mp.planned_portions || forecastWeekday(ds) || 65;
      (rec.ingredients || []).forEach(ing => {
        if (ing.inv_id && ing.per100) {
          d[ing.inv_id] = (d[ing.inv_id] || 0) + (ing.per100 * portions) / 100;
        }
      });
    });
    return d;
  }

  function suggestedOrderAmount(x, d7, d30) {
    const dem = (x.cadence === 'W' ? d7 : d30)[x.id] || 0;
    const demTarget = Math.round(dem * 1.1 * 100) / 100;
    const target = Math.max(Number(x.par) || 0, demTarget);
    const gap = Math.round((target - (Number(x.on_hand) || 0) - onOrderQty(x.id)) * 100) / 100;
    if (gap <= 0) return 0;
    if ((Number(x.on_hand) || 0) <= 0 && target > 0) return Math.max(1, Math.floor(gap));
    return gap >= 1 ? Math.floor(gap) : 0;
  }

  // Supabase Relational Sync Engine (14 Normalized Tables)
  function updateSyncUI() {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (!dot || !lbl) return;
    if (syncStatus === 'live') {
      dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
      lbl.textContent = 'Live Supabase Sync';
    } else if (syncStatus === 'connecting') {
      dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      lbl.textContent = 'Connecting...';
    } else {
      dot.className = 'w-2 h-2 rounded-full bg-rose-400';
      lbl.textContent = 'Local Mode';
    }
  }

  async function syncToSupabase() {
    if (!sbClient || syncStatus === 'local') return;
    try {
      await Promise.allSettled([
        sbClient.from('kms_inventory_items').upsert(state.items.map(x => ({
          id: x.id, sku: x.sku, name: x.name, location: x.location, category: x.category,
          unit: x.unit, pack_label: x.pack_label, units_per_pack: x.units_per_pack || 1,
          on_hand: x.on_hand, par: x.par, par_manual: !!x.par_manual, par_learned: !!x.par_learned,
          cadence: x.cadence, vendor: x.vendor, unit_price: x.unit_price, usage_log: x.usage_log || [],
          discontinued: !!x.discontinued, updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_recipes').upsert(state.recipes.map(r => ({
          id: r.id, name: r.name, category: r.category, base_servings: r.base_servings,
          prep_min: r.prep_min || 20, cook_min: r.cook_min || 35, allergens: r.allergens || [],
          steps: r.steps || [], ingredients: r.ingredients || [],
          photo_url: r.photo_url || '', notes: r.notes || '', updated_at: new Date().toISOString()
        })), { onConflict: 'id' }).then(res => {
          if (res && res.error) {
            return sbClient.from('kms_recipes').upsert(state.recipes.map(r => ({
              id: r.id, name: r.name, category: r.category, base_servings: r.base_servings,
              prep_min: r.prep_min || 20, cook_min: r.cook_min || 35, allergens: r.allergens || [],
              steps: r.steps || [], ingredients: r.ingredients || [], updated_at: new Date().toISOString()
            })), { onConflict: 'id' });
          }
        }),
        sbClient.from('kms_menu_plan').upsert(state.menuPlan.map(m => ({
          id: m.id, service_date: m.service_date, recipe_id: m.recipe_id || '', custom_title: m.custom_title || '',
          menu_type: m.menu_type || 'RECIPE', planned_portions: m.planned_portions || 65,
          served_portions: m.served_portions, status: m.status || 'PLANNED', circumstance: m.circumstance || 'Normal Day',
          note: m.note || '', logged_by: m.logged_by || '', prep_checked_items: m.prep_checked_items || {},
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_purchase_orders').upsert(state.purchaseOrders.map(p => ({
          id: p.id, po_number: p.po_number, vendor: p.vendor, cadence: p.cadence, status: p.status,
          requested_by: p.requested_by, requested_date: p.requested_date, approved_by: p.approved_by || '',

          vendor_conf: p.vendor_conf || '', notes: p.notes || '', lines: p.lines || [],
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_transactions').upsert(state.transactions.slice(0, 100).map(t => ({
          id: t.id, tx_date: t.tx_date, tx_type: t.tx_type, item_id: t.item_id || '', item_name: t.item_name,
          unit: t.unit, qty: t.qty, source: t.source || '', exp_date: t.exp_date || '', cleared: !!t.cleared,
          reason: t.reason || '', cost: t.cost || 0, po_number: t.po_number || '', staff_name: t.staff_name || '',
          note: t.note || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_storage_tags').upsert(state.storageTags.map(t => ({
          id: t.id, item_name: t.item_name, tag_category: t.tag_category || 'LEFTOVER', zone: t.zone,
          qty_label: t.qty_label || '', prep_date: t.prep_date, prep_time: t.prep_time || '',

          status: t.status || 'STORED', closed_by: t.closed_by || '', closed_at: t.closed_at || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_checklists').upsert(state.checklists.map(c => ({
          id: c.id, freq: c.freq, category: c.category, title: c.title, done: !!c.done,
          done_by: c.done_by || '', done_at: c.done_at || '', priority_carryover: !!c.priority_carryover
        })), { onConflict: 'id' }),
        sbClient.from('kms_users').upsert(state.users.map(u => ({
          id: u.id, name: u.name, role: normalizeRole(u.role), initials: u.initials, pin_hash: u.pin_hash,

        })), { onConflict: 'id' });
      }
      await sbClient.from('kms_settings').upsert({
        key: 'suggestions',
        value: { recipeSuggestions: (state.recipeSuggestions || []).slice(0, 50), menuSuggestions: (state.menuSuggestions || []).slice(0, 50) },
        updated_at: new Date().toISOString()
      }, { onConflict: 'key' });
    } catch (e) {}
  }

  let sbRealtimeChannel = null;
  let sbRefreshTimer = null;
  let sbRefreshing = false;
  let sbLastSelfWriteMs = 0;

  async function refreshFromCloud(forceFullRender) {
    if (!sbClient || sbRefreshing) return;
    sbRefreshing = true;
    try {
      const { data: invData, error } = await sbClient.from('kms_inventory_items').select('*');
      if (error) {
        if (syncStatus !== 'live') {
          syncStatus = 'local';
          updateSyncUI();
        }
        return;
      }
      if (invData && invData.length > 0) {
        const [recR, mpR, poR, txR, tagR, chkR, usrR, annR, msgR, safR, actR, setR] = await Promise.all([
          sbClient.from('kms_recipes').select('*'),
          sbClient.from('kms_menu_plan').select('*'),
          sbClient.from('kms_purchase_orders').select('*'),
          sbClient.from('kms_transactions').select('*').order('created_at', { ascending: false }).limit(120),
          sbClient.from('kms_storage_tags').select('*'),
          sbClient.from('kms_checklists').select('*'),
          sbClient.from('kms_users').select('*'),
          sbClient.from('kms_announcements').select('*'),
          sbClient.from('kms_messages').select('*').order('created_at_ms', { ascending: true }).limit(50),
          sbClient.from('kms_safety_logs').select('*'),
          sbClient.from('kms_activity_logs').select('*').order('created_at_ms', { ascending: false }).limit(150),
          sbClient.from('kms_settings').select('*').eq('key', 'suggestions')
        ]);
        state.items = invData;
        if (recR.data && recR.data.length) state.recipes = recR.data.map(normalizeRecipe);
        if (mpR.data && mpR.data.length) state.menuPlan = mpR.data;
        if (poR.data) state.purchaseOrders = poR.data;
        if (txR.data) state.transactions = txR.data;
        if (tagR.data) state.storageTags = tagR.data;
        if (chkR.data && chkR.data.length) state.checklists = chkR.data;
        if (usrR.data && usrR.data.length) { state.users = usrR.data; ensureOwnerIntegrity(); }
        if (annR.data) state.announcements = annR.data;
        if (msgR.data) state.messages = msgR.data;
        if (actR && actR.data && actR.data.length) {
          const byId = new Map();
          [...(state.activityLogs || []), ...actR.data].forEach(a => { if (a && a.id) byId.set(a.id, a); });
          state.activityLogs = Array.from(byId.values()).sort((a, b) => (Number(b.created_at_ms) || 0) - (Number(a.created_at_ms) || 0)).slice(0, 200);
        }
        if (setR && setR.data && setR.data[0] && setR.data[0].value) {
          const sv = setR.data[0].value;
          if (Array.isArray(sv.recipeSuggestions)) state.recipeSuggestions = sv.recipeSuggestions;
          if (Array.isArray(sv.menuSuggestions)) state.menuSuggestions = sv.menuSuggestions;
        }
        if (safR.data) {
          safR.data.forEach(s => { state.safetyLogs[s.log_date] = s; });
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      } else {
        syncStatus = 'live';
        await syncToSupabase();
      }
      syncStatus = 'live';
      updateSyncUI();
      if (forceFullRender || !document.activeElement || document.activeElement === document.body) {
        render();
      }
    } catch (e) {
      if (syncStatus !== 'live') {
        syncStatus = 'local';
        updateSyncUI();
      }
    } finally {
      sbRefreshing = false;
    }
  }

  async function initSupabase() {
    if (!window.supabase || !window.supabase.createClient) {
      syncStatus = 'local';
      updateSyncUI();
      return;
    }
    if (!sbClient) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (syncStatus !== 'live') {
      syncStatus = 'connecting';
      updateSyncUI();
    }
    await refreshFromCloud(true);
    if (!sbRealtimeChannel && sbClient) {
      sbRealtimeChannel = sbClient.channel('kms_relational_live')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          if (Date.now() - sbLastSelfWriteMs < 2500) return;
          clearTimeout(sbRefreshTimer);
          sbRefreshTimer = setTimeout(() => { refreshFromCloud(false); }, 1200);
        }).subscribe();
    }
  }

  function checkMandatoryModals() {
    const u = getActiveUser();
    const pinB = document.getElementById('pin-change-backdrop');

      pinB.classList.add('hidden'); pinB.classList.remove('flex');

      pinB.classList.remove('hidden'); pinB.classList.add('flex');

      return;
    }
    pinB.classList.add('hidden'); pinB.classList.remove('flex');

  // 13. COMPREHENSIVE KITCHEN REPORTS CENTER
  function renderReport(main) {
    if (!isMgmtOrHigher()) {
      main.innerHTML = `
        <div class="kms-card p-6 max-w-lg mx-auto text-center space-y-2">
          <div class="tag tag-OUT inline-block">MANAGEMENT ONLY</div>
          <h2 class="text-base font-bold">Restricted Kitchen &amp; Executive Reports</h2>
          <p class="text-xs opacity-75">This section contains financial, compliance, inventory, and management reports and is restricted to Management accounts.</p>
        </div>
      `;
      return;
    }

    const today = localDateStr();
    const rm = state.reportMonth || today.slice(0, 7);
    const rangeMode = state.reportRange || 'month';
    const subRep = state.reportType || 'exec';
    const invLocFilter = state._repInvLoc || 'ALL';
    const months = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push(localDateStr(d).slice(0, 7));
    }

    let startStr = rm + '-01';
    let endStr = rm + '-31';
    let periodLabel = `Month: ${rm}`;
    if (rangeMode === '30d') { startStr = addDays(today, -29); endStr = today; periodLabel = `Last 30 Days (${startStr} to ${today})`; }
    else if (rangeMode === '90d') { startStr = addDays(today, -89); endStr = today; periodLabel = `Last 90 Days (${startStr} to ${today})`; }
    else if (rangeMode === 'ytd') { startStr = today.slice(0, 4) + '-01-01'; endStr = today; periodLabel = `Year-to-Date (${today.slice(0, 4)})`; }
    else if (rangeMode === '365d') { startStr = addDays(today, -364); endStr = today; periodLabel = `Last 12 Months (${startStr} to ${today})`; }
    else if (rangeMode === 'all') { startStr = '2000-01-01'; endStr = '2099-12-31'; periodLabel = 'All-Time Records'; }

    const inPeriod = (ds) => { const s = String(ds || '').slice(0, 10); return s >= startStr && s <= endStr; };

    const servedDays = state.menuPlan.filter(m => m.status === 'SERVED' && inPeriod(m.service_date)).sort((a, b) => b.service_date.localeCompare(a.service_date));
    const meals = servedDays.reduce((s, m) => s + (m.served_portions || 0), 0);
    const plannedTotal = servedDays.reduce((s, m) => s + (m.planned_portions || 0), 0);
    const avgPerDay = servedDays.length ? (meals / servedDays.length) : 0;

    const recvs = state.transactions.filter(t => t.tx_type === 'RECEIVE' && inPeriod(t.tx_date));
    const donatedRecvs = recvs.filter(t => /donat|food bank/i.test(t.source || ''));
    const purchasedRecvs = recvs.filter(t => !/donat|food bank/i.test(t.source || ''));
    const spend = purchasedRecvs.reduce((s, t) => {
      const item = state.items.find(i => i.id === t.item_id);
      const unitP = Number(t.cost || (item ? item.unit_price : 0) || 0);
      return s + (t.cost ? Number(t.cost) : (Number(t.qty || 0) * unitP));
    }, 0);
    const costPerMeal = meals > 0 && spend > 0 ? (spend / meals) : 0;

    const waste = state.transactions.filter(t => t.tx_type === 'WASTE' && inPeriod(t.tx_date));
    const savedLeftovers = (state.storageTags || []).filter(t => t.status === 'USED' && inPeriod(t.prep_date)).length;
    const tossedLeftovers = (state.storageTags || []).filter(t => t.status === 'DISCARDED' && inPeriod(t.prep_date)).length;

    const safetyDates = Object.keys(state.safetyLogs || {}).filter(d => inPeriod(d)).sort((a, b) => b.localeCompare(a));
    let checks = 0, fails = 0;
    safetyDates.forEach(d => {
      const t = state.safetyLogs[d].temps || {};
      TEMP_CHECKS.forEach((c, i) => {
        if (t[i] === undefined || t[i] === null || t[i] === '') return;

  async function sendBackgroundAlert(recipients, subject, text) {
    if (!sbClient || !sbClient.functions) return false;
    const uniqueTo = Array.from(new Set((recipients || []).map(r => r.email).filter(Boolean)));
    if (!uniqueTo.length) return false;
    try {
      const { data, error } = await sbClient.functions.invoke('notify-alert', {

      });
      return !error && data && data.ok !== false;
    } catch (e) {
      return false;
    }
  }

  function invokeScrapeRecipe(payload) {
    const fallbackClientFetch = async (url) => {
      if (!url) throw new Error('Edge Function unavailable');
      const r = await fetch('https://r.jina.ai/' + url, { headers: { 'Accept': 'text/plain' } });
      if (!r.ok) throw new Error('Could not fetch recipe from URL (HTTP ' + r.status + '). Try copying and pasting the recipe text below.');
      const md = await r.text();
      const lines = md.split(/\r?\n/).map(l => l.trim());
      let name = '', baseServings = 4, mode = 'none';
      const ingredients = [], steps = [];
      for (const raw of lines) {
        if (!raw) continue;
        const tm = raw.match(/^Title:\s*(.+)$/i);
        if (tm && !name) { name = tm[1].replace(/\s*[-|].*(Allrecipes|Food Network|Recipe).*$/i, '').trim(); continue; }
        if (!name && /^#\s+/.test(raw)) { name = raw.replace(/^#+\s*/, '').trim(); continue; }
        const ym = raw.match(/^(?:Yield|Servings|Serves)\s*:?\s*(\d+)/i);
        if (ym) { baseServings = Math.max(1, Number(ym[1])); continue; }
        if (/^#{1,4}\s*Ingredients\b|^Ingredients\s*:?$/i.test(raw)) { mode = 'ing'; continue; }
        if (/^#{1,4}\s*(?:Directions|Instructions|Method|Steps)\b|^(?:Directions|Instructions|Method)\s*:?$/i.test(raw)) { mode = 'step'; continue; }
        if (/^#{1,4}\s*(?:Nutrition|Reviews|Shop|Related|More|Video|Cook's Note|Notes)\b/i.test(raw)) { if (ingredients.length && steps.length) break; mode = 'none'; continue; }
        const clean = raw.replace(/^[-*•\[\]xX\s]+(?=[A-Za-z0-9¼½¾⅓⅔⅛])/, '').replace(/^\*+|\*+$/g, '').trim();
        if (!clean || /^!\[|^\[.*\]\(http/.test(raw)) continue;
        if (mode === 'ing' && clean.length < 180) ingredients.push(clean);
        else if (mode === 'step') { const st = clean.replace(/^\d+[\.\)]\s*/, '').trim(); if (st.length > 8) steps.push(st); }
      }
      if (!ingredients.length) throw new Error('No recipe ingredients found on that page. Copy and paste the recipe text below instead.');
      return { ok: true, recipe: { name: name || 'Imported Recipe', category: 'Main Entree', base_servings: baseServings, prep_min: 20, cook_min: 35, ingredients, steps, source_url: url } };
    };

    if (sbClient && sbClient.functions) {
      return sbClient.functions.invoke('scrape-recipe', { body: payload }).then(async ({ data, error }) => {
        if (data && data.ok === false && data.error) throw new Error(data.error);
        if (error) {
          let detail = '';
          try {
            if (error.context && typeof error.context.json === 'function') {
              const errJson = await error.context.json();
              if (errJson && errJson.error) detail = errJson.error;
            }
          } catch (e) {}
          if (payload && payload.url) {
            return await fallbackClientFetch(payload.url);
          }
          throw new Error(detail || error.message || 'Edge Function error');
        }
        return data;
      });
    }
    return fetch(SUPABASE_URL + '/functions/v1/scrape-recipe', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

    const selRec = e.target.closest('[data-sel-rec]');

        const rawLines = meal.rawLines || [];
        const steps = meal.steps || [];
        const allText = (meal.title || '') + ' ' + rawLines.join(' ');
        const allergenKeywords = {
          milk: /milk|cheese|butter|cream|yogurt|dairy/i,

                <img id="rec-photo-preview" src="${esc(r.photo_url || '')}" alt="Preview" class="${r.photo_url ? '' : 'hidden '}w-14 h-14 rounded-lg object-cover border border-[var(--line)] shrink-0" />

    const slipPresetBtn = e.target.closest('[data-slip-preset]');

      } else {

      const s = (state.recipeSuggestions || []).find(x => x.id === appSug.dataset.approveRecsug);
      if (s) {

          ? normalizeRecipe({ ...s.parsed_recipe, id: uid('rec'), name: s.title, base_servings: Number(s.servings) || s.parsed_recipe.base_servings || 65 })
          : parsePastedRecipe(s.title + '\nServings: ' + (s.servings || 65) + '\n' + s.raw);
        parsed.name = s.title;
        parsed.base_servings = Number(s.servings) || parsed.base_servings || 65;

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div><label class="block font-semibold mb-1">Target Menu Date (Optional)</label><input name="targetDate" type="date" value="${esc(s.target_date || '')}" class="kms-input w-full text-xs" /></div>

            </div>
            <div><label class="block font-semibold mb-1">Photo URL (Optional)</label><input name="photoUrl" type="text" value="${esc(pr.photo_url || '')}" placeholder="https://..." class="kms-input w-full text-xs" /></div>

    const delAnnBtn = e.target.closest('[data-del-announcement]');

        state.announcements = (state.announcements || []).filter(a => a.id !== targetId);

        if (sbClient) sbClient.from('kms_announcements').delete().eq('id', targetId).then(() => {});

        render();
        showToast('Announcement deleted globally');

    if (daBtn) {

      if (id.startsWith('auto-')) {
        if (!state.dismissedAutoAnns) state.dismissedAutoAnns = {};
        if (!state.dismissedAutoAnns[uid2]) state.dismissedAutoAnns[uid2] = {};
        state.dismissedAutoAnns[uid2][id] = todayStr;
        saveState();
        render();
        showToast('Dismissed for today (will reappear tomorrow while active)');

      }
      const a = (state.announcements || []).find(x => x.id === id);
      if (a) {
        a.dismissed_by = a.dismissed_by || {};
        a.dismissed_by[uid2] = todayStr;
        logActivity('ANNOUNCEMENT DISMISSED', `Dismissed "${a.title}" for today`);
        saveState();
        render();
        showToast('Dismissed for today (will reappear tomorrow until expired)');
      }
      return;
    }

    if (e.target.id === 'btn-trn-prev' && trainingStep > 0) { trainingStep--; checkMandatoryModals(); return; }
    if (e.target.id === 'btn-trn-next') {
      const u = getActiveUser();
      const pending = state.trainingModules.filter(m => (m.role === 'ALL' || normalizeRole(m.role) === normalizeRole(u.role)) && !(u.completed_training_ids || []).includes(m.id));
      if (trainingStep < pending.length - 1) { trainingStep++; checkMandatoryModals(); }
      else {
        u.completed_training_ids = u.completed_training_ids || [];
        pending.forEach(m => { if (!u.completed_training_ids.includes(m.id)) u.completed_training_ids.push(m.id); });
        u.onboarding_completed = true;
        trainingStep = 0;
        logActivity('TRAINING', 'Completed mandatory onboarding');
        saveState();
        checkMandatoryModals();
        showToast('Training complete!');
      }
      return;
    }

    const editUsrBtn = e.target.closest('[data-edit-usr]');
    if (editUsrBtn) {
      const u = state.users.find(x => x.id === editUsrBtn.dataset.editUsr);
      const me = getActiveUser();
      const isSelfOwner = !!(u && u.id === 'usr-1' && me.id === 'usr-1');
      if (!u || (!canManageUserAccount(me, u) && !isSelfOwner)) { showToast('You can only edit accounts you manage', 'warn'); return; }
      const myRank = ROLE_RANK[normalizeRole(me.role)] || 0;
      const roleOpts = ['VOLUNTEER', 'STAFF', 'MANAGER', 'ADMIN'].filter(r => isAdminRole(me) ? ROLE_RANK[r] <= myRank : ROLE_RANK[r] < myRank);
      openModal(`Edit Account — ${u.name}`, `
        <form id="form-edit-usr" class="space-y-3 text-xs">
          <input type="hidden" name="userId" value="${esc(u.id)}" />
          <div><label class="block font-semibold mb-1">Full Name</label><input name="name" type="text" required value="${esc(u.name)}" class="kms-input w-full text-sm" /></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-semibold mb-1">Initials</label><input name="initials" type="text" maxlength="4" required value="${esc(u.initials)}" class="kms-input w-full text-sm uppercase" /></div>
            <div><label class="block font-semibold mb-1">Role</label>${isSelfOwner ? `<input type="hidden" name="role" value="ADMIN" /><input type="text" value="ADMIN" disabled class="kms-input w-full text-sm opacity-60" />` : `<select name="role" class="kms-input w-full text-sm">${roleOpts.map(r => `<option value="${r}" ${normalizeRole(u.role) === r ? 'selected' : ''}>${r}</option>`).join('')}</select>`}</div>
          </div>
          <div><label class="block font-semibold mb-1">Email (for Alerts &amp; PO Notifications)</label><input name="email" type="email" value="${esc(u.email || '')}" class="kms-input w-full text-xs" /></div>
          <button type="submit" class="kms-btn-primary w-full py-2 text-xs font-semibold">Save Account Changes</button>
        </form>
      `);
      return;
    }
    const delUsrBtn = e.target.closest('[data-del-usr]');
    if (delUsrBtn) {
      const u = state.users.find(x => x.id === delUsrBtn.dataset.delUsr);
      const me = getActiveUser();
      if (!u || !canManageUserAccount(me, u) || u.id === me.id) { showToast('You can only delete accounts lower than your role', 'warn'); return; }
      askConfirm('Delete User Permanently', `Permanently delete ${u.name} (${u.role})? This removes their login completely.`, () => {
        state.users = state.users.filter(x => x.id !== u.id);
        if (sbClient) sbClient.from('kms_users').delete().eq('id', u.id).then(() => {});
        logActivity('USER DELETED', `Permanently deleted ${u.name} (${u.role})`);
        saveState();
        render();
        showToast(`Deleted user ${u.name}`);
      });
      return;
    }
    const rpBtn = e.target.closest('[data-reset-pin]');
    if (rpBtn) {
      const u = state.users.find(x => x.id === rpBtn.dataset.resetPin);
      const me = getActiveUser();
      if (u && !canManageUserAccount(me, u) && !(u.id === 'usr-1' && me.id === 'usr-1')) {
        showToast('You can only reset PINs for accounts lower than your role', 'warn');
        return;
      }
      if (u) {
        u.pin_salt = newSalt();
        u.pin_hash = hashPin('123456', u.pin_salt);
        u.must_change_pin = true;
        saveState();
        showToast(`Reset ${u.name}'s PIN to temporary 123456`);
      }
      return;
    }
    const tuBtn = e.target.closest('[data-toggle-usr]');
    if (tuBtn) {
      const u = state.users.find(x => x.id === tuBtn.dataset.toggleUsr);
      if (u) {
        if (!canManageUserAccount(getActiveUser(), u)) { showToast('You can only deactivate accounts lower than your role', 'warn'); return; }
        u.active = u.active === false ? true : false;
        saveState();
        render();
      }
      return;
    }

    if (e.target.id === 'btn-bulk-served' || e.target.id === 'btn-bulk-reload') {
      const end = document.getElementById('bulk-end')?.value || localDateStr();
      const presetDays = e.target.id === 'btn-bulk-reload' ? null : -365;
      const start = document.getElementById('bulk-start')?.value || addDays(end, presetDays || -365);
      const dates = serviceDaysBetween(start, end).reverse();
      openModal('Bulk Enter Past Patrons Served (Up to 1 Year)', `
        <div class="space-y-3">
          <div class="flex flex-wrap items-end gap-2 p-2.5 rounded-lg bg-black/5 text-xs">
            <label class="font-bold">From<input id="bulk-start" type="date" value="${esc(start)}" class="kms-input block mt-1 text-xs" /></label>

          </div>

              <textarea name="csv" rows="4" required placeholder="2026-11-18, 64, Cold snap&#10;2026-11-16, 58&#10;11/13/2026, 71, Coat drive" class="kms-input w-full text-xs font-mono"></textarea>
              <button type="submit" class="kms-btn-ok px-3 py-1.5 text-xs">Import Pasted Rows</button>
            </form>
          </details>
          <form id="form-bulk-served" class="space-y-3">
            <div class="max-h-64 overflow-y-auto space-y-1.5">
              ${dates.map(ds => {
                const mp = state.menuPlan.find(m => m.service_date === ds);
                return `<div class="flex items-center gap-2 text-xs p-1.5 border-b border-[var(--line)]">
                  <span class="w-36 font-mono">${esc(ds)} (${dLabel(ds).split(',')[0]})</span>
                  <input type="number" min="0" name="sv_${ds}" value="${mp && mp.served_portions != null ? mp.served_portions : ''}" placeholder="Served" class="kms-input w-20 text-center font-bold" />
                  <input type="text" name="nt_${ds}" value="${mp ? esc(mp.note || '') : ''}" placeholder="Note (optional)" class="kms-input flex-1" />
                </div>`;
              }).join('')}
            </div>
            <button type="submit" class="kms-btn-primary w-full py-2 text-sm">Save All Entered Counts</button>

        </div>

          <form id="form-edit-srv" class="space-y-3">

              <label class="text-xs font-bold">Date<input name="date" type="date" value="${esc(mp.service_date)}" required class="kms-input w-full mt-1" /></label>

              <label class="text-xs font-bold">Served<input name="served" type="number" min="0" value="${mp.served_portions ?? 0}" required class="kms-input w-full mt-1" /></label>

            <select name="circumstance" class="kms-input w-full text-sm">
              ${['Normal Day','Closed / Federal Holiday','Snow / Cold Snap','Heavy Rain / Storm','Local Event / Drive','Holiday Week'].map(c => `<option ${(mp.circumstance || 'Normal Day') === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
            <input name="note" value="${esc(mp.note || '')}" placeholder="Notes" class="kms-input w-full text-sm" />
            <button type="submit" class="kms-btn-primary w-full py-2 text-sm">Save Changes</button>
          </form>
        `);
      }
      return;
    }
    const delSrvBtn = e.target.closest('[data-del-srv]');
    if (delSrvBtn) {
      askConfirm('Delete Service Record', 'Remove this past attendance record?', () => {
        state.menuPlan = state.menuPlan.filter(m => m.id !== delSrvBtn.dataset.delSrv);
        saveState();
        render();
        showToast('Deleted attendance record');
      });
      return;
    }
    if (e.target.id === 'btn-start-cam' && window.Html5Qrcode) {
      document.getElementById('cam-wrap').classList.remove('hidden');
      document.getElementById('btn-start-cam').classList.add('hidden');
      document.getElementById('btn-stop-cam').classList.remove('hidden');
      html5Qr = new window.Html5Qrcode('cam-reader');
      html5Qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 200 }, txt => {
        const m = state.items.find(i => i.sku.toLowerCase() === txt.trim().toLowerCase());
        if (m) { document.getElementById('recv-item').value = m.id; showToast('Scanned ' + m.name); }
        if (html5Qr) { html5Qr.stop().catch(() => {}); html5Qr = null; }
        document.getElementById('cam-wrap').classList.add('hidden');
      }, () => {}).catch(() => showToast('Camera unavailable in this preview', 'warn'));
      return;
    }
    if (e.target.id === 'btn-stop-cam' && html5Qr) {
      html5Qr.stop().catch(() => {}); html5Qr = null;
      document.getElementById('cam-wrap').classList.add('hidden');
      return;
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'stock-search') { state._stockSearch = e.target.value; render(); const el = document.getElementById('stock-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    if (e.target.id === 'rec-scale-inp' || e.target.id === 'rec-scale-slider') { state.recipeScale = Math.max(1, parseFloat(e.target.value) || 1); render(); return; }
    if (e.target.id === 'act-search-inp') { state._actSearch = e.target.value; render(); const el = document.getElementById('act-search-inp'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
    if (e.target.id === 'rec-search-inp') {
      state._recSearch = e.target.value;
      const q = state._recSearch.trim().toLowerCase();
      const exact = state.recipes.find(r => r.id.toLowerCase() === q);
      if (exact) { state.selectedRecipeId = exact.id; state._recSearch = ''; }
      render();
      const el = document.getElementById('rec-search-inp');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }
    if (e.target.matches('[data-blind-id]')) { state.blindDraft.counts[e.target.dataset.blindId] = e.target.value; saveState(); return; }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'act-cat-filter') { state._actCat = e.target.value; render(); return; }
    if (e.target.id === 'rec-photo-file') {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const ratio = img.width > maxW ? (maxW / img.width) : 1;
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * ratio);
          c.height = Math.round(img.height * ratio);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          const dataUrl = c.toDataURL('image/jpeg', 0.78);
          const urlInp = document.getElementById('rec-photo-url-inp');
          const prev = document.getElementById('rec-photo-preview');
          if (urlInp) urlInp.value = dataUrl;
          if (prev) { prev.src = dataUrl; prev.classList.remove('hidden'); }
        };
        img.src = String(reader.result || '');
      };
      reader.readAsDataURL(file);
      return;
    }
    if (e.target.id === 'po-edit-extra-sel') {
      const wrap = document.getElementById('po-edit-new-wrap');
      if (wrap) wrap.classList.toggle('hidden', e.target.value !== '__NEW__');
      return;
    }
    if (e.target.id === 'stock-loc') { state._stockLoc = e.target.value; render(); return; }
    if (e.target.id === 'order-hz') { state._orderHorizon = e.target.value; render(); return; }
    if (e.target.id === 'fc-whatif-meal') { state._fcMealFilter = e.target.value; render(); return; }
    if (e.target.id === 'fc-whatif-circ') { state._fcCircFilter = e.target.value; render(); return; }
    if (e.target.id === 'rep-month') { state.reportMonth = e.target.value; render(); return; }
    if (e.target.id === 'rep-inv-loc') { state._repInvLoc = e.target.value; render(); return; }
    const itemField = e.target.dataset.itemField;
    if (itemField) {
      const [id, f] = itemField.split(':');
      const x = state.items.find(i => i.id === id);
      if (x) {
        snapUndo();
        if (f === 'cadence') { x.cadence = e.target.value; x.vendor = x.cadence === 'W' ? 'Marberger / Produce' : 'Jordan Banana'; }
        else if (f === 'location') { x.location = e.target.value; }
        else {
          const v = Math.max(0, parseFloat(e.target.value) || 0);
          if (f === 'on_hand' && v < x.on_hand) recordUsage(x, x.on_hand - v);
          if (f === 'par') { x.par_manual = true; x.par_learned = false; }
          x[f] = v;
        }
        saveState();
        render();
      }
      return;
    }

    if (e.target.dataset.menuRec) {
      if (!isMgmtOrHigher()) { showToast('Only ADMIN or MANAGER can change the menu schedule', 'warn'); render(); return; }
      const ds = e.target.dataset.menuRec;
      let mp = state.menuPlan.find(m => m.service_date === ds);
      const rec = state.recipes.find(r => r.id === e.target.value);
      if (!mp) { mp = { id: uid('mp'), service_date: ds, planned_portions: forecastWeekday(ds), status: 'PLANNED' }; state.menuPlan.push(mp); }
      mp.recipe_id = e.target.value;
      mp.custom_title = rec ? rec.name : '';
      saveState();
      render();
      return;
    }
    if (e.target.dataset.menuPlan) {
      if (!isMgmtOrHigher()) { showToast('Only ADMIN or MANAGER can change planned portions', 'warn'); render(); return; }
      const ds = e.target.dataset.menuPlan;
      let mp = state.menuPlan.find(m => m.service_date === ds);
      if (!mp) { mp = { id: uid('mp'), service_date: ds, recipe_id: '', status: 'PLANNED' }; state.menuPlan.push(mp); }
      mp.planned_portions = Math.max(0, parseInt(e.target.value, 10) || 0);
      saveState();
      return;
    }
    if (e.target.dataset.prepChk) {
      const [mpId, itemId] = e.target.dataset.prepChk.split(':');
      const mp = state.menuPlan.find(m => m.id === mpId);
      if (mp) { mp.prep_checked_items = mp.prep_checked_items || {}; mp.prep_checked_items[itemId] = e.target.checked; saveState(); }
      return;
    }
    if (e.target.dataset.recBase) {
      const r = state.recipes.find(x => x.id === e.target.dataset.recBase);
      if (r) {
        r.base_servings = Math.max(1, parseFloat(e.target.value) || 1);
        (r.ingredients || []).forEach(ing => recomputeIngredientPer100(ing, r.base_servings));
        saveState();
        render();
      }
      return;
    }
    if (e.target.dataset.recIng) {
      const [rid, idx, f] = e.target.dataset.recIng.split(':');
      const r = state.recipes.find(x => x.id === rid);
      if (r && r.ingredients[idx]) {
        const ing = r.ingredients[idx];
        if (f === 'qty' || f === 'stock_per_unit' || f === 'per100') ing[f] = parseFloat(e.target.value) || 0;
        else ing[f] = e.target.value;
        if (f !== 'per100') recomputeIngredientPer100(ing, r.base_servings);
        logActivity('RECIPE EDITED', `${r.name}: updated ${ing.name} (${f})`);
        saveState();
        render();
      }
      return;
    }
    if (e.target.dataset.tempIdx !== undefined) {
      const today = localDateStr();
      const log = state.safetyLogs[today] = state.safetyLogs[today] || { temps: {}, cleaning: {} };
      log.temps[e.target.dataset.tempIdx] = e.target.value === '' ? null : parseFloat(e.target.value);
      log.logged_by = getActiveUser().name;
      logActivity('SAFETY TEMP', `${TEMP_CHECKS[e.target.dataset.tempIdx]?.[0] || 'Temp'}: ${e.target.value || 'cleared'}°F`);
      saveState();
      render();
      return;
    }
    if (e.target.dataset.cleanIdx !== undefined) {
      const today = localDateStr();
      const log = state.safetyLogs[today] = state.safetyLogs[today] || { temps: {}, cleaning: {} };
      log.cleaning[e.target.dataset.cleanIdx] = e.target.checked;
      logActivity('CLEANING LOG', `${CLEANING_TASKS[e.target.dataset.cleanIdx] || 'Task'}: ${e.target.checked ? 'Done' : 'Unchecked'}`);
      saveState();
      render();
      return;
    }
    if (e.target.dataset.chkId) {
      const c = state.checklists.find(x => x.id === e.target.dataset.chkId);
      if (c) {
        c.done = e.target.checked;
        c.done_by = c.done ? getActiveUser().name : '';
        c.done_at = c.done ? nowStamp() : '';
        if (c.done) c.priority_carryover = false;
        logActivity('CHECKLIST', c.title);
        saveState();
        render();
      }
      return;
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (state.isLocked && !['form-unlock', 'form-sb-auth'].includes(e.target.id)) return;
    const fd = new FormData(e.target);

    if (e.target.id === 'form-sb-auth') {
      const email = String(fd.get('email') || '').trim();
      const password = String(fd.get('password') || '');
      const errEl = document.getElementById('sb-auth-err');
      if (!sbClient || !sbClient.auth) {
        if (errEl) { errEl.textContent = 'Supabase cloud connection is offline.'; errEl.classList.remove('hidden'); }
        return;
      }
      if (errEl) errEl.classList.add('hidden');
      sbClient.auth.signInWithPassword({ email, password }).then(({ data, error }) => {
        if (error || !data || !data.user) {
          if (errEl) { errEl.textContent = (error && error.message) || 'Invalid Supabase Auth credentials.'; errEl.classList.remove('hidden'); }
          return;
        }
        const owner = ensureOwnerIntegrity();
        state.activeUserId = owner.id;
        state.isLocked = false;
        state._sbAuthEmail = data.user.email;
        setSessionUnlocked(true);
        logActivity('ADMIN SUPABASE AUTH', `${owner.name} verified via Supabase Auth (${data.user.email})`);
        saveState();
        closeModal();
        render();
        showToast(`Verified via Supabase Auth (${data.user.email})`);
      });
      return;
    }

    if (e.target.id === 'form-unlock' || e.target.id === 'form-switch-user') {
      const u = state.users.find(x => x.id === fd.get('userId') && x.active !== false);
      if (!u || !verifyPin(u, fd.get('pin'))) {
        if (u) { logActivity('LOGIN FAILED', `Incorrect PIN attempt for ${u.name}`); saveState(); }
        document.getElementById(e.target.id === 'form-unlock' ? 'unlock-err' : 'sw-err')?.classList.remove('hidden');
        return;
      }
      state.activeUserId = u.id;
      state.isLocked = false;
      setSessionUnlocked(true);
      trainingStep = 0;
      logActivity('LOGIN', `${u.name} signed in`);
      saveState();
      closeModal();
      render();
      return;
    }

    if (e.target.id === 'form-force-pin') {
      const p1 = String(fd.get('newPin') || '').trim();
      const p2 = String(fd.get('confirmPin') || '').trim();
      const err = document.getElementById('force-pin-err');
      if (p1.length < 6 || WEAK_PINS.includes(p1)) { err.textContent = 'Choose a stronger 6+ character PIN.'; err.classList.remove('hidden'); return; }
      if (p1 !== p2) { err.textContent = 'PINs do not match.'; err.classList.remove('hidden'); return; }
      const u = getActiveUser();
      u.pin_salt = newSalt();
      u.pin_hash = hashPin(p1, u.pin_salt);
      u.must_change_pin = false;
      saveState();
      checkMandatoryModals();
      showToast('Personal PIN saved');
      return;
    }

    if (e.target.id === 'form-add-item') {
      const loc = String(fd.get('location') || LOCATIONS[0]);
      const prefix = /freezer/i.test(loc) ? 'FRZ' : /cooler/i.test(loc) ? 'CLR' : /kitchen dry/i.test(loc) ? 'KDG' : 'STK';
      const item = {
        id: uid('item'), sku: prefix + '-' + String(state.items.length + 101), name: fd.get('name').trim(),
        location: loc, category: 'General', unit: fd.get('unit').trim() || 'cases',
        pack_label: fd.get('unit').trim() || 'cases', units_per_pack: 1,
        on_hand: parseFloat(fd.get('onHand')) || 0, par: parseFloat(fd.get('par')) || 1,
        par_manual: false, par_learned: false, cadence: fd.get('cadence'),
        vendor: fd.get('cadence') === 'W' ? 'Marberger / Produce' : 'Jordan Banana',
        unit_price: null, usage_log: [], discontinued: false
      };
      state.items.push(item);
      logActivity('ADD ITEM', `${item.name} (${loc})`);
      saveState();
      closeModal();
      render();
      showToast(`Added ${item.name}`);
      return;
    }

    if (e.target.classList && e.target.classList.contains('form-create-po')) {
      const cad = e.target.dataset.cad;
      const lines = [];
      state.items.filter(x => !x.discontinued && x.cadence === cad).forEach(x => {
        if (!fd.get('inc_' + x.id)) return;
        const q = Math.ceil(parseFloat(fd.get('qty_' + x.id)) || 0);
        if (q <= 0) return;
        lines.push({ item_id: x.id, name: x.name, unit: x.unit, qty: q, received: 0, price: x.unit_price || 0 });
      });
      if (!lines.length) { showToast('Check at least one item with qty > 0 to request a PO', 'warn'); return; }
      const po = {
        id: uid('po'),
        po_number: String(fd.get('customPoNum') || '').trim() || ((cad === 'W' ? 'MAR-' : 'JB-') + localDateStr().replace(/-/g, '') + '-' + ((state.purchaseOrders || []).length + 1)),
        vendor_conf: String(fd.get('customInvNum') || '').trim(),
        vendor: cad === 'W' ? 'Marberger / Produce' : 'Jordan Banana',
        cadence: cad,
        status: 'requested',
        requested_by: getActiveUser().name,
        requested_date: localDateStr(),
        lines
      };
      state.purchaseOrders.unshift(po);
      if (state.manualPoExtra) delete state.manualPoExtra[cad];
      logActivity('PO REQUESTED', `${po.po_number} (${lines.length} items)`);
      saveState();
      render();
      const poSummary = `${po.po_number} (${po.vendor}): ` + lines.map(l => `${l.qty} ${l.unit} ${l.name}`).join(', ');
      const u = getActiveUser();
      const mgrs = (state.users || []).filter(x => x.active !== false && isMgmtOrHigher(x));
      state.messages.push({
        id: uid('msg'), sender_id: u.id, sender_name: u.name, sender_role: u.role,
        recipient_id: 'ALL', recipient_name: 'Everyone', priority: 'urgent',
        body: `PO Submitted for Approval — ${poSummary}`,
        created_at_ms: Date.now(), timestamp_label: nowStamp()
      });
      saveState();
      render();
      sendBackgroundAlert(mgrs, `PO Approval Needed: ${po.po_number}`, `Please review and approve ${poSummary}`).then(sent => {
        if (sent) showToast('Auto-sent background Email alert to Management!');
      });
      const poLinks = buildNotifyLinks(mgrs, `PO Approval Needed: ${po.po_number}`, `Please review and approve ${poSummary}`);
      openModal(`PO Submitted — Notify Management`, `
        <div class="space-y-3 text-xs">
          <p><strong>${esc(po.po_number)}</strong> has been submitted for approval and posted to Kitchen Alerts.</p>
          <div class="p-2.5 rounded bg-black/5">${esc(poSummary)}</div>
          <div class="flex flex-wrap gap-2">
            <a href="${poLinks.mailHref}" class="kms-btn-navy flex-1 py-2 text-center font-semibold">Email Management</a>
            <button type="button" data-close-modal="1" class="kms-btn-alt px-4 py-2 font-semibold">Done</button>
          </div>
        </div>
      `);
      return;
    }

    if (e.target.id === 'form-edit-po') {
      const po = (state.purchaseOrders || []).find(p => p.id === fd.get('poId'));
      if (po) {
        if (!isMgmtOrHigher() && po.status !== 'requested') {
          showToast('Only Management can modify approved or ordered POs', 'warn');
          return;
        }
        const nextLines = [];
        (po.lines || []).forEach(l => {
          const q = Math.ceil(parseFloat(fd.get('line_' + l.item_id)));
          if (!isNaN(q) && q > 0) nextLines.push({ ...l, qty: q });
        });
        const exId = fd.get('extraItemId');
        const exQ = Math.ceil(parseFloat(fd.get('extraQty')) || 0);
        if (exId === '__NEW__') {
          const newName = String(fd.get('newItemName') || '').trim();
          const newUnit = String(fd.get('newItemUnit') || 'cases').trim() || 'cases';
          const newLoc = String(fd.get('newItemLoc') || LOCATIONS[0]);
          const newPar = Math.round((parseFloat(fd.get('newItemPar')) || 1) * 100) / 100;
          if (!newName) { showToast('Enter a name for the new item', 'warn'); return; }
          if (exQ <= 0) { showToast('Enter at least 1 case for the new item', 'warn'); return; }
          if (fd.get('addToCatalog')) {
            const prefix = /freezer/i.test(newLoc) ? 'FRZ' : /cooler/i.test(newLoc) ? 'CLR' : /kitchen dry/i.test(newLoc) ? 'KDG' : 'STK';
            const sku = prefix + '-' + (100 + state.items.length + 1);
            const newItem = {
              id: uid('itm'), sku, name: newName, location: newLoc, category: 'General',
              unit: newUnit, pack_label: newUnit, units_per_pack: 1,
              on_hand: 0, par: newPar, par_manual: true, par_learned: false,
              cadence: po.cadence || 'M', vendor: po.vendor || '', unit_price: null,
              usage_log: [], discontinued: false
            };
            state.items.push(newItem);
            logActivity('ADD ITEM', `Added ${newItem.name} (${newItem.sku}) via PO ${po.po_number}`);
            nextLines.push({ item_id: newItem.id, name: newItem.name, unit: newItem.unit, qty: exQ, received: 0, price: 0 });
          } else {
            nextLines.push({ item_id: uid('custom'), name: newName, unit: newUnit, qty: exQ, received: 0, price: 0 });
          }
        } else if (exId && exQ > 0) {
          const item = state.items.find(i => i.id === exId);
          if (item) {
            const exist = nextLines.find(l => l.item_id === exId);
            if (exist) exist.qty += exQ;
            else nextLines.push({ item_id: item.id, name: item.name, unit: item.unit, qty: exQ, received: 0, price: item.unit_price || 0 });
          }
        }
        if (!nextLines.length) { showToast('PO must have at least 1 item', 'warn'); return; }
        const newPoNum = String(fd.get('poNumber') || '').trim();
        const newConf = String(fd.get('vendorConf') || '').trim();
        const newEta = String(fd.get('expectedArrival') || '').trim();
        if (newPoNum) po.po_number = newPoNum;
        po.vendor_conf = newConf;
        po.expected_arrival = newEta;
        po.lines = nextLines;
        logActivity('PO UPDATED', `${po.po_number}${po.vendor_conf ? ' / Inv ' + po.vendor_conf : ''} (${nextLines.length} items)`);
        saveState();
        closeModal();
        render();
        showToast(`Updated ${po.po_number}`);
      }
      return;
    }

    if (e.target.id === 'form-delivery-slip') {
      const slipDate = String(fd.get('slipDate') || localDateStr());
      const slipSource = String(fd.get('slipSource') || 'Delivery Slip');
      const slipRef = String(fd.get('slipRef') || '').trim();
      const ids = fd.getAll('slipItemId');
      const qtys = fd.getAll('slipQty');
      const exps = fd.getAll('slipExp');
      let count = 0;
      const uName = getActiveUser().name;
      ids.forEach((itemId, idx) => {
        const q = parseFloat(qtys[idx]) || 0;
        if (!itemId || q <= 0) return;
        const x = state.items.find(i => i.id === itemId);
        if (!x) return;
        x.on_hand = Math.round((x.on_hand + q) * 100) / 100;
        state.transactions.unshift({
          id: uid('tx'), tx_date: slipDate, tx_type: 'RECEIVE', item_id: x.id, item_name: x.name,
          unit: x.unit, qty: q, source: slipSource + (slipRef ? ` (${slipRef})` : ''),
          exp_date: exps[idx] || '', cleared: false, staff_name: uName
        });
        logActivity('DELIVERY SLIP', `+${q} ${x.unit} ${x.name}${slipRef ? ' [' + slipRef + ']' : ''}`);
        count++;
      });
      if (!count) { showToast('Enter a quantity greater than 0 for at least one item', 'warn'); return; }
      state._slipPresetItems = [];
      saveState();
      render();
      showToast(`Posted delivery slip: updated ${count} inventory item(s)!`);
      return;
    }

    if (e.target.classList && e.target.classList.contains('form-reconcile-po')) {
      const po = (state.purchaseOrders || []).find(p => p.id === e.target.dataset.poId);
      if (po && ['requested', 'ordered', 'approved', 'APPROVED_ORDERED'].includes(po.status)) {
        const uName = getActiveUser().name;
        const todayStr = localDateStr();
        const poNum = String(fd.get('recPoNum') || '').trim();
        if (poNum) po.po_number = poNum;
        const invNum = String(fd.get('recInvNum') || '').trim();
        if (invNum) po.vendor_conf = invNum;
        let added = 0;
        (po.lines || []).forEach(ln => {
          const iid = ln.item_id;
          const ord = Number(ln.qty || 0);
          if (ord <= 0) return;
          const recVal = parseFloat(fd.get('rec_' + iid));
          const actual = isNaN(recVal) ? ord : Math.max(0, Math.ceil(recVal));
          ln.received = actual;
          if (actual <= 0) return;
          const x = state.items.find(i => i.id === iid);
          if (!x) return;
          x.on_hand = Math.round((x.on_hand + actual) * 100) / 100;
          state.transactions.unshift({
            id: uid('tx'), tx_date: todayStr, tx_type: 'RECEIVE', item_id: x.id, item_name: x.name,
            unit: x.unit, qty: actual, source: `PO ${po.po_number}${po.vendor_conf ? ' / Inv ' + po.vendor_conf : ''} (${po.vendor})`,
            exp_date: '', cleared: false, staff_name: uName
          });
          added++;
        });
        po.status = 'closed';
        po.received_by = uName;
        logActivity('PO RECEIVED', `${po.po_number}${po.vendor_conf ? ' / Inv ' + po.vendor_conf : ''} (${added} items checked in)`);
        saveState();
        render();
        showToast(`Reconciled ${po.po_number}: updated ${added} item(s) in stock!`);
      }
      return;
    }

    if (e.target.id === 'form-receive') {
      const x = state.items.find(i => i.id === fd.get('itemId'));
      const q = parseFloat(fd.get('qty')) || 0;
      if (!x || q <= 0) return;
      x.on_hand = Math.round((x.on_hand + q) * 100) / 100;
      state.transactions.unshift({
        id: uid('tx'), tx_date: localDateStr(), tx_type: 'RECEIVE', item_id: x.id, item_name: x.name,
        unit: x.unit, qty: q, source: fd.get('source'), exp_date: fd.get('expDate') || '', cleared: false,
        staff_name: getActiveUser().name
      });
      logActivity('RECEIVE', `+${q} ${x.unit} ${x.name}`);
      saveState();
      render();
      showToast(`Received +${q} ${x.unit} ${x.name}`);
      return;
    }

    if (e.target.id === 'form-bulk-menu') {
      if (!isMgmtOrHigher()) { showToast('Only ADMIN or MANAGER can bulk-schedule menus', 'warn'); return; }
      const rid = fd.get('recipeId');
      const rec = state.recipes.find(r => r.id === rid);
      const nDays = parseInt(fd.get('days'), 10) || 7;
      let count = 0;
      serviceDaysBetween(localDateStr(), addDays(localDateStr(), nDays)).forEach(ds => {
        if (state.menuPlan.some(m => m.service_date === ds && m.recipe_id)) return;
        state.menuPlan.push({
          id: uid('mp'), service_date: ds, recipe_id: rid, custom_title: rec ? rec.name : 'Meal',
          menu_type: 'RECIPE', planned_portions: forecastWeekday(ds), status: 'PLANNED'
        });
        count++;
      });
      saveState();
      render();
      showToast(`Scheduled ${count} empty service day(s)`);
      return;
    }

    if (e.target.id === 'form-suggest-recipe') {
      let title = String(fd.get('title') || '').trim();
      let raw = String(fd.get('raw') || '').trim();
      let serv = Number(fd.get('servings')) || 65;
      let photoUrl = String(fd.get('photoUrl') || '').trim();
      const sourceUrl = String(fd.get('url') || '').trim();
      const targetDate = String(fd.get('targetDate') || '').trim();

      const finalizeSuggestion = (finalTitle, finalServ, finalRaw, finalPhoto) => {
        const parsedRec = parsePastedRecipe(finalTitle + '\nServings: ' + finalServ + '\n' + finalRaw);
        parsedRec.name = finalTitle;
        parsedRec.base_servings = finalServ;
        if (finalPhoto) parsedRec.photo_url = finalPhoto;
        state.recipeSuggestions = state.recipeSuggestions || [];
        state.recipeSuggestions.unshift({
          id: uid('rsug'),
          title: finalTitle,
          servings: finalServ,
          target_date: targetDate,
          raw: finalRaw,
          source_url: sourceUrl,
          parsed_recipe: parsedRec,
          suggested_by: getActiveUser().name,
          status: 'PENDING',
          created_at: localDateStr()
        });
        const mgrs = (state.users || []).filter(u => u.active !== false && ['ADMIN', 'MANAGER'].includes(normalizeRole(u.role)));
        const summary = `${finalTitle} (Base ${finalServ}${targetDate ? ', target ' + targetDate : ''}, ${(parsedRec.ingredients || []).length} ingredients) suggested by ${getActiveUser().name}`;
        state.messages = state.messages || [];
        state.messages.push({
          id: uid('msg'), sender_id: getActiveUser().id, sender_name: getActiveUser().name, sender_role: getActiveUser().role,
          recipient_id: 'ALL', recipient_name: 'Everyone', priority: 'urgent',
          body: `Recipe Suggestion for Approval — ${summary}`,
          created_at_ms: Date.now(), timestamp_label: nowStamp()
        });
        logActivity('RECIPE SUGGESTED', `Suggested "${finalTitle}"`);
        saveState();
        render();
        sendBackgroundAlert(mgrs, `Recipe Approval Needed: ${finalTitle}`, `Please review and approve ${summary} in Kitchen & Menu → Recipes.`).then(sent => {
          if (sent) showToast('Auto-sent background Email alert to Management!');
        });
        const links = buildNotifyLinks(mgrs, `Recipe Approval Needed: ${finalTitle}`, `Please review and approve ${summary} in Kitchen & Menu → Recipes.`);
        openModal('Recipe Suggestion Submitted — Notify Management', `
          <div class="space-y-3 text-xs">
            <p><strong>${esc(finalTitle)}</strong> has been formatted and sent to Management for approval.</p>
            <div class="p-2.5 rounded bg-black/5">${esc(summary)}</div>
            <div class="flex flex-wrap gap-2">
              <a href="${links.mailHref}" class="kms-btn-navy flex-1 py-2 text-center font-semibold">Email Management</a>
              <button type="button" data-close-modal="1" class="kms-btn-alt px-4 py-2 font-semibold">Done</button>
            </div>
          </div>
        `);
      };

      if (sourceUrl && !raw) {
        const btn = document.getElementById('btn-submit-sug');
        if (btn) { btn.disabled = true; btn.textContent = 'Fetching & Submitting...'; }
        invokeScrapeRecipe({ url: sourceUrl }).then(data => {
          if (!data || !data.ok || !data.recipe) throw new Error((data && data.error) || 'Could not fetch URL');
          const rec = data.recipe;
          const lines = ['Ingredients:', ...(rec.ingredients || [])];
          if (rec.steps && rec.steps.length) lines.push('', 'Directions:', ...rec.steps.map((st, idx) => `${idx + 1}. ${st}`));
          finalizeSuggestion(title || rec.name || 'Suggested Recipe', Number(rec.base_servings) || serv, lines.join('\n'), photoUrl || rec.image || '');
        }).catch(err => {
          showToast(String(err.message || err), 'warn');
        }).finally(() => {
          if (btn) { btn.disabled = false; btn.textContent = 'Submit & Notify Management'; }
        });
        return;
      }

      if (!title || !raw) { showToast('Enter a recipe URL or title + ingredients/directions', 'warn'); return; }
      finalizeSuggestion(title, serv, raw, photoUrl);
      return;
    }

    function importRecipeFromUrl(targetUrl, btn) {
      const origTxt = btn ? btn.textContent : 'Import';
      if (btn) { btn.disabled = true; btn.textContent = 'Importing...'; }
      invokeScrapeRecipe({ url: targetUrl }).then(data => {
        if (!data || !data.ok || !data.recipe) {
          throw new Error((data && data.error) || 'Import failed');
        }
        const rawRec = data.recipe;
        const baseServ = Math.max(1, Number(rawRec.base_servings) || 8);
        const allText = (rawRec.name || '') + ' ' + (rawRec.ingredients || []).join(' ');
        const allergenKeywords = {
          milk: /milk|cheese|butter|cream|yogurt|dairy/i,

          wheat: /flour|pasta|spaghetti|penne|noodles|macaroni|bread|biscuit|cracker|wheat/i,

        };

    if (e.target.id === 'form-search-web-recipes') {
