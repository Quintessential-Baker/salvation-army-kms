  // 12. BLIND PHYSICAL INVENTORY AUDIT (Blank Multi-Zone Form + Fuzzy Typo Match + Cross-Unit Reconciliation)
  function ensureBlindDraft() {
    if (!state.blindDraft || typeof state.blindDraft !== 'object') {
      state.blindDraft = { activeZone: LOCATIONS[0], zones: {}, reconciliation: null };
    }
    if (!state.blindDraft.zones || typeof state.blindDraft.zones !== 'object') {
      state.blindDraft.zones = {};
    }
    if (!state.blindDraft.activeZone || !LOCATIONS.includes(state.blindDraft.activeZone)) {
      state.blindDraft.activeZone = LOCATIONS[0];
    }
    LOCATIONS.forEach(z => {
      if (!Array.isArray(state.blindDraft.zones[z])) state.blindDraft.zones[z] = [];
    });
    return state.blindDraft;
  }

  function reconcileBlindZones(zonesToCheck) {
    const draft = ensureBlindDraft();
    const results = [];
    zonesToCheck.forEach(zone => {
      (draft.zones[zone] || []).forEach((row, idx) => {
        const rawQty = parseFloat(row.phys);
        const rawName = String(row.custom_name || '').trim();
        if (isNaN(rawQty) && !row.item_id && !rawName) return;
        const physRaw = isNaN(rawQty) ? 0 : rawQty;
        let item = row.item_id ? state.items.find(i => i.id === row.item_id) : null;
        let matchNote = '';
        if (!item && rawName) {
          const fuzzy = findFuzzyCatalogMatch(rawName);
          if (fuzzy && fuzzy.score >= 0.65) {
            item = fuzzy.item;
            matchNote = `Auto-matched typo "${rawName}" → ${item.name}`;
          }
        }
        const countedUnit = normUnit(row.unit || (item ? item.unit : 'cases'));
        if (item) {
          if (Number(row.per_stock_unit) > 0 && Number(item.units_per_pack) !== Number(row.per_stock_unit)) {
            item.units_per_pack = Number(row.per_stock_unit);
          }
          const conv = convertToStockUnit(physRaw, countedUnit, item, row.per_stock_unit);
          const sys = Number(item.on_hand) || 0;
          const physStock = conv.qty;
          const variance = Math.round((physStock - sys) * 100) / 100;
          results.push({
            zone, rowIdx: idx, item_id: item.id, name: item.name, sku: item.sku,
            unit: item.unit, counted_raw: `${physRaw} ${countedUnit}`,
            conv_note: [matchNote, conv.note].filter(Boolean).join(' · '),
            unit_unresolved: conv.needsPackSize,
            fromU: conv.fromU, toU: conv.toU,
            sys, phys: physStock, variance,
            status: conv.needsPackSize ? 'UNIT_CHECK' : variance < 0 ? 'SHORT' : variance > 0 ? 'OVER' : 'MATCH'
          });
        } else {
          results.push({
            zone, rowIdx: idx, item_id: '', name: rawName || 'Unlisted Item', sku: 'UNLISTED',
            unit: countedUnit, counted_raw: `${physRaw} ${countedUnit}`,
            conv_note: 'Not currently in catalog', unit_unresolved: false,
            sys: 0, phys: physRaw, variance: physRaw, status: 'UNLISTED'
          });
        }
      });
    });
    return results;
  }

  function renderReport(main) {
    if (!isMgmtOrHigher()) {
      main.innerHTML = `<div class="kms-card p-6 max-w-lg mx-auto text-center space-y-2"><div class="tag tag-OUT inline-block">MANAGEMENT ONLY</div><h2 class="text-base font-bold">Restricted Reports Center</h2><p class="text-xs opacity-75">Restricted to ADMIN and MANAGER accounts.</p></div>`;
      return;
    }

    const today = localDateStr();
    const rm = state.reportMonth || today.slice(0, 7);
    const rangeMode = state.reportRange || 'month';
    const repTab = state.reportTab || 'exec';
    const months = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push(localDateStr(d).slice(0, 7));
    }

    let startStr = rm + '-01', endStr = rm + '-31', periodLabel = `Month: ${rm}`;
    if (rangeMode === '30d') { startStr = addDays(today, -29); endStr = today; periodLabel = `Last 30 Days (${startStr} to ${today})`; }
    else if (rangeMode === '90d') { startStr = addDays(today, -89); endStr = today; periodLabel = `Last 90 Days (${startStr} to ${today})`; }
    else if (rangeMode === 'ytd') { startStr = today.slice(0, 4) + '-01-01'; endStr = today; periodLabel = `Year-to-Date (${today.slice(0, 4)})`; }
    else if (rangeMode === '365d') { startStr = addDays(today, -364); endStr = today; periodLabel = `Last 12 Months (${startStr} to ${today})`; }

    const inPeriod = (ds) => { const s = String(ds || '').slice(0, 10); return s >= startStr && s <= endStr; };
    const servedDays = state.menuPlan.filter(m => m.status === 'SERVED' && inPeriod(m.service_date)).sort((a, b) => b.service_date.localeCompare(a.service_date));
    const meals = servedDays.reduce((s, m) => s + (m.served_portions || 0), 0);
    const avgPerDay = servedDays.length ? (meals / servedDays.length) : 0;

    const recvs = state.transactions.filter(t => t.tx_type === 'RECEIVE' && inPeriod(t.tx_date));
    const donatedRecvs = recvs.filter(t => /donat|food bank/i.test(t.source || ''));
    const purchasedRecvs = recvs.filter(t => !/donat|food bank/i.test(t.source || ''));
    const spend = purchasedRecvs.reduce((s, t) => {
      const item = state.items.find(i => i.id === t.item_id);
      const unitP = Number(t.cost || (item ? item.unit_price : 0) || 0);
      return s + (t.cost ? Number(t.cost) : (Number(t.qty || 0) * unitP));
    }, 0);
    const costPerMeal = meals > 0 && spend > 0 ? (spend / meals) : 0;
    const waste = state.transactions.filter(t => t.tx_type === 'WASTE' && inPeriod(t.tx_date));
    const savedLeftovers = (state.storageTags || []).filter(t => t.status === 'USED' && inPeriod(t.prep_date)).length;

    let checks = 0, fails = 0;
    const tempRows = [];
    Object.keys(state.safetyLogs || {}).filter(d => inPeriod(d)).sort().reverse().forEach(d => {
      const t = state.safetyLogs[d].temps || {};
      TEMP_CHECKS.forEach((c, i) => {
        if (t[i] === undefined || t[i] === null || t[i] === '') return;
        checks++;
        const bad = c[1] === 'max' ? Number(t[i]) > c[2] : Number(t[i]) < c[2];
        if (bad) fails++;
        tempRows.push({ date: d, check: c[0], val: t[i], limit: `${c[1] === 'max' ? '≤' : '≥'}${c[2]}°F`, pass: !bad });
      });
    });
    const safetyPct = checks ? Math.round(((checks - fails) / checks) * 100) : null;

    const activeItems = state.items.filter(x => !x.discontinued);
    const stockValue = activeItems.reduce((s, x) => s + (x.on_hand || 0) * (x.unit_price || 0), 0);
    const lowItems = activeItems.filter(x => itemStatus(x) !== 'OK').map(x => {
      const needCases = x.on_hand <= 0 ? Math.max(1, Math.floor(x.par || 1)) : Math.floor(itemNeed(x));
      return { item: x, needCases, estCost: needCases * (x.unit_price || 0) };
    }).sort((a, b) => b.needCases - a.needCases);
    const parHealthPct = activeItems.length ? Math.round(((activeItems.length - lowItems.length) / activeItems.length) * 100) : 100;

    const fc = getForecastMetrics();
    const proj30Meals = Math.round(fc.avgRecent * 17);
    const proj90Meals = Math.round(fc.avgRecent * 51);
    const proj365Meals = Math.round(fc.avgRecent * 204);
    const benchPerMeal = costPerMeal > 0 ? costPerMeal : 3.25;
    const next7Meals = serviceDaysBetween(today, addDays(today, 14)).slice(0, 7).reduce((s, d) => s + forecastWeekday(d), 0);

    const fundingBrief = [
      `THE SALVATION ARMY COMMUNITY MEALS (BUTLER, PA) — FUNDING & OPERATIONS BRIEF (${periodLabel})`,
      `• Community Impact: ${meals.toLocaleString()} hot lunches served across ${servedDays.length} open service day(s) (avg ${avgPerDay.toFixed(1)} patrons/day).`,
      `• Financial & Donation Snapshot: $${spend.toFixed(2)} vendor spend recorded, supplemented by ${donatedRecvs.length} in-kind/food bank deliveries. Current inventory value: $${stockValue.toFixed(2)} (${parHealthPct}% items at/above Par).`,
      `• Forecasted Need: Projecting ${proj30Meals.toLocaleString()} meals next 30 days (~$${Math.round(proj30Meals * benchPerMeal).toLocaleString()}), ${proj90Meals.toLocaleString()} meals next 90 days (~$${Math.round(proj90Meals * benchPerMeal).toLocaleString()}), and ${proj365Meals.toLocaleString()} meals annually (~$${Math.round(proj365Meals * benchPerMeal).toLocaleString()}).`,
      `• Priority Restock / Donation Needs (${lowItems.length} items below Par): ${lowItems.slice(0, 6).map(r => r.item.name + ' (' + r.needCases + ' cases)').join('; ') || 'All items at Par'}.`
    ].join('\n');

    const tabs = [
      ['exec', 'Executive & Funding'],
      ['inv', 'Inventory & Valuation'],
      ['orders', 'Orders, Spend & Donations'],
      ['meals', 'Meals & Attendance'],
      ['safety', 'HACCP Food Safety'],
      ['waste', 'Waste & Blind Audits'],
      ['staff', 'Staff Accountability']
    ];

    let subBody = '';
    if (repTab === 'exec') {
      subBody = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-sm">
          <div class="kms-card p-4"><div class="text-xs uppercase opacity-65 font-semibold">Meals Served</div><div class="text-2xl font-bold text-[#b3122b] mt-1">${meals.toLocaleString()}</div><div class="text-xs opacity-75 mt-1">${servedDays.length} service day(s) &bull; Avg ${avgPerDay.toFixed(1)}/day</div></div>
          <div class="kms-card p-4"><div class="text-xs uppercase opacity-65 font-semibold">Food Spend &amp; Donations</div><div class="text-2xl font-bold mt-1">$${spend.toFixed(2)}</div><div class="text-xs opacity-75 mt-1">${donatedRecvs.length} donated drop(s)</div></div>
          <div class="kms-card p-4"><div class="text-xs uppercase opacity-65 font-semibold">Inventory &amp; Restock Gap</div><div class="text-2xl font-bold mt-1">${parHealthPct}% At Par</div><div class="text-xs opacity-75 mt-1">Stock value: $${stockValue.toFixed(2)} &bull; ${lowItems.length} below par</div></div>
          <div class="kms-card p-4"><div class="text-xs uppercase opacity-65 font-semibold">Safety &amp; Stewardship</div><div class="text-2xl font-bold text-emerald-700 mt-1">${safetyPct !== null ? safetyPct + '% Pass' : 'N/A'}</div><div class="text-xs opacity-75 mt-1">${checks} temp check(s), ${fails} flagged &bull; ${waste.length} waste / ${savedLeftovers} reused</div></div>
        </div>
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">Demand Forecasts &amp; Funding Projections</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5"><div class="font-bold uppercase opacity-65">Next 7 Service Days</div><div class="text-lg font-bold mt-1">${next7Meals.toLocaleString()} meals</div><div class="opacity-75">Est. food need: $${Math.round(next7Meals * benchPerMeal).toLocaleString()}</div></div>
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5"><div class="font-bold uppercase opacity-65">Next 30 Days</div><div class="text-lg font-bold mt-1">${proj30Meals.toLocaleString()} meals</div><div class="opacity-75">Est. budget: $${Math.round(proj30Meals * benchPerMeal).toLocaleString()}</div></div>
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5"><div class="font-bold uppercase opacity-65">Next 90 Days</div><div class="text-lg font-bold mt-1">${proj90Meals.toLocaleString()} meals</div><div class="opacity-75">Est. budget: $${Math.round(proj90Meals * benchPerMeal).toLocaleString()}</div></div>
            <div class="p-3 rounded-lg border border-[var(--line)] bg-black/5"><div class="font-bold uppercase opacity-65">Annual Projection (12 Mo)</div><div class="text-lg font-bold text-[#b3122b] mt-1">${proj365Meals.toLocaleString()} meals</div><div class="opacity-75">Est. annual budget: $${Math.round(proj365Meals * benchPerMeal).toLocaleString()}</div></div>
          </div>
        </div>
        <div class="kms-card p-4 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-sm font-bold">Ready-to-Send Funding / Donation Brief</h3>
            <button type="button" id="btn-copy-funding-brief-2" class="kms-btn-alt px-2.5 py-1 text-xs no-print">Copy Text</button>
          </div>
          <textarea id="exec-funding-brief" rows="6" readonly class="kms-input w-full text-xs font-mono leading-relaxed">${esc(fundingBrief)}</textarea>
        </div>
      `;
    } else if (repTab === 'inv') {
      const invLoc = state._repInvLoc || 'ALL';
      const invList = activeItems.filter(x => invLoc === 'ALL' || x.location === invLoc);
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-sm font-bold">Full Inventory Valuation &amp; Par Status (${invList.length} items)</h3>
            <select id="rep-inv-loc" class="kms-input text-xs"><option value="ALL">All Locations</option>${LOCATIONS.map(l => `<option value="${esc(l)}" ${invLoc === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
          </div>
          <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-[var(--line)] opacity-70 uppercase"><th class="py-1.5">SKU</th><th class="py-1.5">Item</th><th class="py-1.5">Location</th><th class="py-1.5">On Hand / Par</th><th class="py-1.5">Status</th><th class="py-1.5">Value</th></tr></thead>
          <tbody class="divide-y divide-[var(--line)]">${invList.map(x => `<tr><td class="py-1.5 font-mono">${esc(x.sku)}</td><td class="py-1.5 font-semibold">${esc(x.name)}</td><td class="py-1.5">${esc(x.location)}</td><td class="py-1.5">${x.on_hand} / ${x.par} ${esc(x.unit)}</td><td class="py-1.5"><span class="tag tag-${itemStatus(x)}">${itemStatus(x)}</span></td><td class="py-1.5">${x.unit_price ? '$' + ((x.on_hand || 0) * x.unit_price).toFixed(2) : '—'}</td></tr>`).join('')}</tbody></table></div>
        </div>
      `;
    } else if (repTab === 'orders') {
      const pos = (state.purchaseOrders || []).filter(p => inPeriod(p.requested_date));
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">Purchase Orders &amp; In-Kind Donations (${pos.length} POs, ${donatedRecvs.length} Donations)</h3>
          <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-[var(--line)] opacity-70 uppercase"><th class="py-1.5">PO / Receipt</th><th class="py-1.5">Vendor / Donor</th><th class="py-1.5">Date</th><th class="py-1.5">Status</th><th class="py-1.5">Items</th></tr></thead>
          <tbody class="divide-y divide-[var(--line)]">${pos.map(p => `<tr><td class="py-1.5 font-mono font-bold">${esc(p.po_number)}</td><td class="py-1.5">${esc(p.vendor)}</td><td class="py-1.5">${esc(p.requested_date)}</td><td class="py-1.5"><span class="tag tag-OK">${esc(p.status.toUpperCase())}</span></td><td class="py-1.5">${(p.lines || []).length} line(s)</td></tr>`).join('')}${donatedRecvs.map(d => `<tr><td class="py-1.5 font-mono">${esc(d.donation_receipt?.receipt_no || d.id)}</td><td class="py-1.5 font-semibold">${esc(d.source)}</td><td class="py-1.5">${esc(d.tx_date)}</td><td class="py-1.5"><span class="tag tag-OK">DONATION</span></td><td class="py-1.5">${esc(d.item_name)} (${d.qty} ${esc(d.unit)})</td></tr>`).join('')}</tbody></table></div>
        </div>
      `;
    } else if (repTab === 'meals') {
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">Meals Served &amp; Attendance Log (${servedDays.length} service days, ${meals.toLocaleString()} total meals)</h3>
          <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-[var(--line)] opacity-70 uppercase"><th class="py-1.5">Date</th><th class="py-1.5">Meal</th><th class="py-1.5">Planned</th><th class="py-1.5">Served</th><th class="py-1.5">Notes</th></tr></thead>
          <tbody class="divide-y divide-[var(--line)]">${servedDays.map(m => `<tr><td class="py-1.5 font-mono">${esc(m.service_date)}</td><td class="py-1.5 font-semibold">${esc(m.custom_title || 'Meal')}</td><td class="py-1.5">${m.planned_portions || 0}</td><td class="py-1.5 font-bold">${m.served_portions || 0}</td><td class="py-1.5">${esc(m.note || '—')}</td></tr>`).join('')}</tbody></table></div>
        </div>
      `;
    } else if (repTab === 'safety') {
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">HACCP Temperature Compliance (${checks} checks, ${fails} flagged)</h3>
          ${!tempRows.length ? '<p class="text-xs opacity-70">No temperature logs in this period.</p>' : `<div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead><tr class="border-b border-[var(--line)] opacity-70 uppercase"><th class="py-1.5">Date</th><th class="py-1.5">Check</th><th class="py-1.5">Temp</th><th class="py-1.5">Limit</th><th class="py-1.5">Status</th></tr></thead><tbody class="divide-y divide-[var(--line)]">${tempRows.map(r => `<tr><td class="py-1.5 font-mono">${esc(r.date)}</td><td class="py-1.5 font-semibold">${esc(r.check)}</td><td class="py-1.5 font-bold">${r.val}°F</td><td class="py-1.5">${esc(r.limit)}</td><td class="py-1.5"><span class="tag ${r.pass ? 'tag-OK' : 'tag-OUT'}">${r.pass ? 'PASS' : 'FLAGGED'}</span></td></tr>`).join('')}</tbody></table></div>`}
        </div>
      `;
    } else if (repTab === 'waste') {
      const audits = (state.blindAudits || []).filter(a => inPeriod(a.audit_date));
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">Waste &amp; Blind Physical Audit Variances (${waste.length} waste, ${audits.length} audits)</h3>
          ${audits.map(a => `<div class="p-2.5 rounded border border-[var(--line)] text-xs"><strong>${esc(a.audit_date)} — ${esc(a.zone)}</strong> by ${esc(a.auditor)}: ${a.rows.map(r => `${esc(r.name)} (Sys ${r.sys} vs Counted ${r.phys} ${esc(r.unit)})`).join('; ')}</div>`).join('')}
          ${waste.map(w => `<div class="p-2 rounded border border-[var(--line)] text-xs flex justify-between"><span><strong>${esc(w.item_name)}</strong> ${w.qty} ${esc(w.unit)} (${esc(w.reason)})</span><span>${esc(w.tx_date)} · ${esc(w.staff_name)}</span></div>`).join('')}
        </div>
      `;
    } else {
      const acts = (state.activityLogs || []).filter(a => inPeriod(a.timestamp_label));
      subBody = `
        <div class="kms-card p-4 space-y-3">
          <h3 class="text-sm font-bold">Staff &amp; Volunteer Accountability Summary (${acts.length} logged actions)</h3>
          <div class="space-y-1.5 max-h-96 overflow-y-auto text-xs">${acts.slice(0, 100).map(a => `<div class="p-2 rounded border border-[var(--line)] flex justify-between"><span><strong>${esc(a.actor_name)}</strong> [${esc(a.category)}] ${esc(a.detail)}</span><span class="font-mono opacity-65">${esc(a.timestamp_label)}</span></div>`).join('')}</div>
        </div>
      `;
    }

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-2"><span class="tag tag-OK">MANAGEMENT ONLY</span><h2 class="text-lg font-bold">Kitchen Operations &amp; Executive Reports Center</h2></div>
              <p class="text-xs opacity-75">Run, export, and print any operational, financial, inventory, HACCP safety, or audit report (${esc(periodLabel)}).</p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 no-print">
              <button type="button" id="btn-copy-funding-brief" class="kms-btn-primary px-3 py-1.5 text-xs">Copy Brief</button>
              <button type="button" id="btn-export-exec-csv" class="kms-btn-alt px-3 py-1.5 text-xs">Export CSV</button>
              <button type="button" id="btn-print-exec-report" class="kms-btn-navy px-3 py-1.5 text-xs">Print This Report</button>
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5 text-xs no-print">
            ${tabs.map(([k, lbl]) => `<button type="button" data-rep-tab="${k}" class="px-3 py-1.5 rounded-lg border font-bold ${repTab === k ? 'bg-[#1b365d] text-white border-[#1b365d]' : 'border-[var(--line)] hover:bg-black/5'}">${lbl}</button>`).join('')}
          </div>
          <div class="flex flex-wrap items-center gap-1.5 text-xs no-print">
            <span class="font-bold opacity-70">Date Window:</span>
            ${[['month', 'By Month'], ['30d', 'Last 30 Days'], ['90d', 'Last 90 Days'], ['ytd', 'Year-to-Date'], ['365d', 'Last 12 Months']].map(([k, lbl]) => `
              <button type="button" data-rep-range="${k}" class="px-2.5 py-1 rounded-lg border font-semibold ${rangeMode === k ? 'bg-[#b3122b] text-white border-[#b3122b]' : 'border-[var(--line)] hover:bg-black/5'}">${lbl}</button>
            `).join('')}
            ${rangeMode === 'month' ? `<select id="rep-month" class="kms-input text-xs ml-1">${months.map(m => `<option ${m === rm ? 'selected' : ''}>${m}</option>`).join('')}</select>` : ''}
          </div>
        </div>
        ${subBody}
      </div>
    `;
  }

          </div>
        </div>

        <div class="kms-card p-4 space-y-2">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-sm font-bold">Real-Time Accountability Feed (${state.activityLogs.length})</h3>
            <div class="flex flex-wrap gap-1.5 text-xs">
              <select id="act-cat-filter" class="kms-input text-xs">
                <option value="ALL" ${(state._actCat || 'ALL') === 'ALL' ? 'selected' : ''}>All Actions</option>
                <option value="AUTH" ${state._actCat === 'AUTH' ? 'selected' : ''}>Sign-Ins &amp; Log Outs</option>
                <option value="STOCK" ${state._actCat === 'STOCK' ? 'selected' : ''}>Stock &amp; POs</option>
                <option value="RECIPE" ${state._actCat === 'RECIPE' ? 'selected' : ''}>Recipes &amp; Menu</option>
                <option value="SAFETY" ${state._actCat === 'SAFETY' ? 'selected' : ''}>Safety &amp; Users</option>
              </select>
              <input id="act-search-inp" type="text" value="${esc(state._actSearch || '')}" placeholder="Filter by user or action..." class="kms-input text-xs w-44" />
            </div>
          </div>
          <div class="max-h-80 overflow-y-auto space-y-1.5 text-xs">
            ${(() => {
              const cat = state._actCat || 'ALL';
              const q = (state._actSearch || '').toLowerCase();
              const filtered = (state.activityLogs || []).filter(a => {
                const c = String(a.category || '').toUpperCase();
                if (cat === 'AUTH' && !/LOGIN|LOGOUT|LOCK|AUTH/.test(c)) return false;
                if (cat === 'STOCK' && !/STOCK|PO |DELIVERY|RECEIVE|WASTE|AUDIT|PAR|DONATION/.test(c)) return false;
                if (cat === 'RECIPE' && !/RECIPE|MENU|SERVED/.test(c)) return false;
                if (cat === 'SAFETY' && !/TEMP|CLEANING|USER|ANNOUNCEMENT|CHECKLIST|TAG/.test(c)) return false;
                if (q && !`${a.actor_name} ${a.category} ${a.detail}`.toLowerCase().includes(q)) return false;
                return true;
              });
              if (!filtered.length) return '<p class="opacity-70">No matching actions logged.</p>';
              return filtered.slice(0, 120).map(a => `
                <div class="p-2 rounded border border-[var(--line)] flex justify-between gap-2">
                  <span><strong>${esc(a.actor_name)}</strong> <span class="font-mono text-[10px] px-1 py-0.5 rounded bg-black/5">[${esc(a.category)}]</span> ${esc(a.detail)}</span>
                  <span class="opacity-60 font-mono shrink-0">${esc(a.timestamp_label)}</span>
                </div>
              `).join('');
            })()}
          </div>
        </div>
      </div>
    `;
  }

  function updateChatBadge() {
    const badge = document.getElementById('chat-badge');
    if (!badge) return;
    const u = getActiveUser();
    const lastRead = (state.chatLastRead && state.chatLastRead[u.id]) || 0;
    const unread = (state.messages || []).filter(m =>
      m.sender_id !== u.id &&
      (m.recipient_id === 'ALL' || m.recipient_id === u.id) &&
      (m.created_at_ms || 0) > lastRead
    ).length;
    badge.textContent = String(unread);
    badge.classList.toggle('hidden', unread === 0);
  }

  function showChatModal() {
    const u = getActiveUser();
    if (!state.chatLastRead) state.chatLastRead = {};
    state.chatLastRead[u.id] = Date.now();
    updateChatBadge();
    const target = state._chatTarget || 'ALL';
    const others = (state.users || []).filter(x => x.active !== false && x.id !== u.id);
    const visibleMsgs = (state.messages || []).filter(m => {
      if (target === 'ALL') return m.recipient_id === 'ALL' || !m.recipient_id;
      return (m.sender_id === u.id && m.recipient_id === target) || (m.sender_id === target && m.recipient_id === u.id);
    }).slice(-40);
    const targetUser = target === 'ALL' ? null : others.find(x => x.id === target);
    const editingId = state._editingMsgId || null;

    openModal('Kitchen Alerts & Private DMs', `
      <div class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-1.5 text-xs">
          <div class="flex flex-wrap gap-1.5">
            <button type="button" data-chat-target="ALL" class="px-2.5 py-1 rounded-lg font-bold border ${target === 'ALL' ? 'bg-[#b3122b] text-white border-[#b3122b]' : 'border-[var(--line)] hover:bg-black/5'}">Alert All (Broadcast)</button>
            ${others.map(o => `
              <button type="button" data-chat-target="${o.id}" class="px-2.5 py-1 rounded-lg font-semibold border ${target === o.id ? 'bg-[#1b365d] text-white border-[#1b365d]' : 'border-[var(--line)] hover:bg-black/5'}">DM: ${esc(o.name)}</button>
            `).join('')}
          </div>
          ${visibleMsgs.length && isMgmtOrHigher() ? `<button type="button" id="btn-clear-chat-thread" class="text-[11px] text-rose-600 underline font-semibold">Clear Thread</button>` : ''}
        </div>
        <div class="max-h-60 overflow-y-auto space-y-2 p-2 rounded-lg bg-black/5">
          ${!visibleMsgs.length ? `<p class="text-xs opacity-60 text-center py-6">${target === 'ALL' ? 'No broadcast alerts yet.' : 'No private messages with ' + esc(targetUser ? targetUser.name : 'user') + ' yet.'}</p>` : visibleMsgs.map(m => {
            const canEdit = m.sender_id === u.id || isMgmtOrHigher();
            const isEditing = editingId === m.id;
            return `
              <div class="p-2 rounded-lg kms-card text-xs ${m.sender_id === u.id ? 'border-l-4 border-l-[#1b365d]' : ''}">
                <div class="flex items-center justify-between gap-2">
                  <div class="font-bold">${esc(m.sender_name)} ${m.recipient_id && m.recipient_id !== 'ALL' ? `<span class="opacity-65 font-normal">&rarr; ${esc(m.recipient_name)}</span>` : ''} <span class="opacity-60 font-normal">(${esc(m.timestamp_label)}${m.edited ? ' · edited' : ''})</span> ${m.priority === 'urgent' ? '<span class="tag tag-OUT">URGENT</span>' : ''}</div>
                  ${canEdit && !isEditing ? `
                    <div class="flex items-center gap-1.5 text-[11px]">
                      <button type="button" data-edit-msg="${m.id}" class="text-[#1b365d] hover:underline font-semibold">Edit</button>
                      <button type="button" data-del-msg="${m.id}" class="text-rose-600 hover:underline font-semibold">Delete</button>
                    </div>
                  ` : ''}
                </div>
                ${isEditing ? `
                  <form class="form-edit-msg flex items-center gap-1.5 mt-1.5" data-msg-id="${m.id}">
                    <input name="body" type="text" required value="${esc(m.body)}" class="kms-input flex-1 text-xs" />
                    <button type="submit" class="kms-btn-ok px-2.5 py-1 text-[11px]">Update</button>
                    <button type="button" id="btn-cancel-edit-msg" class="kms-btn-alt px-2 py-1 text-[11px]">Cancel</button>
                  </form>
                ` : `<div class="mt-0.5">${esc(m.body)}</div>`}
              </div>
            `;
          }).join('')}
        </div>
        <form id="form-chat" class="space-y-2">
          <input type="hidden" name="recipientId" value="${esc(target)}" />
          <div class="flex flex-wrap gap-2">
            <input name="body" required placeholder="${target === 'ALL' ? 'Alert everyone in the kitchen...' : 'Private message to ' + esc(targetUser ? targetUser.name : '') + '...'}" class="kms-input flex-1 min-w-[180px] text-sm" />
            <label class="flex items-center gap-1 text-xs font-bold"><input type="checkbox" name="urgent" /> Urgent</label>
          </div>
          <button type="submit" class="kms-btn-primary w-full py-2 text-sm">${target === 'ALL' ? 'Send Alert to All' : 'Send Private DM'}</button>
        </form>
      </div>
    `);
  }

  function showQrLabelsModal() {
    const cards = state.items.filter(i => !i.discontinued).slice(0, 30).map(item => {
      let svg = '';
      try {
        if (window.qrcode) {
          const qr = window.qrcode(0, 'M');
          qr.addData(item.sku);
          qr.make();
          svg = qr.createSvgTag({ cellSize: 2, margin: 1 });
        }
      } catch (e) {}
      return `
        <div class="p-2 border border-dashed border-gray-400 rounded flex items-center gap-2 text-xs">
          <div class="shrink-0">${svg || esc(item.sku)}</div>
          <div><div class="font-bold">${esc(item.name)}</div><div class="font-mono text-[#b3122b]">${esc(item.sku)}</div><div class="opacity-70">${esc(item.location)}</div></div>
        </div>
      `;
    }).join('');
    document.body.classList.add('printing-modal');
    openModal('Printable Shelf QR Labels', `
      <div class="space-y-3">
        <button type="button" onclick="window.print()" class="kms-btn-navy px-4 py-1.5 text-xs no-print">Print Labels</button>
        <div class="qr-print-grid grid grid-cols-1 sm:grid-cols-2 gap-2">${cards}</div>
      </div>
    `);
  }

  // Global Event Listeners
  document.addEventListener('click', (e) => {
    if (state.isLocked) return;
    const toolsBtn = e.target.closest('#btn-tools');
    if (toolsBtn) { document.getElementById('tools-menu').classList.toggle('hidden'); return; }
    const tm = document.getElementById('tools-menu');
    if (tm && !tm.classList.contains('hidden')) tm.classList.add('hidden');

    if (e.target.closest('#btn-sync-pill')) {
      openModal('Supabase Cloud Sync & Connection', `
        <div class="space-y-3 text-xs">
          <div class="p-3 rounded-lg bg-black/5 flex items-center justify-between">
            <div>
              <div class="font-bold">Status: ${syncStatus === 'live' ? 'Live Supabase Sync' : 'Local / Offline Mode'}</div>
              <div class="opacity-70 mt-0.5">Connected to Butler, PA Kitchen Cloud Database</div>
            </div>
            <span class="tag ${syncStatus === 'live' ? 'tag-OK' : 'tag-LOW'}">${syncStatus === 'live' ? 'LIVE' : 'LOCAL'}</span>
          </div>
          <p class="opacity-80">Use <strong>Reconnect &amp; Pull from Cloud</strong> to refresh all devices from Supabase, or <strong>Push Local Data to Cloud</strong> if you made offline changes.</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="btn-force-pull-cloud" class="kms-btn-navy flex-1 py-2 text-xs font-semibold">Reconnect &amp; Pull from Cloud</button>
            <button type="button" id="btn-force-push-cloud" class="kms-btn-ok flex-1 py-2 text-xs font-semibold">Push Local Data to Cloud</button>
          </div>
        </div>
      `);
      return;
    }
    if (e.target.id === 'btn-force-pull-cloud') {
      closeModal();
      syncStatus = 'connecting';
      updateSyncUI();
      refreshFromCloud(true).then(() => showToast('Synced with Supabase cloud!'));
      return;
    }
    if (e.target.id === 'btn-force-push-cloud') {
      closeModal();
      syncStatus = 'live';
      updateSyncUI();
      syncToSupabase().then(() => showToast('Pushed local data to Supabase cloud!'));
      return;
    }

    const grpBtn = e.target.closest('[data-grp]');
    if (grpBtn) {
      const g = NAV_GROUPS.find(x => x.id === grpBtn.dataset.grp);
      const allowed = getAllowedTabs();
      const first = g && g.tabs.find(t => allowed.includes(t.id));
      if (first) { state.activeTab = first.id; state.selectedSheetDate = null; saveState(true); render(); }
      return;
    }
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { state.activeTab = tabBtn.dataset.tab; state.selectedSheetDate = null; saveState(true); render(); return; }

    if (e.target.id === 'modal-close' || e.target.id === 'modal-backdrop') { closeModal(); return; }
    if (e.target.closest('[data-close-modal]')) { closeModal(); if (!e.target.closest('[data-tab]')) return; }
    if (e.target.closest('#btn-switch-user')) { showSwitchUserModal(); return; }
    if (e.target.closest('#btn-open-chat')) { state._editingMsgId = null; showChatModal(); return; }
    const chatTgtBtn = e.target.closest('[data-chat-target]');
    if (chatTgtBtn) { state._chatTarget = chatTgtBtn.dataset.chatTarget; state._editingMsgId = null; showChatModal(); return; }
    const editMsgBtn = e.target.closest('[data-edit-msg]');
    if (editMsgBtn) { state._editingMsgId = editMsgBtn.dataset.editMsg; showChatModal(); return; }
    if (e.target.id === 'btn-cancel-edit-msg') { state._editingMsgId = null; showChatModal(); return; }
    const delMsgBtn = e.target.closest('[data-del-msg]');
    if (delMsgBtn) {
      const mid = delMsgBtn.dataset.delMsg;
      state.messages = (state.messages || []).filter(m => m.id !== mid);
      if (sbClient) sbClient.from('kms_messages').delete().eq('id', mid).then(() => {});
      saveState();
      showChatModal();
      showToast('Message deleted');
      return;
    }
    if (e.target.id === 'btn-clear-chat-thread') {
      const target = state._chatTarget || 'ALL';
      const u = getActiveUser();
      const toRemove = (state.messages || []).filter(m => {
        if (target === 'ALL') return m.recipient_id === 'ALL' || !m.recipient_id;
        return (m.sender_id === u.id && m.recipient_id === target) || (m.sender_id === target && m.recipient_id === u.id);
      }).map(m => m.id);
      state.messages = (state.messages || []).filter(m => !toRemove.includes(m.id));
      if (sbClient && toRemove.length) sbClient.from('kms_messages').delete().in('id', toRemove).then(() => {});
      saveState();
      showChatModal();
      showToast('Cleared chat thread');
      return;
    }
    if (e.target.closest('#btn-lock-app')) {
      captureInProgressWork();
      const curU = getActiveUser();
      logActivity('LOGOUT', `${curU.name} locked / signed out`);
      state.isLocked = true;
      delete state._sbAuthEmail;
      setSessionUnlocked(false);
      if (sbClient && sbClient.auth) { try { sbClient.auth.signOut(); } catch (err) {} }
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-undo' || e.target.id === 'btn-stock-undo') { doUndo(); return; }
    if (e.target.id === 'btn-print-qr') { showQrLabelsModal(); return; }
    if (e.target.id === 'btn-print-page') { window.print(); return; }
    if (e.target.id === 'btn-text-size') {
      state.textZoom = ((state.textZoom || 0) + 1) % 3;
      document.documentElement.style.fontSize = ['100%', '112.5%', '125%'][state.textZoom];
      saveState();
      return;
    }
    if (e.target.id === 'btn-theme-toggle') {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveState();
      return;
    }
    if (e.target.id === 'btn-backup') {
      openModal('Backup & Restore', `
        <div class="space-y-3 text-xs">
          <p>Download a full JSON backup of all Butler PA inventory, recipes, logs, and settings, or restore from a saved JSON backup file.</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="btn-dl-json" class="kms-btn-navy px-3.5 py-2">Download JSON Backup</button>
            <label class="kms-btn-ok px-3.5 py-2 cursor-pointer">Restore from JSON File<input id="inp-restore-json" type="file" accept=".json,application/json" class="hidden" /></label>
            <button type="button" id="btn-reset-seed" class="kms-btn-alt px-3.5 py-2">Reset Stock to Starting Seed</button>
          </div>
        </div>
      `);
      return;
    }
    if (e.target.id === 'btn-dl-json') {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sa-butler-kms-${localDateStr()}.json`;
      a.click();
      return;
    }
    if (e.target.id === 'btn-reset-seed') {
      askConfirm('Reset Stock', 'Reset all inventory items back to the starting Butler PA seed list?', () => {
        state.items = buildSeedInventory();
        saveState();
        render();
        showToast('Inventory reset to starting seed');
      });
      return;
    }

    // Stock +/-
    const adjBtn = e.target.closest('[data-adj]');
    if (adjBtn) {
      const [id, d] = adjBtn.dataset.adj.split(':');
      const delta = Number(d);
      const x = state.items.find(i => i.id === id);
      if (x) {
        snapUndo();
        if (delta < 0) recordUsage(x, Math.min(-delta, x.on_hand));
        x.on_hand = Math.max(0, Math.round((x.on_hand + delta) * 100) / 100);
        logActivity('STOCK', `${delta > 0 ? '+' : ''}${delta} ${x.unit} ${x.name}`);
        saveState();
        render();
      }
      return;
    }

    if (e.target.id === 'btn-add-item-modal') {
      openModal('Add Inventory Item', `
        <form id="form-add-item" class="space-y-3">
          <input name="name" required placeholder="Item name" class="kms-input w-full text-sm" />
          <div class="grid grid-cols-2 gap-2">
            <select name="location" class="kms-input text-sm">${LOCATIONS.map(l => `<option>${esc(l)}</option>`).join('')}</select>
            <input name="unit" value="cases" required placeholder="Unit (cases, cans...)" class="kms-input text-sm" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input name="onHand" type="number" step="0.5" value="0" placeholder="On hand" class="kms-input text-sm" />
            <input name="par" type="number" step="0.5" value="1" placeholder="Par" class="kms-input text-sm" />
            <select name="cadence" class="kms-input text-sm"><option value="W">Weekly</option><option value="M">Monthly</option></select>
          </div>
          <button type="submit" class="kms-btn-primary w-full py-2 text-sm">Add Item</button>
        </form>
      `);
      return;
    }

    // PO Actions
    const poSelAll = e.target.closest('[data-po-sel-all]');
    if (poSelAll) {
      const cad = poSelAll.dataset.poSelAll;
      const chks = Array.from(document.querySelectorAll('.po-chk-' + cad));
      const allOn = chks.length && chks.every(c => c.checked);
      chks.forEach(c => { c.checked = !allOn; });
      return;
    }
    const poAddExtra = e.target.closest('[data-po-add-extra]');
    if (poAddExtra) {
      const cad = poAddExtra.dataset.poAddExtra;
      const sel = document.getElementById('po-add-sel-' + cad);
      const qInp = document.getElementById('po-add-qty-' + cad);
      if (sel && sel.value) {
