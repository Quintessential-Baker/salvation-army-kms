    if (a.repeat_rule === 'biweekly') return `Repeats Every 2 Wks${days ? ' (' + days + ')' : ''}`;
    if (a.repeat_rule === 'monthly') return 'Repeats Monthly';

  }
  function isAnnouncementActiveToday(a, nowObj) {
    const now = nowObj || new Date();
    const todayStr = localDateStr(now);
    if (a.expires_at && a.expires_at < todayStr) return false;
    const rep = a.repeat_rule || 'none';
    if (rep === 'none') {
      if (!a.alert_at) return true;
      const goLiveMs = new Date(a.alert_at).getTime();
      return isNaN(goLiveMs) || goLiveMs <= now.getTime();
    }
    const startStr = (a.alert_at && a.alert_at.slice(0, 10)) || a.created_at || todayStr;
    if (todayStr < startStr) return false;
    if (a.alert_at && a.alert_at.includes('T')) {
      const targetTime = a.alert_at.slice(11, 16);
      const curTime = now.toTimeString().slice(0, 5);
      if (targetTime && curTime < targetTime) return false;
    }
    if (rep === 'daily') return true;
    const dow = now.getDay();
    const startParts = startStr.split('-').map(Number);
    const startDate = new Date(startParts[0], (startParts[1] || 1) - 1, startParts[2] || 1);
    const days = Array.isArray(a.repeat_days) && a.repeat_days.length ? a.repeat_days.map(Number) : [startDate.getDay()];
    if (rep === 'weekly') return days.includes(dow);
    if (rep === 'biweekly') {
      if (!days.includes(dow)) return false;
      const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffWeeks = Math.floor((todayMid.getTime() - startDate.getTime()) / (7 * 86400000));
      return diffWeeks >= 0 && diffWeeks % 2 === 0;
    }
    if (rep === 'monthly') return now.getDate() === startDate.getDate();
    return true;
  }

  function getFederalHoliday(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d.getTime())) return '';
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), dow = d.getDay();
    if (m === 1 && day === 1) return "New Year's Day";
    if (m === 1 && dow === 1 && day >= 15 && day <= 21) return 'MLK Jr. Day';
    if (m === 2 && dow === 1 && day >= 15 && day <= 21) return "Presidents' Day";
    if (m === 5 && dow === 1 && day >= 25) return 'Memorial Day';
    if (m === 6 && day === 19) return 'Juneteenth';

    if (m === 9 && dow === 1 && day <= 7) return 'Labor Day';
    if (m === 10 && dow === 1 && day >= 8 && day <= 14) return 'Columbus Day';
    if (m === 11 && day === 11) return 'Veterans Day';
    if (m === 11) {

      if (day === thx) return 'Thanksgiving Day';

    const now = Date.now();
    state.items.forEach(x => {

      let total = 0;
      x.usage_log.forEach(e => { if (now - e[0] <= weeks * WK_MS) total += e[1]; });
      if (total <= 0) return;
      const cycleWeeks = x.cadence === 'W' ? 1 : 4.33;
      x.par = Math.ceil((total / weeks) * cycleWeeks * 1.25 * 2) / 2;
      x.par_learned = true;
    });

  function getForecastMetrics() {
    const open = getOpenServedHistory().slice(-210);
    const recent = open.slice(-24);
    const avgAll = open.length ? open.reduce((s, m) => s + Number(m.served_portions), 0) / open.length : 60;
    const avgRecent = recent.length ? recent.reduce((s, m) => s + Number(m.served_portions), 0) / recent.length : avgAll;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowFactor = {};
    [1, 2, 3, 5].forEach(d => {
      const arr = recent.filter(m => new Date(m.service_date + 'T12:00:00').getDay() === d);
      const dAvg = arr.length ? arr.reduce((s, m) => s + Number(m.served_portions), 0) / arr.length : avgRecent;
      dowFactor[dowNames[d]] = avgRecent > 0 ? Math.min(1.4, Math.max(0.65, dAvg / avgRecent)) : 1;
    });
    const buckets = { start: [], mid: [], end: [] };
    recent.forEach(m => {
      const day = parseInt(String(m.service_date).slice(8, 10), 10) || 15;
      buckets[day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end'].push(Number(m.served_portions));
    });
    const bucketFactor = {};
    ['start', 'mid', 'end'].forEach(k => {
      const arr = buckets[k];
      const bAvg = arr.length >= 2 ? arr.reduce((a, b) => a + b, 0) / arr.length : avgRecent;
      bucketFactor[k] = avgRecent > 0 ? Math.min(1.25, Math.max(0.8, bAvg / avgRecent)) : 1;
    });
    return { openCount: open.length, avgAll, avgRecent, dowFactor, bucketFactor };
  }

  function suggestPortionsOverall() {

  function forecastWeekday(dateStr) {
    if (getFederalHoliday(dateStr)) return 0;
    const m = getForecastMetrics();
    if (!m.openCount) return 65;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dn = dowNames[new Date(dateStr + 'T12:00:00').getDay()];
    const day = parseInt(String(dateStr).slice(8, 10), 10) || 15;
    const bKey = day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end';
    const raw = m.avgRecent * (m.dowFactor[dn] || 1) * ((1 + (m.bucketFactor[bKey] || 1)) / 2);
    return Math.max(10, Math.round(raw));
  }

    return d;
  }

  function suggestedOrderAmount(x, d7, d30) {
    const dem = (x.cadence === 'W' ? d7 : d30)[x.id] || 0;
    const target = Math.max(x.par, Math.ceil(dem * 1.1 * 2) / 2);
    return Math.max(0, Math.ceil((target - x.on_hand - onOrderQty(x.id)) * 2) / 2);
  }

  async function syncToSupabase() {
    if (!sbClient || syncStatus === 'local') return;
    try {
      await Promise.all([
        sbClient.from('kms_inventory_items').upsert(state.items.map(x => ({
          id: x.id, sku: x.sku, name: x.name, location: x.location, category: x.category,
          unit: x.unit, pack_label: x.pack_label, units_per_pack: x.units_per_pack || 1,
          on_hand: x.on_hand, par: x.par, par_manual: !!x.par_manual, par_learned: !!x.par_learned,
          cadence: x.cadence, vendor: x.vendor, unit_price: x.unit_price, usage_log: x.usage_log || [],
          discontinued: !!x.discontinued, updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_recipes').upsert(state.recipes.map(r => ({
          id: r.id, name: r.name, category: r.category, base_servings: r.base_servings,
          prep_min: r.prep_min || 20, cook_min: r.cook_min || 35, allergens: r.allergens || [],
          steps: r.steps || [], ingredients: r.ingredients || [], updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_menu_plan').upsert(state.menuPlan.map(m => ({
          id: m.id, service_date: m.service_date, recipe_id: m.recipe_id || '', custom_title: m.custom_title || '',
          menu_type: m.menu_type || 'RECIPE', planned_portions: m.planned_portions || 65,
          served_portions: m.served_portions, status: m.status || 'PLANNED', circumstance: m.circumstance || 'Normal Day',
          note: m.note || '', logged_by: m.logged_by || '', prep_checked_items: m.prep_checked_items || {},
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_purchase_orders').upsert(state.purchaseOrders.map(p => ({
          id: p.id, po_number: p.po_number, vendor: p.vendor, cadence: p.cadence, status: p.status,
          requested_by: p.requested_by, requested_date: p.requested_date, approved_by: p.approved_by || '',
          approved_date: p.approved_date || '', expected_arrival: p.expected_arrival || '',
          vendor_conf: p.vendor_conf || '', notes: p.notes || '', lines: p.lines || [],
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_transactions').upsert(state.transactions.slice(0, 100).map(t => ({
          id: t.id, tx_date: t.tx_date, tx_type: t.tx_type, item_id: t.item_id || '', item_name: t.item_name,
          unit: t.unit, qty: t.qty, source: t.source || '', exp_date: t.exp_date || '', cleared: !!t.cleared,
          reason: t.reason || '', cost: t.cost || 0, po_number: t.po_number || '', staff_name: t.staff_name || '',
          note: t.note || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_storage_tags').upsert(state.storageTags.map(t => ({
          id: t.id, item_name: t.item_name, tag_category: t.tag_category || 'LEFTOVER', zone: t.zone,
          qty_label: t.qty_label || '', prep_date: t.prep_date, prep_time: t.prep_time || '',
          use_by_date: t.use_by_date, temp_f: t.temp_f, notes: t.notes || '', tagged_by: t.tagged_by || '',
          status: t.status || 'STORED', closed_by: t.closed_by || '', closed_at: t.closed_at || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_checklists').upsert(state.checklists.map(c => ({
          id: c.id, freq: c.freq, category: c.category, title: c.title, done: !!c.done,
          done_by: c.done_by || '', done_at: c.done_at || '', priority_carryover: !!c.priority_carryover
        })), { onConflict: 'id' }),
        sbClient.from('kms_users').upsert(state.users.map(u => ({
          id: u.id, name: u.name, role: u.role, initials: u.initials, pin_hash: u.pin_hash,
          pin_salt: u.pin_salt, must_change_pin: !!u.must_change_pin, active: u.active !== false,
          onboarding_completed: !!u.onboarding_completed, completed_training_ids: u.completed_training_ids || []
        })), { onConflict: 'id' }),
        sbClient.from('kms_announcements').upsert(state.announcements.map(a => ({
          id: a.id, priority: a.priority, title: a.title, body: a.body, alert_at: a.alert_at || '', repeat_rule: a.repeat_rule || 'none',
          repeat_days: a.repeat_days || [], expires_at: a.expires_at || '', author: a.author || '',
          dismissed_by: a.dismissed_by || {}, created_at: a.created_at
        })), { onConflict: 'id' })
      ]);
      const todayLog = state.safetyLogs[localDateStr()];
      if (todayLog) {
        await sbClient.from('kms_safety_logs').upsert({
          log_date: localDateStr(), temps: todayLog.temps || {}, cleaning: todayLog.cleaning || {},
          logged_by: todayLog.logged_by || getActiveUser().name, updated_at: new Date().toISOString()
        }, { onConflict: 'log_date' });
      }
      if (state.messages.length) {
        await sbClient.from('kms_messages').upsert(state.messages.slice(-50).map(m => ({
          id: m.id, sender_id: m.sender_id, sender_name: m.sender_name, sender_role: m.sender_role,
          recipient_id: m.recipient_id || 'ALL', recipient_name: m.recipient_name || 'Everyone',
          priority: m.priority || 'normal', body: m.body, created_at_ms: m.created_at_ms, timestamp_label: m.timestamp_label
        })), { onConflict: 'id' });
      }
    } catch (e) {}
  }

  async function initSupabase() {
    if (!window.supabase || !window.supabase.createClient) {
      syncStatus = 'local';
      updateSyncUI();
      return;
    }
    syncStatus = 'connecting';
    updateSyncUI();
    try {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: invData, error } = await sbClient.from('kms_inventory_items').select('*');
      if (error) {
        syncStatus = 'local';
        updateSyncUI();
        return;
      }
      if (invData && invData.length > 0) {
        const [recR, mpR, poR, txR, tagR, chkR, usrR, annR, msgR, safR] = await Promise.all([
          sbClient.from('kms_recipes').select('*'),
          sbClient.from('kms_menu_plan').select('*'),
          sbClient.from('kms_purchase_orders').select('*'),
          sbClient.from('kms_transactions').select('*').order('created_at', { ascending: false }).limit(120),
          sbClient.from('kms_storage_tags').select('*'),
          sbClient.from('kms_checklists').select('*'),
          sbClient.from('kms_users').select('*'),
          sbClient.from('kms_announcements').select('*'),
          sbClient.from('kms_messages').select('*').order('created_at_ms', { ascending: true }).limit(50),
          sbClient.from('kms_safety_logs').select('*')
        ]);
        state.items = invData;
        if (recR.data && recR.data.length) state.recipes = recR.data;
        if (mpR.data && mpR.data.length) state.menuPlan = mpR.data;
        if (poR.data) state.purchaseOrders = poR.data;
        if (txR.data) state.transactions = txR.data;
        if (tagR.data) state.storageTags = tagR.data;
        if (chkR.data && chkR.data.length) state.checklists = chkR.data;
        if (usrR.data && usrR.data.length) state.users = usrR.data;
        if (annR.data) state.announcements = annR.data;
        if (msgR.data) state.messages = msgR.data;
        if (safR.data) {
          safR.data.forEach(s => { state.safetyLogs[s.log_date] = s; });
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      } else {
        syncStatus = 'live';
        await syncToSupabase();
      }
      syncStatus = 'live';
      updateSyncUI();
      sbClient.channel('kms_relational_live')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          initSupabase();
        }).subscribe();
      render();
    } catch (e) {
      syncStatus = 'local';
      updateSyncUI();
    }
  }

  // Mandatory Modals (PIN Change & Training)
  function checkMandatoryModals() {
    const u = getActiveUser();
    const pinB = document.getElementById('pin-change-backdrop');
    const trnB = document.getElementById('training-backdrop');
    if (state.isLocked) {
      pinB.classList.add('hidden'); pinB.classList.remove('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    if (u.must_change_pin) {
      document.getElementById('pin-change-sub').textContent = `Hi ${u.name}, please set your personal 6+ character PIN before using the system.`;
      pinB.classList.remove('hidden'); pinB.classList.add('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    pinB.classList.add('hidden'); pinB.classList.remove('flex');
    const pendingTrn = (state.trainingModules || []).filter(m => (m.role === 'ALL' || m.role === u.role) && !(u.completed_training_ids || []).includes(m.id));
    if (pendingTrn.length && !u.onboarding_completed) {
      if (trainingStep >= pendingTrn.length) trainingStep = pendingTrn.length - 1;
      const mod = pendingTrn[trainingStep];
      document.getElementById('trn-title').textContent = mod.title;
      document.getElementById('trn-body').textContent = mod.content;
      document.getElementById('trn-step').textContent = `${trainingStep + 1} / ${pendingTrn.length}`;
      document.getElementById('btn-trn-prev').disabled = trainingStep === 0;
      document.getElementById('btn-trn-next').textContent = trainingStep === pendingTrn.length - 1 ? 'Complete Training ✓' : 'Next →';
      trnB.classList.remove('hidden'); trnB.classList.add('flex');
    } else {
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
    }
  }

  // 5. MENU & PRINTABLE DAILY SHEET
  function renderMenu(main) {
    if (state.selectedSheetDate) {
      renderDailySheet(main, state.selectedSheetDate);
      return;
    }
    const today = localDateStr();
    const days = [];
    for (let i = -3; i <= 21; i++) {
      const ds = addDays(today, i);
      const dow = new Date(ds + 'T12:00:00').getDay();
      if ([1, 2, 3, 5].includes(dow)) days.push(ds);
    }
    const recOpts = state.recipes.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold">Menu Planner (Mon / Tue / Wed / Fri)</h2>
              <p class="text-xs opacity-75">Suggested portions from past services (+10%): <strong>${suggestPortionsOverall()}</strong>. Tap <strong>Served</strong> after lunch to deduct ingredients &amp; auto-log leftovers.</p>
            </div>
          </div>
          <form id="form-bulk-menu" class="flex flex-wrap gap-2 items-center pt-1">
            <select name="recipeId" class="kms-input text-xs flex-1 min-w-[200px]">${recOpts}</select>
            <select name="days" class="kms-input text-xs"><option value="7">Fill empty next 7 days</option><option value="30">Fill empty next 30 days</option></select>
            <button type="submit" class="kms-btn-navy px-3 py-1.5 text-xs">Fill Empty Days</button>
          </form>
        </div>

        <div class="space-y-2">
          ${days.map(ds => {
            const hol = getFederalHoliday(ds);
            const mp = state.menuPlan.find(m => m.service_date === ds) || { service_date: ds, recipe_id: '', planned_portions: forecastWeekday(ds), status: hol ? 'CLOSED' : 'PLANNED' };
            return `
              <div class="kms-card p-3 flex flex-wrap items-center justify-between gap-2">
                <div class="space-y-1 flex-1 min-w-[220px]">
                  <div class="font-bold text-sm">${dLabel(ds)} ${ds === today ? '<span class="tag tag-OK">TODAY</span>' : ''} ${hol ? `<span class="tag tag-OUT">${esc(hol)}</span>` : ''}</div>
                  <div class="flex flex-wrap items-center gap-2 text-xs">
                    <select data-menu-rec="${ds}" class="kms-input text-xs">
                      <option value="">Choose recipe...</option>
                      ${state.recipes.map(r => `<option value="${r.id}" ${mp.recipe_id === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
                    </select>
                    <span>Planned:</span>
                    <input type="number" min="0" value="${mp.planned_portions || 65}" data-menu-plan="${ds}" class="kms-input w-16 text-xs text-center font-bold" />
                    ${mp.recipe_id ? `<button type="button" data-open-sheet="${ds}" class="text-[#1b365d] font-bold underline">Daily Sheet</button>` : ''}
                  </div>
                </div>
                <div>
                  ${mp.status === 'SERVED'
                    ? `<span class="tag tag-OK">Served ${mp.served_portions}</span>`
                    : `<div class="flex items-center gap-1.5"><input id="sv-note-${ds}" placeholder="Weather/event note" class="kms-input text-xs w-32" /><input id="sv-qty-${ds}" type="number" min="0" placeholder="Served" class="kms-input text-xs w-20" /><button type="button" data-mark-served="${ds}" class="kms-btn-ok px-3 py-1.5 text-xs">Served</button></div>`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderDailySheet(main, dateStr) {
    const mp = state.menuPlan.find(m => m.service_date === dateStr) || {};
    const rec = state.recipes.find(r => r.id === mp.recipe_id);
    if (!rec) { state.selectedSheetDate = null; renderMenu(main); return; }
    const n = mp.planned_portions || rec.base_servings || 65;
    const f = n / (rec.base_servings || 65);

    const byLoc = {};
    (rec.ingredients || []).forEach(g => {
      const x = g.inv_id ? state.items.find(i => i.id === g.inv_id) : null;
      if (x && g.per100) {
        (byLoc[x.location] = byLoc[x.location] || []).push({ item: x, amt: (g.per100 * n) / 100 });
      }
    });

    main.innerHTML = `
      <div class="kms-card p-5 space-y-4">
        <div class="flex flex-wrap gap-2 justify-between items-center no-print">
          <button type="button" id="btn-back-menu" class="kms-btn-alt px-3 py-1.5 text-xs">&larr; Back to Menu</button>
          <button type="button" onclick="window.print()" class="kms-btn-primary px-4 py-1.5 text-xs">Print Daily Sheet</button>
        </div>
        <div>
          <h2 class="text-lg font-bold">${dLabel(dateStr)} — ${esc(rec.name)}</h2>
          ${(rec.allergens || []).length ? `<p class="text-xs font-bold text-[#b3122b]">ALLERGENS: ${esc(rec.allergens.join(', '))}</p>` : ''}
          <p class="text-xs mt-1"><strong>Portions Planned: ${n}</strong> &nbsp;|&nbsp; Served: _______ &nbsp;|&nbsp; Cook: ______________</p>
        </div>
        <div>
          <h3 class="text-sm font-bold border-b border-[var(--line)] pb-1 mb-2">Scaled Ingredients</h3>
          <table class="w-full text-xs">
            ${(rec.ingredients || []).map(g => `<tr class="border-b border-[var(--line)]"><td class="py-1.5">&#9744; ${esc(g.name)}</td><td class="py-1.5 text-right font-bold">${fmtNum((g.qty || 0) * f)} ${esc(g.unit)}</td></tr>`).join('')}
          </table>
        </div>
        ${(rec.steps || []).length ? `<div><h3 class="text-sm font-bold mb-1">Directions</h3><ol class="list-decimal pl-5 text-xs space-y-1">${rec.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>` : ''}
        ${Object.keys(byLoc).length ? `
          <div>
            <h3 class="text-sm font-bold border-b border-[var(--line)] pb-1 mb-2">Pull from Storage</h3>
            ${Object.keys(byLoc).map(L => `<div class="mb-2"><div class="text-xs font-bold">${esc(L)}</div>${byLoc[L].map(a => `<div class="text-xs flex justify-between border-b border-[var(--line)] py-1"><span>&#9744; ${esc(a.item.name)}</span><span><strong>${fmtNum(a.amt)} ${esc(a.item.unit)}</strong> (have ${a.item.on_hand})</span></div>`).join('')}</div>`).join('')}
          </div>
        ` : ''}
        <div>
          <h3 class="text-sm font-bold mb-1">Temperature Log</h3>
          <table class="w-full text-xs border-collapse">
            <tr class="border-b border-[var(--line)] font-bold"><td class="py-1">Check</td><td>Limit</td><td>Temp °F</td><td>Initials</td></tr>
            ${TEMP_CHECKS.map(c => `<tr class="border-b border-[var(--line)]"><td class="py-1.5">${esc(c[0])}</td><td>${c[1] === 'max' ? '≤' : '≥'} ${c[2]}°F</td><td>________</td><td>______</td></tr>`).join('')}
          </table>
        </div>
        <p class="text-xs"><strong>Leftover Labels:</strong> Use cooked leftovers by <strong>${dLabel(addDays(dateStr, 6))}</strong> (7-day ServSafe rule).</p>
      </div>
    `;
  }

  // 6. NEXT-DAY PREP (pulls grouped by location + FIFO leftovers)
  function renderPrep(main) {
    const today = localDateStr();
    const nextMeal = state.menuPlan.filter(m => m.service_date > today && m.status !== 'CLOSED' && m.recipe_id).sort((a, b) => a.service_date.localeCompare(b.service_date))[0];
    const rec = nextMeal ? state.recipes.find(r => r.id === nextMeal.recipe_id) : null;
    const byLoc = {};
    LOCATIONS.forEach(l => { byLoc[l] = []; });
    if (nextMeal && rec) {
      const n = nextMeal.planned_portions || 65;
      (rec.ingredients || []).forEach(g => {
        const x = g.inv_id ? state.items.find(i => i.id === g.inv_id) : null;
        if (x && g.per100) {
          (byLoc[x.location] = byLoc[x.location] || []).push({ item: x, amt: (g.per100 * n) / 100 });
        }
      });
    }
    const lefts = state.storageTags.filter(t => t.status === 'STORED' && t.tag_category !== 'SALAD_BAR').sort((a, b) => a.use_by_date.localeCompare(b.use_by_date));

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 flex flex-wrap justify-between items-center gap-2">
          <div>
            <h2 class="text-base font-bold">Next-Day Prep Pulls</h2>
            <p class="text-xs opacity-75">${nextMeal && rec ? `Next service (${dLabel(nextMeal.service_date)}): <strong>${esc(rec.name)}</strong> (${nextMeal.planned_portions} portions)` : 'Schedule a recipe on the Menu tab to generate tomorrow’s prep pulls.'}</p>
          </div>
          <button type="button" onclick="window.print()" class="kms-btn-alt px-3 py-1.5 text-xs no-print">Print Prep Sheet</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          ${LOCATIONS.map(L => `
            <div class="kms-card p-4 space-y-2">
              <h3 class="text-sm font-bold border-b border-[var(--line)] pb-1">${esc(L)}</h3>
              ${!(byLoc[L] || []).length ? '<p class="text-xs opacity-60">No pulls needed.</p>' : byLoc[L].map(p => `
                <label class="flex items-start gap-2 text-xs cursor-pointer">
                  <input type="checkbox" data-prep-chk="${nextMeal.id}:${p.item.id}" ${(nextMeal.prep_checked_items || {})[p.item.id] ? 'checked' : ''} />
                  <span><strong>${esc(p.item.name)}</strong> — ${fmtNum(p.amt)} ${esc(p.item.unit)} <span class="opacity-60">(have ${p.item.on_hand})</span></span>
                </label>
              `).join('')}
            </div>
          `).join('')}
        </div>

  // 7. RECIPES (Smart Offline Paste Parser + Scaling + Allergens + Stock Linkage)
  function parsePastedRecipe(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const name = lines[0] || 'Imported Recipe';
    let servings = 4;
    const srvMatch = raw.match(/servings?\s*[:\-]?\s*(\d+)/i) || raw.match(/makes?\s*(\d+)/i);
    if (srvMatch) servings = Math.max(1, parseInt(srvMatch[1], 10));

    const allergenKeywords = {
      milk: /milk|butter|cheese|cream|yogurt|cheddar|mozzarella|parmesan/i,
      eggs: /\beggs?\b/i,
      wheat: /flour|pasta|spaghetti|penne|noodles|macaroni|bread|biscuit|cracker|wheat/i,
      soy: /\bsoy\b|tofu/i,
      peanuts: /peanut/i,
      'tree nuts': /almond|walnut|pecan|cashew/i,
      fish: /tuna|salmon|fish|cod/i,
      shellfish: /shrimp|crab|lobster/i,
      sesame: /sesame|tahini/i
    };
    const allergens = Object.keys(allergenKeywords).filter(a => allergenKeywords[a].test(raw));

    const ingredients = [];
    const steps = [];
    let mode = 'ing';
    lines.slice(1).forEach(ln => {
      if (/^(directions|instructions|steps|method)/i.test(ln)) { mode = 'step'; return; }
      if (/^(ingredients)/i.test(ln)) { mode = 'ing'; return; }
      if (mode === 'step' || /^\d+[\.\)]\s/.test(ln)) {
        steps.push(ln.replace(/^\d+[\.\)]\s*/, ''));
      } else {
        const m = ln.match(/^([\d\.\/]+)\s*([a-zA-Z#]+)?\s+(.+)$/);
        if (m) {
          let q = 1;
          if (m[1].includes('/')) {
            const [a, b] = m[1].split('/').map(Number);
            q = b ? a / b : 1;
          } else q = parseFloat(m[1]) || 1;
          const unit = m[2] || 'each';
          const ingName = m[3];
          const matchInv = state.items.find(i => ingName.toLowerCase().includes(i.name.toLowerCase().split(' ')[0]));
          ingredients.push({ name: ingName, qty: q, unit, inv_id: matchInv ? matchInv.id : '', per100: 0 });
        } else {
          ingredients.push({ name: ln, qty: 1, unit: 'each', inv_id: '', per100: 0 });
        }
      }
    });
    return { id: uid('rec'), name, category: 'Main Entree', base_servings: servings, prep_min: 20, cook_min: 35, allergens, steps, ingredients };
  }

  // 13. MONTHLY REPORT (from Community Meals Inventory-2.html)
  function renderReport(main) {
    const rm = state.reportMonth || localDateStr().slice(0, 7);
    const months = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
      months.push(localDateStr(d).slice(0, 7));
    }
    const mn = state.menuPlan.filter(m => m.status === 'SERVED' && m.service_date.slice(0, 7) === rm);
    const meals = mn.reduce((s, m) => s + (m.served_portions || 0), 0);
    const spend = state.transactions.filter(t => t.tx_type === 'RECEIVE' && t.tx_date.slice(0, 7) === rm).reduce((s, t) => s + (t.cost || 0), 0);
    const waste = state.transactions.filter(t => t.tx_type === 'WASTE' && t.tx_date.slice(0, 7) === rm);

    let checks = 0, fails = 0;
    Object.keys(state.safetyLogs).filter(d => d.slice(0, 7) === rm).forEach(d => {
      const t = state.safetyLogs[d].temps || {};
      TEMP_CHECKS.forEach((c, i) => {
        if (t[i] === undefined || t[i] === null || t[i] === '') return;
        checks++;
        if (c[1] === 'max' ? Number(t[i]) > c[2] : Number(t[i]) < c[2]) fails++;
      });
    });

    const low = state.items.filter(x => itemNeed(x) > 0);
    main.innerHTML = `
      <div class="kms-card p-4 space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-2 no-print">
          <select id="rep-month" class="kms-input text-sm">${months.map(m => `<option ${m === rm ? 'selected' : ''}>${m}</option>`).join('')}</select>
          <button type="button" onclick="window.print()" class="kms-btn-navy px-4 py-1.5 text-xs">Print Monthly Report</button>
        </div>
        <h2 class="text-lg font-bold">Monthly Report — ${esc(rm)}</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <div class="p-3 rounded-lg border border-[var(--line)]"><div class="text-xs opacity-70">Meals Served</div><div class="text-xl font-bold">${meals}</div><div class="text-xs opacity-70">${mn.length} service day(s)</div></div>
          <div class="p-3 rounded-lg border border-[var(--line)]"><div class="text-xs opacity-70">Purchases</div><div class="text-xl font-bold">$${spend.toFixed(2)}</div><div class="text-xs opacity-70">${meals && spend ? '$' + (spend / meals).toFixed(2) + ' / meal' : 'Enter prices to track $/meal'}</div></div>
          <div class="p-3 rounded-lg border border-[var(--line)]"><div class="text-xs opacity-70">Food Safety</div><div class="text-xl font-bold">${checks ? Math.round(((checks - fails) / checks) * 100) + '%' : 'N/A'}</div><div class="text-xs opacity-70">${checks} checks, ${fails} flagged</div></div>
        </div>
        <div class="text-xs"><strong>Waste Entries:</strong> ${waste.length}</div>
        <div class="text-xs"><strong>Below Par Now (${low.length}):</strong> ${low.slice(0, 15).map(x => esc(x.name)).join(', ') || 'None'}</div>
      </div>
    `;
  }

  // Global Event Listeners
  document.addEventListener('click', (e) => {
    const toolsBtn = e.target.closest('#btn-tools');
    if (toolsBtn) { document.getElementById('tools-menu').classList.toggle('hidden'); return; }
    const tm = document.getElementById('tools-menu');
    if (tm && !tm.classList.contains('hidden')) tm.classList.add('hidden');

    const grpBtn = e.target.closest('[data-grp]');
    if (grpBtn) {
      const g = NAV_GROUPS.find(x => x.id === grpBtn.dataset.grp);
      const allowed = getAllowedTabs();
      const first = g && g.tabs.find(t => allowed.includes(t.id));
      if (first) { state.activeTab = first.id; state.selectedSheetDate = null; saveState(); render(); }
      return;
    }
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { state.activeTab = tabBtn.dataset.tab; state.selectedSheetDate = null; saveState(); render(); return; }

    if (e.target.id === 'modal-close' || e.target.id === 'modal-backdrop') { closeModal(); return; }
    if (e.target.closest('#btn-switch-user')) { showSwitchUserModal(); return; }
    if (e.target.closest('#btn-open-chat')) { showChatModal(); return; }
    if (e.target.closest('#btn-lock-app')) { state.isLocked = true; saveState(); render(); return; }
    if (e.target.id === 'btn-undo' || e.target.id === 'btn-stock-undo') { doUndo(); return; }
    if (e.target.id === 'btn-print-qr') { showQrLabelsModal(); return; }
    if (e.target.id === 'btn-print-page') { window.print(); return; }
    if (e.target.id === 'btn-text-size') {
      state.textZoom = ((state.textZoom || 0) + 1) % 3;
      document.documentElement.style.fontSize = ['100%', '112.5%', '125%'][state.textZoom];
      saveState();
      return;
    }
    if (e.target.id === 'btn-theme-toggle') {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveState();
      return;
    }
    if (e.target.id === 'btn-backup') {
      openModal('Backup & Restore', `
        <div class="space-y-3 text-xs">
          <p>Download a JSON backup of all Butler PA inventory, recipes, logs, and settings.</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="btn-dl-json" class="kms-btn-navy px-3.5 py-2">Download JSON Backup</button>
            <button type="button" id="btn-reset-seed" class="kms-btn-alt px-3.5 py-2">Reset Stock to Starting Seed</button>
          </div>
        </div>
      `);
      return;
    }
    if (e.target.id === 'btn-dl-json') {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `sa-butler-kms-${localDateStr()}.json`;
      a.click();
      return;
    }
    if (e.target.id === 'btn-reset-seed') {
      askConfirm('Reset Stock', 'Reset all inventory items back to the starting Butler PA seed list?', () => {
        state.items = buildSeedInventory();
        saveState();
        render();
        showToast('Inventory reset to starting seed');
      });
      return;
    }

    // Stock +/-
    const adjBtn = e.target.closest('[data-adj]');
    if (adjBtn) {
      const [id, d] = adjBtn.dataset.adj.split(':');
      const delta = Number(d);
      const x = state.items.find(i => i.id === id);
      if (x) {
        snapUndo();
        if (delta < 0) recordUsage(x, Math.min(-delta, x.on_hand));
        x.on_hand = Math.max(0, Math.round((x.on_hand + delta) * 100) / 100);
        logActivity('STOCK', `${delta > 0 ? '+' : ''}${delta} ${x.unit} ${x.name}`);
        saveState();
        render();
      }
      return;
    }

    if (e.target.id === 'btn-add-item-modal') {
      openModal('Add Inventory Item', `
        <form id="form-add-item" class="space-y-3">
          <input name="name" required placeholder="Item name" class="kms-input w-full text-sm" />
          <div class="grid grid-cols-2 gap-2">
            <select name="location" class="kms-input text-sm">${LOCATIONS.map(l => `<option>${esc(l)}</option>`).join('')}</select>
            <input name="unit" value="cases" required placeholder="Unit (cases, cans...)" class="kms-input text-sm" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input name="onHand" type="number" step="0.5" value="0" placeholder="On hand" class="kms-input text-sm" />
            <input name="par" type="number" step="0.5" value="1" placeholder="Par" class="kms-input text-sm" />
            <select name="cadence" class="kms-input text-sm"><option value="W">Weekly</option><option value="M">Monthly</option></select>
          </div>
          <button type="submit" class="kms-btn-primary w-full py-2 text-sm">Add Item</button>
        </form>
      `);
      return;
    }

    // PO Actions
    const cpo = e.target.closest('[data-create-po]');
    if (cpo) {
      const cad = cpo.dataset.createPo;
      const d7 = demandForDays(serviceDaysBetween(localDateStr(), addDays(localDateStr(), 7)));
      const d30 = demandForDays(serviceDaysBetween(localDateStr(), addDays(localDateStr(), 30)));
      const lines = state.items.filter(x => !x.discontinued && x.cadence === cad).map(x => ({
        item_id: x.id, name: x.name, unit: x.unit, qty: suggestedOrderAmount(x, d7, d30), received: 0, price: x.unit_price || 0
      })).filter(l => l.qty > 0);
      if (!lines.length) return;
      const po = {
        id: uid('po'),
        po_number: (cad === 'W' ? 'MAR-' : 'JB-') + localDateStr().replace(/-/g, '') + '-' + (state.purchaseOrders.length + 1),
        vendor: cad === 'W' ? 'Marberger / Produce' : 'Jordan Banana',
        cadence: cad,
        status: 'requested',
        requested_by: getActiveUser().name,
        requested_date: localDateStr(),
        lines
      };
      state.purchaseOrders.unshift(po);
      logActivity('PO REQUESTED', `${po.po_number} (${lines.length} items)`);
      saveState();
      render();
      showToast(`Created ${po.po_number}`);
      return;
    }
    const decBtn = e.target.closest('[data-po-decide]');
    if (decBtn) {
      const [id, st] = decBtn.dataset.poDecide.split(':');
      const po = state.purchaseOrders.find(p => p.id === id);
      if (po) {
        po.status = st;
        po.approved_by = getActiveUser().name;
        po.approved_date = localDateStr();
        logActivity('PO ' + st.toUpperCase(), po.po_number);
        saveState();
        render();
      }
      return;
    }
    const ordBtn = e.target.closest('[data-po-order]');
    if (ordBtn) {
      const po = state.purchaseOrders.find(p => p.id === ordBtn.dataset.poOrder);
      if (po) {
        po.status = 'ordered';
        po.vendor_conf = document.getElementById('conf-' + po.id)?.value || '';
        logActivity('PO ORDERED', po.po_number);
        saveState();
        render();
      }
      return;
    }
    const recPoBtn = e.target.closest('[data-po-reconcile]');
    if (recPoBtn) {
      const po = state.purchaseOrders.find(p => p.id === recPoBtn.dataset.poReconcile);
      if (po) {
        po.lines.forEach((ln, idx) => {
          const v = parseFloat(document.getElementById(`rc-${po.id}-${idx}`)?.value || 0);
          if (v <= 0) return;
          const x = state.items.find(i => i.id === ln.item_id);
          if (x) x.on_hand = Math.round((x.on_hand + v) * 100) / 100;
          ln.received = (ln.received || 0) + v;
          state.transactions.unshift({
            id: uid('tx'), tx_date: localDateStr(), tx_type: 'RECEIVE', item_id: ln.item_id, item_name: ln.name,
            unit: ln.unit, qty: v, source: po.vendor, cost: v * (ln.price || 0), po_number: po.po_number, staff_name: getActiveUser().name
          });
        });
        po.status = 'closed';
        logActivity('PO RECEIVED', po.po_number);
        saveState();
        render();
        showToast(`Reconciled ${po.po_number} into stock`);
      }
      return;
    }
    const delPoBtn = e.target.closest('[data-po-del]');
    if (delPoBtn) {
      askConfirm('Delete PO', 'Remove this purchase order?', () => {
        state.purchaseOrders = state.purchaseOrders.filter(p => p.id !== delPoBtn.dataset.poDel);
        saveState();
        render();
      });
      return;
    }

    // Receive Clear Expiry
    const clrExp = e.target.closest('[data-clear-exp]');
    if (clrExp) {
      const t = state.transactions.find(x => x.id === clrExp.dataset.clearExp);
      if (t) { t.cleared = true; saveState(); render(); }
      return;
    }

    // Menu Sheet & Served
    const shBtn = e.target.closest('[data-open-sheet]');
    if (shBtn) { state.selectedSheetDate = shBtn.dataset.openSheet; render(); return; }
    if (e.target.id === 'btn-back-menu') { state.selectedSheetDate = null; render(); return; }
    const srvBtn = e.target.closest('[data-mark-served]');
    if (srvBtn) {
      const ds = srvBtn.dataset.markServed;
      const mp = state.menuPlan.find(m => m.service_date === ds);
      const sv = parseFloat(document.getElementById('sv-qty-' + ds)?.value || 0);
      if (!mp || !mp.recipe_id || sv <= 0) { showToast('Choose a recipe and enter how many were served', 'warn'); return; }
      const rec = state.recipes.find(r => r.id === mp.recipe_id);
      if (rec) {
        (rec.ingredients || []).forEach(g => {
          const x = g.inv_id ? state.items.find(i => i.id === g.inv_id) : null;
          if (x && g.per100) {
            const used = (g.per100 * sv) / 100;
            recordUsage(x, Math.min(used, x.on_hand));
            x.on_hand = Math.round(Math.max(0, x.on_hand - used) * 100) / 100;
          }
        });
      }
      mp.served_portions = sv;
      mp.status = 'SERVED';
      mp.note = document.getElementById('sv-note-' + ds)?.value || '';
      mp.logged_by = getActiveUser().name;
      const left = (mp.planned_portions || 0) - sv;
      if (left > 0 && rec) {
        state.storageTags.unshift({
          id: uid('tag'), item_name: rec.name, tag_category: 'LEFTOVER', zone: 'Walk-in cooler',
          qty_label: left + ' portions', prep_date: ds, prep_time: '12:30', use_by_date: addDays(ds, 6),
          tagged_by: getActiveUser().name, status: 'STORED'
        });
      }
      logActivity('SERVED', `${ds}: ${sv} served (${rec ? rec.name : 'Meal'})`);
      saveState();
      render();
      showToast(`Logged ${sv} served & updated stock`);
      return;
    }

    // Recipe Selection & Delete
    const recPresetBtn = e.target.closest('[data-rec-preset]');
    if (recPresetBtn) {
      state.recipeScale = Number(recPresetBtn.dataset.recPreset) || 65;
      render();
      return;
    }
    if (e.target.id === 'btn-toggle-rec-matrix') {
      state._showRecMatrix = !state._showRecMatrix;
      render();
      return;
    }
    if (e.target.id === 'btn-print-recipe-sheet') {
      const rec = state.recipes.find(r => r.id === state.selectedRecipeId) || state.recipes[0];
      if (!rec) return;
      const scale = Number(state.recipeScale || rec.base_servings || 65);
      const factor = scale / (rec.base_servings || 65);
      let qrSvg = '';
      try {
        if (window.qrcode) {
          const qr = window.qrcode(0, 'M');
          qr.addData(rec.id);
          qr.make();
          qrSvg = qr.createSvgTag({ cellSize: 3, margin: 1 });
        }
      } catch (err) {}
      openModal(`Print Recipe Sheet — ${rec.name}`, `
        <div class="space-y-3 text-xs">
          <div class="flex items-start justify-between gap-3 border-b border-[var(--line)] pb-3">
            <div>
              <div class="font-bold text-base">${esc(rec.name)}</div>
              <div class="opacity-70">${esc(rec.category || 'Main')} &bull; Scaled for <strong>${scale} portions</strong> (40–80 range)</div>
            </div>
            ${qrSvg ? `<div class="shrink-0 text-center">${qrSvg}<div class="text-[10px] font-mono opacity-70">${esc(rec.id)}</div></div>` : ''}
          </div>
          <table class="w-full text-left border-collapse text-xs">
            <thead><tr class="border-b border-[var(--line)] uppercase opacity-65"><th class="py-1.5">Ingredient</th><th class="py-1.5">40 Port.</th><th class="py-1.5 font-bold text-[#b3122b]">${scale} Port.</th><th class="py-1.5">80 Port.</th></tr></thead>
            <tbody class="divide-y divide-[var(--line)]">
              ${(rec.ingredients || []).map(g => `<tr><td class="py-1.5 font-semibold">${esc(g.name)}</td><td class="py-1.5">${fmtNum((g.qty || 0) * (40 / (rec.base_servings || 65)))} ${esc(g.unit)}</td><td class="py-1.5 font-bold text-[#b3122b]">${fmtNum((g.qty || 0) * factor)} ${esc(g.unit)}</td><td class="py-1.5">${fmtNum((g.qty || 0) * (80 / (rec.base_servings || 65)))} ${esc(g.unit)}</td></tr>`).join('')}
            </tbody>
          </table>
          ${rec.directions ? `<div class="p-2.5 rounded bg-black/5 whitespace-pre-line">${esc(rec.directions)}</div>` : ''}
          <button type="button" id="btn-print-rec-modal-now" class="kms-btn-navy w-full py-2 text-xs no-print">Print Recipe Sheet</button>
        </div>
      `);
      return;
    }
    if (e.target.id === 'btn-print-rec-modal-now') {
      window.print();
      return;
    }
    if (e.target.id === 'btn-scan-recipe-qr') {
      const wrap = document.getElementById('rec-qr-wrap');
      if (!window.Html5Qrcode) { showToast('Camera scanner unavailable — type recipe name or ID in search box', 'warn'); return; }
      if (wrap) wrap.classList.remove('hidden');
      try {
        window._recQrInst = new window.Html5Qrcode('rec-qr-reader');
        window._recQrInst.start({ facingMode: 'environment' }, { fps: 10, qrbox: 200 }, (txt) => {
          const clean = String(txt || '').trim().toLowerCase();
          const match = state.recipes.find(r => r.id.toLowerCase() === clean || r.name.toLowerCase().includes(clean));
          if (window._recQrInst) { window._recQrInst.stop().catch(() => {}); window._recQrInst = null; }
          if (wrap) wrap.classList.add('hidden');
          if (match) { state.selectedRecipeId = match.id; render(); showToast('Loaded recipe: ' + match.name); }
          else showToast('No recipe matched QR: ' + txt, 'warn');
        }, () => {}).catch(() => { if (wrap) wrap.classList.add('hidden'); showToast('Camera unavailable in this window — use Search box', 'warn'); });
      } catch (err) { if (wrap) wrap.classList.add('hidden'); }
      return;
    }
    if (e.target.id === 'btn-stop-recipe-qr') {
      const wrap = document.getElementById('rec-qr-wrap');
      if (window._recQrInst) { window._recQrInst.stop().catch(() => {}); window._recQrInst = null; }
      if (wrap) wrap.classList.add('hidden');
      return;
    }
    const selRec = e.target.closest('[data-sel-rec]');
    if (selRec) { state.selectedRecipeId = selRec.dataset.selRec; render(); return; }
    const delRec = e.target.closest('[data-del-rec]');
    if (delRec) {
      askConfirm('Delete Recipe', 'Delete this recipe?', () => {
        state.recipes = state.recipes.filter(r => r.id !== delRec.dataset.delRec);
        state.selectedRecipeId = state.recipes[0]?.id || '';
        saveState();
        render();
      });
      return;
    }

    // Storage Presets & Actions
    const tpBtn = e.target.closest('[data-tag-preset]');
    if (tpBtn) {
      const p = SHELF_PRESETS[Number(tpBtn.dataset.tagPreset)];
      const f = document.getElementById('form-add-tag');
      if (f && p) {
        f.querySelector('[name="itemName"]').value = p.label.split(' (')[0];
        f.querySelector('[name="tagCategory"]').value = p.cat;
        f.querySelector('[name="days"]').value = String(p.days);
        f.querySelector('[name="zone"]').value = p.zone;
      }
      return;
    }
    const taBtn = e.target.closest('[data-tag-act]');
    if (taBtn) {
      const [id, act] = taBtn.dataset.tagAct.split(':');
      const t = state.storageTags.find(x => x.id === id);
      if (t) {
        t.status = act;
        t.closed_by = getActiveUser().name;
        t.closed_at = nowStamp();
        logActivity('DATE TAG ' + act, t.item_name);
        saveState();
        render();
      }
      return;
    }

    // Checklists, Forecast Horizon, Blind Count, Exports, Training, Users
    const cfBtn = e.target.closest('[data-chk-freq]');
    if (cfBtn) { state.checklistFreq = cfBtn.dataset.chkFreq; render(); return; }
    const hzBtn = e.target.closest('[data-hz]');
    if (hzBtn) { state.horizon = hzBtn.dataset.hz; render(); return; }

    if (e.target.id === 'btn-save-blind') {
      const counts = (state.blindDraft && state.blindDraft.counts) || {};
      const rows = [];
      state.items.forEach(x => {
        const val = counts[x.id];
        if (val === undefined || val === '') return;
        const phys = parseFloat(val);
        if (isNaN(phys)) return;
        rows.push({ name: x.name, unit: x.unit, sys: x.on_hand, phys });
        x.on_hand = phys;
      });
      if (!rows.length) { showToast('Enter at least one counted amount', 'warn'); return; }
      state.blindAudits.unshift({ id: uid('aud'), audit_date: localDateStr(), auditor: getActiveUser().name, zone: 'ALL', rows });
      state.blindDraft = { zone: 'ALL', revealed: false, counts: {} };
      logActivity('BLIND COUNT', `Counted ${rows.length} items`);
      saveState();
      render();
      showToast(`Saved physical count for ${rows.length} item(s)`);
      return;
    }

    if (e.target.id === 'btn-exp-csv') {
      const rows = [['SKU','Item','Location','Unit','On Hand','Par','Cadence']].concat(state.items.map(x => [x.sku, x.name, x.location, x.unit, x.on_hand, x.par, x.cadence]));
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = `inventory-${localDateStr()}.csv`;
      a.click();
      return;
    }
    if (e.target.id === 'btn-exp-json') {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      a.download = `sa-butler-kms-${localDateStr()}.json`;
      a.click();
      return;
    }

    const slipPresetBtn = e.target.closest('[data-slip-preset]');
    if (slipPresetBtn) {
      const p = slipPresetBtn.dataset.slipPreset;
      if (p === 'LOW') {
        state._slipPresetItems = state.items.filter(i => !i.discontinued && itemNeed(i) > 0).map(i => i.id);
      } else {
        state._slipPresetItems = state.items.filter(i => !i.discontinued && (i.vendor || '').toLowerCase().includes(p.toLowerCase())).map(i => i.id);
      }
      if (!state._slipPresetItems.length) showToast(`No ${p} items found`, 'warn');
      render();
      return;
    }
    if (e.target.id === 'btn-add-slip-row') {
      const tbody = document.getElementById('slip-rows-body');
      if (tbody) {
        const optsHtml = state.items.filter(i => !i.discontinued).map(i => `<option value="${i.id}">${esc(i.name)} (${esc(i.unit)})</option>`).join('');
        tbody.insertAdjacentHTML('beforeend', `
          <tr class="slip-row">
            <td class="p-1.5"><select name="slipItemId" class="kms-input w-full text-xs"><option value="">-- Select Item --</option>${optsHtml}</select></td>
            <td class="p-1.5"><input name="slipQty" type="number" step="0.5" min="0" placeholder="0" class="kms-input w-full text-xs text-center font-bold" /></td>
            <td class="p-1.5"><input name="slipExp" type="date" class="kms-input w-full text-xs" /></td>
            <td class="p-1.5 text-center"><button type="button" class="btn-rm-slip-row text-rose-600 font-bold text-sm">&times;</button></td>
          </tr>
        `);
      }
      return;
    }
    if (e.target.classList && e.target.classList.contains('btn-rm-slip-row')) {
      const row = e.target.closest('tr');
      if (row) row.remove();
      return;
    }
    if (e.target.id === 'btn-start-tour') {
      const steps = getRoleTourSteps();
      if (steps.length) {
        tourState.active = true;
        tourState.stepIndex = 0;
        state.activeTab = steps[0].tab;
        saveState();
        render();
      }
      return;
    }
    const launchStepBtn = e.target.closest('[data-launch-tour-step]');
    if (launchStepBtn) {
      const steps = getRoleTourSteps();
      const idx = Number(launchStepBtn.dataset.launchTourStep);
      if (steps[idx]) {
        tourState.active = true;
        tourState.stepIndex = idx;
        state.activeTab = steps[idx].tab;
        saveState();
        render();
      }
      return;
    }
    if (e.target.id === 'btn-tour-next') {
      const steps = getRoleTourSteps();
      if (tourState.stepIndex < steps.length - 1) {
        tourState.stepIndex++;
        state.activeTab = steps[tourState.stepIndex].tab;
        saveState();
        render();
      }
      return;
    }
    if (e.target.id === 'btn-tour-prev') {
      const steps = getRoleTourSteps();
      if (tourState.stepIndex > 0) {
        tourState.stepIndex--;
        state.activeTab = steps[tourState.stepIndex].tab;
        saveState();
        render();
      }
      return;
    }
    if (e.target.id === 'btn-tour-finish' || e.target.id === 'btn-tour-exit') {
      tourState.active = false;
      render();
      if (e.target.id === 'btn-tour-finish') showToast('Interactive tutorial complete!');
      return;
    }
    if (e.target.id === 'btn-retrain-self') {
      const u = getActiveUser();
      u.completed_training_ids = [];
      u.onboarding_completed = false;
      trainingStep = 0;
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-new-announcement') {
      showAnnouncementEditorModal(null);
      return;
    }
    if (e.target.id === 'btn-manage-announcements') {
      state.activeTab = 'users';
      render();
      const el = document.getElementById('announcements-admin-section');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    if (e.target.id === 'btn-preset-weekly-order') {
      const f = document.getElementById('form-save-announcement');
      if (f) {
        f.querySelector('[name="title"]').value = 'Weekly Order Reminder (Marberger & Produce)';
        f.querySelector('[name="priority"]').value = 'reminder';
        f.querySelector('[name="repeat"]').value = 'weekly';
        f.querySelector('[name="body"]').value = 'Review Order Suggestions and submit weekly Draft POs for Marberger (Dairy) and Produce today.';
        const wrap = document.getElementById('ann-repeat-days-wrap');
        if (wrap) wrap.classList.remove('hidden');
        f.querySelectorAll('input[name="repeatDays"]').forEach(cb => { cb.checked = (cb.value === '5'); });
      }
      return;
    }
    const editAnnBtn = e.target.closest('[data-edit-announcement]');
    if (editAnnBtn) {
      showAnnouncementEditorModal(editAnnBtn.dataset.editAnnouncement);
      return;
    }
    const delAnnBtn = e.target.closest('[data-del-announcement]');
    if (delAnnBtn) {
      const targetId = delAnnBtn.dataset.delAnnouncement;
      const targetAnn = (state.announcements || []).find(a => a.id === targetId);
      askConfirm(`Globally delete "${targetAnn ? targetAnn.title : 'this announcement'}"?`, () => {
        state.announcements = (state.announcements || []).filter(a => a.id !== targetId);
        if (targetAnn) logActivity('ANNOUNCEMENT DELETED', `Deleted "${targetAnn.title}"`);
        if (sbClient) sbClient.from('kms_announcements').delete().eq('id', targetId).then(() => {});
        saveState();
        render();

      const u = state.users.find(x => x.id === fd.get('userId') && x.active !== false);

        count++;
      });
      logActivity('BULK PASTE SERVED', `Imported ${count} past attendance record(s)`);
      saveState();
      closeModal();
      render();
      showToast(`Imported ${count} past attendance record(s)`);
      return;
    }
    if (e.target.id === 'form-bulk-served') {
      let count = 0;
      for (const [k, v] of fd.entries()) {
        if (!k.startsWith('sv_') || v === '') continue;
        const ds = k.slice(3);
        const sv = parseInt(v, 10);
        if (isNaN(sv) || sv < 0) continue;
        let mp = state.menuPlan.find(m => m.service_date === ds);
        if (!mp) { mp = { id: uid('mp'), service_date: ds, custom_title: 'Community Meal', planned_portions: sv, status: 'SERVED' }; state.menuPlan.push(mp); }
        mp.served_portions = sv;
        mp.status = 'SERVED';
        mp.note = fd.get('nt_' + ds) || mp.note || '';
        count++;
      }
      logActivity('BULK SERVED', `Saved ${count} past service count(s)`);
      saveState();
      closeModal();
      render();
      showToast(`Saved ${count} past attendance record(s)`);
      return;
    }

    if (e.target.id === 'form-waste') {
      const x = state.items.find(i => i.id === fd.get('itemId'));
      const q = parseFloat(fd.get('qty')) || 0;
      if (!x || q <= 0) return;
      x.on_hand = Math.round(Math.max(0, x.on_hand - q) * 100) / 100;
      state.transactions.unshift({
        id: uid('tx'), tx_date: localDateStr(), tx_type: 'WASTE', item_id: x.id, item_name: x.name,
        unit: x.unit, qty: -q, reason: fd.get('reason'), staff_name: getActiveUser().name
      });
      logActivity('WASTE', `-${q} ${x.unit} ${x.name} (${fd.get('reason')})`);
      saveState();
      render();
      showToast(`Logged waste for ${x.name}`, 'warn');
      return;
    }

    if (e.target.id === 'form-add-user') {
      const u = makeUser(uid('usr'), fd.get('name').trim(), fd.get('role'), fd.get('initials').trim().toUpperCase(), fd.get('pin'), true);
      state.users.push(u);
      logActivity('ADD USER', `${u.name} (${u.role})`);
      saveState();
      render();
      showToast(`Added ${u.name}`);
      return;
    }

    if (e.target.id === 'form-chat') {
      const u = getActiveUser();
      state.messages.push({
        id: uid('msg'), sender_id: u.id, sender_name: u.name, sender_role: u.role,
        recipient_id: 'ALL', recipient_name: 'Everyone', priority: fd.get('urgent') ? 'urgent' : 'normal',
        body: fd.get('body').trim(), created_at_ms: Date.now(), timestamp_label: nowStamp()
      });
      saveState();
      showChatModal();
      return;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'scan-input' && e.key === 'Enter') {
      e.preventDefault();
      const q = e.target.value.trim().toLowerCase();
      const m = state.items.find(i => i.sku.toLowerCase() === q || i.name.toLowerCase().includes(q));
      if (m) { document.getElementById('recv-item').value = m.id; showToast('Selected ' + m.name); e.target.value = ''; }
      else showToast('No matching SKU or item found', 'warn');
    }
  });

  function resetInactivity() {
    clearTimeout(inactivityTimer);
    if (!state.autoLockMinutes || state.isLocked) return;
    inactivityTimer = setTimeout(() => {
      state.isLocked = true;
      saveState();
      render();
    }, state.autoLockMinutes * 60 * 1000);
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetInactivity, { passive: true }));

  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'ann-repeat-select') {
      const wrap = document.getElementById('ann-repeat-days-wrap');
      if (wrap) wrap.classList.toggle('hidden', !['weekly', 'biweekly'].includes(e.target.value));
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target && e.target.id === 'form-save-announcement') {
      e.preventDefault();
      const fd = new FormData(e.target);
      const annId = String(fd.get('annId') || '').trim();
      const title = String(fd.get('title') || '').trim();
      const body = String(fd.get('body') || '').trim();
      const priority = String(fd.get('priority') || 'reminder');
      const alertAt = String(fd.get('alertAt') || '').trim();
      const repeatRule = String(fd.get('repeat') || 'none');
      const expiresAt = String(fd.get('expiresAt') || '').trim();
      const repeatDays = fd.getAll('repeatDays').map(Number).filter(n => !isNaN(n));
      if (!title || !body) return;
      state.announcements = state.announcements || [];
      if (annId) {
        const idx = state.announcements.findIndex(x => x.id === annId);
        if (idx >= 0) {
          state.announcements[idx] = {
            ...state.announcements[idx],
            title, body, priority, alert_at: alertAt, repeat_rule: repeatRule,
            repeat_days: repeatDays, expires_at: expiresAt
          };
          logActivity('ANNOUNCEMENT UPDATED', title);
          showToast('Announcement updated');
        }
      } else {
        state.announcements.unshift({
          id: uid('ann'), priority, title, body, alert_at: alertAt, repeat_rule: repeatRule,
          repeat_days: repeatDays, expires_at: expiresAt, author: getActiveUser().name,
          created_at: localDateStr(), dismissed_by: {}
        });
        logActivity('ANNOUNCEMENT POSTED', title);
        showToast('Announcement posted');
      }
      closeModal();
      saveState();
      render();
    }
  });

  // Boot
  if (state.theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  document.documentElement.style.fontSize = ['100%', '112.5%', '125%'][state.textZoom || 0];
  pruneExpiredAlerts();
  render();
  initSupabase();
  setInterval(checkScheduledAlerts, 15000);
})();
</script>
</body>
</html>
