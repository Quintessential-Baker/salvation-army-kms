<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Community Meals KMS — The Salvation Army · Butler, PA</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --sa-red: #b3122b;
      --sa-red-dark: #8f0e22;
      --sa-navy: #1b365d;
      --sa-navy-dark: #122644;
      --bg: #f1f5f9;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #334155;
      --line: #cbd5e1;
    }
    html[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --line: #334155;
    }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    /* Sticky Top Header & Clean White Sub-Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: #1b365d;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
    }
    header nav {
      background-color: #ffffff;
      border-top: 3px solid #b3122b;
      border-bottom: 1px solid #cbd5e1;
      color: #1b365d;
    }
    html[data-theme="dark"] header nav {
      background-color: #1e293b;
      border-bottom-color: #334155;
      color: #f8fafc;
    }
    #nav-groups button, #nav-subtabs button {
      color: #1b365d !important;
      background-color: transparent;
      font-weight: 700 !important;
      padding: 6px 12px !important;
      border-radius: 8px !important;
      border: 1px solid transparent;
      transition: background-color 0.15s, color 0.15s;
    }
    html[data-theme="dark"] #nav-groups button,
    html[data-theme="dark"] #nav-subtabs button {
      color: #e2e8f0 !important;
    }
    #nav-groups button:hover, #nav-subtabs button:hover {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1;
    }
    html[data-theme="dark"] #nav-groups button:hover,
    html[data-theme="dark"] #nav-subtabs button:hover {
      background-color: #334155 !important;
    }
    #nav-groups button.bg-\[\#b3122b\], #nav-groups button.active {
      background-color: #b3122b !important;
      color: #ffffff !important;
    }
    #nav-subtabs {
      background-color: #f8fafc;
      border-top: 1px solid #e2e8f0 !important;
    }
    html[data-theme="dark"] #nav-subtabs {
      background-color: #0f172a;
      border-top-color: #334155 !important;
    }
    #nav-subtabs button.bg-white, #nav-subtabs button.active {
      background-color: #1b365d !important;
      color: #ffffff !important;
    }
    #tools-menu {
      z-index: 60 !important;
      background-color: var(--card) !important;
      color: var(--ink) !important;
      border: 1px solid var(--line) !important;
    }
    #tools-menu button:hover {
      background-color: rgba(27, 54, 93, 0.08) !important;
    }
    /* Cards, Inputs & High-Legibility Buttons */
    .kms-card {
      background-color: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .kms-input {
      background-color: var(--card);
      color: var(--ink);
      border: 1px solid #94a3b8;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .kms-input:focus {
      outline: none;
      border-color: #1b365d;
      box-shadow: 0 0 0 2px rgba(27, 54, 93, 0.18);
    }
    .kms-btn-primary {
      background-color: #b3122b;
      color: #ffffff;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #8f0e22;
    }
    .kms-btn-primary:hover { background-color: #8f0e22; }
    .kms-btn-navy {
      background-color: #1b365d;
      color: #ffffff;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #122644;
    }
    .kms-btn-navy:hover { background-color: #122644; }
    .kms-btn-ok {
      background-color: #15803d;
      color: #ffffff;
      font-weight: 700;
      border-radius: 8px;
    }
    .kms-btn-ok:hover { background-color: #166534; }
    .kms-btn-alt {
      background-color: var(--card);
      color: var(--ink);
      font-weight: 700;
      border: 1px solid #94a3b8;
      border-radius: 8px;
    }
    .kms-btn-alt:hover { background-color: rgba(27, 54, 93, 0.06); }
    .sa-hero-banner {
      background-color: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-left: 5px solid #b3122b;
      border-radius: 12px;
    }
    .sa-hero-banner h2 { color: #1b365d; }
    html[data-theme="dark"] .sa-hero-banner h2 { color: #f8fafc; }
    .sa-hero-banner .text-amber-300 { color: #b3122b; }
    .sa-hero-banner .text-white\/90, .sa-hero-banner .opacity-85 { color: var(--muted); }
    table thead th {
      background-color: #1b365d;
      color: #ffffff;
      font-weight: 700;
    }
    @media print {
      @page { size: letter portrait; margin: 0.38in; }
      .no-print, header, nav, #mobile-dock, #toast-container, #pin-change-backdrop, #training-backdrop, #page-guide-banner { display: none !important; }
      html, body {
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #0f172a !important;
        font-size: 9.5pt !important;
        line-height: 1.3 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #app-main { max-width: 100% !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .overflow-y-auto, .overflow-x-auto, .max-h-96, .max-h-80, .max-h-72, .max-h-64, .max-h-60, .max-h-56 {
        max-height: none !important;
        overflow: visible !important;
      }
      .sa-print-shell, .sa-hero-banner {
        border: 2px solid #1b365d !important;
        border-radius: 8px !important;
        background: #ffffff !important;
        color: #1b365d !important;
        box-shadow: none !important;
        margin-bottom: 8px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .sa-print-banner, .sa-hero-banner {
        background: #f8fafc !important;
        color: #1b365d !important;
        border-bottom: 3px solid #b3122b !important;
        padding: 8px 12px !important;
      }
      .sa-print-banner *, .sa-hero-banner * { color: #1b365d !important; }
      .sa-print-banner .sa-sub, .sa-hero-banner .text-amber-300 { color: #b3122b !important; }
      .sa-shield-badge, .sa-print-banner .bg-\[\#b3122b\], .sa-hero-banner .bg-\[\#b3122b\] {
        background: #b3122b !important;
        color: #ffffff !important;
      }
      .kms-card {
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 8px 10px !important;
        margin-bottom: 8px !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .kms-card.print-flow, .space-y-4 > .kms-card, .space-y-2 > .kms-card {
        break-inside: auto;
        page-break-inside: auto;
      }
      tr, .qr-label-card, .print-keep, .stock-row-card, .menu-day-card, .chk-row-card, .tag-row-card, .menu-cal-cell {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      h1, h2, h3, h4 { break-after: avoid; page-break-after: avoid; }
      table { width: 100% !important; border-collapse: collapse !important; }
      thead { display: table-header-group; }
      thead tr, thead th { background: #1b365d !important; color: #ffffff !important; }
      th, td { border: 1px solid #cbd5e1 !important; padding: 4px 6px !important; }
      tbody tr:nth-child(even) { background: #f8fafc !important; }
      input, select, textarea {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        color: #0f172a !important;
        font-weight: 600 !important;
        appearance: none !important;
        -webkit-appearance: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="kms-header sticky top-0  shadow-sm no-print z-50 shadow-md">
    <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-[#b3122b] text-white flex items-center justify-center font-extrabold text-sm shadow">SA</div>
        <div>
          <h1 class="text-base sm:text-lg font-bold leading-tight">Community Meals KMS</h1>
          <p class="text-xs opacity-85">The Salvation Army · Butler, PA · <span id="hdr-user">Signed out</span></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 flex-wrap">
        <button id="btn-sync-pill" type="button" class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold flex items-center gap-1.5">
          <span id="sync-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="sync-label">Local Mode</span>
        </button>
        <button id="btn-quick-help" type="button" class="px-2.5 py-1.5 rounded-lg bg-emerald-600/90 hover:bg-emerald-600 text-white text-xs font-bold flex items-center gap-1" title="Show or hide quick guide for this page">
          <span>? Page Guide</span>
        </button>
        <button id="btn-open-chat" type="button" class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold flex items-center gap-1">
          <span>Chat</span>
          <span id="chat-badge" class="hidden px-1.5 py-0.2 rounded-full bg-[#b3122b] text-white text-[10px] font-bold">0</span>
        </button>
        <button id="btn-switch-user" type="button" class="px-2.5 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white text-xs font-semibold">Switch User</button>
        <button id="btn-lock-app" type="button" class="px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-semibold">Lock</button>
        <div class="relative">
          <button id="btn-tools" type="button" class="px-2.5 py-1.5 rounded-lg bg-white text-[#1b365d] text-xs font-bold">Tools &#9662;</button>
          <div id="tools-menu" class="hidden absolute right-0 mt-1.5 w-56 kms-card text-slate-800 dark:text-slate-100 shadow-xl py-1.5 z-40 text-xs">
            <button id="btn-start-tour" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-bold text-[#b3122b]">Interactive Guided Tour</button>
            <button id="btn-run-selftest" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-bold text-[#1f7a3d]">Run System Self-Test &amp; Report</button>
            <button id="btn-undo" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Undo Last Stock Change</button>
            <button id="btn-text-size" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Bigger Text</button>
            <button id="btn-theme-toggle" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Toggle Dark Mode</button>
            <button id="btn-print-qr" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Print QR Bin Labels</button>
            <button id="btn-print-page" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Print Current View (Letter)</button>
            <button id="btn-backup" type="button" class="w-full text-left px-3 py-2 hover:bg-black/5 font-semibold">Backup / Restore</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 5-Group Navigation -->
    <nav class="bg-black/15 border-t border-white/10 overflow-x-auto no-scrollbar">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-1.5 flex items-center gap-1.5 min-w-max" id="nav-groups"></div>
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-1.5 flex items-center gap-1.5 min-w-max border-t border-white/10" id="nav-subtabs"></div>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="app-main" class="max-w-6xl w-full mx-auto px-3 sm:px-5 py-4 pb-24 md:pb-8 flex-1"></main>

  <!-- Mobile Quick Dock -->
  <div id="mobile-dock" class="md:hidden fixed bottom-0 inset-x-0 kms-card rounded-none border-x-0 border-b-0 z-30 px-2 py-1.5 flex justify-around items-center shadow-lg no-print"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm no-print"></div>

  <!-- Reusable Modal -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden items-center justify-center p-4">
    <div id="modal-box" class="kms-card shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-5">
      <div class="flex items-center justify-between border-b border-[var(--line)] pb-2.5 mb-3">
        <h3 id="modal-title" class="text-base font-bold">Modal</h3>
        <button id="modal-close" type="button" class="text-xl leading-none px-2 opacity-70 hover:opacity-100">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Mandatory Force PIN Change Modal -->
  <div id="pin-change-backdrop" class="fixed inset-0 bg-black/75 z-50 hidden items-center justify-center p-4 no-print">
    <div class="kms-card shadow-2xl max-w-md w-full p-6 space-y-3">
      <span class="tag tag-LOW">SECURITY REQUIRED</span>
      <h3 class="text-lg font-bold">Set Your Personal PIN</h3>
      <p id="pin-change-sub" class="text-xs opacity-75">Please choose a personal 6+ character PIN before continuing.</p>
      <form id="form-force-pin" class="space-y-3">
        <input name="newPin" type="password" required minlength="6" placeholder="New PIN (6+ characters)" class="kms-input w-full text-sm" />
        <input name="confirmPin" type="password" required minlength="6" placeholder="Confirm New PIN" class="kms-input w-full text-sm" />
        <div id="force-pin-err" class="text-xs font-bold text-red-600 hidden"></div>
        <button type="submit" class="kms-btn-primary w-full py-2.5 text-sm">Save Personal PIN</button>
      </form>
    </div>
  </div>

  <!-- Mandatory First-Login Training Modal -->
  <div id="training-backdrop" class="fixed inset-0 bg-black/75 z-50 hidden items-center justify-center p-4 no-print">
    <div class="kms-card shadow-2xl max-w-lg w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-[var(--line)] pb-2">
        <div>
          <span class="tag tag-OUT" id="trn-badge">REQUIRED TRAINING</span>
          <h3 id="trn-title" class="text-base font-bold mt-1">Welcome</h3>
        </div>
        <span id="trn-step" class="text-xs opacity-70 font-semibold">1 / 1</span>
      </div>
      <div id="trn-body" class="text-sm whitespace-pre-line leading-relaxed"></div>
      <div class="flex items-center justify-between pt-2 border-t border-[var(--line)]">
        <button id="btn-trn-prev" type="button" class="kms-btn-alt px-3 py-1.5 text-xs">&larr; Back</button>
        <button id="btn-trn-next" type="button" class="kms-btn-primary px-4 py-1.5 text-xs">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- ES Module Entry Point -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
