    d.setDate(d.getDate() + n);
    return localDateStr(d);
  }
  function dLabel(dateStr) {
    return new Date(dateStr + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function formatRepeatLabel(a) {
    if (!a || !a.repeat_rule || a.repeat_rule === 'none') return '';
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const days = Array.isArray(a.repeat_days) && a.repeat_days.length
      ? a.repeat_days.map(d => dayNames[Number(d)] || '').filter(Boolean).join(', ')
      : '';
    if (a.repeat_rule === 'daily') return 'Repeats Daily';
    if (a.repeat_rule === 'weekly') return `Repeats Weekly${days ? ' (' + days + ')' : ''}`;
    if (a.repeat_rule === 'biweekly') return `Repeats Every 2 Wks${days ? ' (' + days + ')' : ''}`;
    if (a.repeat_rule === 'monthly') return 'Repeats Monthly';
    return '';
  }
  function isAnnouncementActiveToday(a, nowObj) {
    const now = nowObj || new Date();
    const todayStr = localDateStr(now);
    if (a.expires_at && a.expires_at < todayStr) return false;
    const rep = a.repeat_rule || 'none';
    if (rep === 'none') {
      if (!a.alert_at) return true;
      const goLiveMs = new Date(a.alert_at).getTime();
      return isNaN(goLiveMs) || goLiveMs <= now.getTime();
    }
    const startStr = (a.alert_at && a.alert_at.slice(0, 10)) || a.created_at || todayStr;
    if (todayStr < startStr) return false;
    if (a.alert_at && a.alert_at.includes('T')) {
      const targetTime = a.alert_at.slice(11, 16);
      const curTime = now.toTimeString().slice(0, 5);
      if (targetTime && curTime < targetTime) return false;
    }
    if (rep === 'daily') return true;
    const dow = now.getDay();
    const startParts = startStr.split('-').map(Number);
    const startDate = new Date(startParts[0], (startParts[1] || 1) - 1, startParts[2] || 1);
    const days = Array.isArray(a.repeat_days) && a.repeat_days.length ? a.repeat_days.map(Number) : [startDate.getDay()];
    if (rep === 'weekly') return days.includes(dow);
    if (rep === 'biweekly') {
      if (!days.includes(dow)) return false;
      const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffWeeks = Math.floor((todayMid.getTime() - startDate.getTime()) / (7 * 86400000));
      return diffWeeks >= 0 && diffWeeks % 2 === 0;
    }
    if (rep === 'monthly') return now.getDate() === startDate.getDate();
    return true;
  }
  function pruneExpiredAlerts() {
    const todayStr = localDateStr();
    if (!Array.isArray(state.announcements)) return;
    const before = state.announcements.length;
    state.announcements = state.announcements.filter(a => !a.expires_at || a.expires_at >= todayStr);
    if (state.announcements.length !== before) saveState();
  }
  const firedAlertIds = new Set();
  function checkScheduledAlerts() {
    const now = new Date();
    const todayStr = localDateStr(now);
    const u = getActiveUser();
    let triggered = false;
    (state.announcements || []).forEach(a => {
      if (!a.alert_at || firedAlertIds.has(a.id + ':' + todayStr)) return;
      if (a.dismissed_by && a.dismissed_by[u.id] === todayStr) return;
      if (isAnnouncementActiveToday(a, now)) {
        const goLiveMs = new Date(a.alert_at).getTime();
        if (!isNaN(goLiveMs) && now.getTime() - goLiveMs >= 0 && now.getTime() - goLiveMs < 120000) {
          firedAlertIds.add(a.id + ':' + todayStr);
          showToast(`Alert: ${a.title}`, a.priority === 'urgent' ? 'error' : 'warn');
          triggered = true;
        }
      }
    });
    if (triggered && state.activeTab === 'dashboard') render();
  }
  function nowStamp() {
    const d = new Date();
    return localDateStr(d) + ' ' + d.toTimeString().slice(0, 5);
  }
  function uid(prefix) {
    return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function fmtNum(n) { return String(Math.round((Number(n) || 0) * 100) / 100); }

  const KITCHEN_UNITS = ['tsp', 'tbsp', 'fl oz', 'cups', 'pints', 'quarts', 'gallons', 'oz', 'lbs', 'pieces', 'cans', 'boxes', 'bags', 'packs', 'cases', 'crates', 'jars', 'bottles', 'jugs', 'tubs', 'to taste'];
  const UNIT_ALIASES = {
    teaspoon: 'tsp', teaspoons: 'tsp', tsp: 'tsp',
    tablespoon: 'tbsp', tablespoons: 'tbsp', tbsp: 'tbsp', tbs: 'tbsp',
    'fl oz': 'fl oz', floz: 'fl oz', 'fluid oz': 'fl oz',
    cup: 'cups', cups: 'cups', c: 'cups',
    pint: 'pints', pints: 'pints', pt: 'pints',
    quart: 'quarts', quarts: 'quarts', qt: 'quarts', qts: 'quarts',
    gallon: 'gallons', gallons: 'gallons', gal: 'gallons',
    ounce: 'oz', ounces: 'oz', oz: 'oz',
    pound: 'lbs', pounds: 'lbs', lb: 'lbs', lbs: 'lbs',
    gram: 'g', grams: 'g', g: 'g', kg: 'kg', ml: 'ml', l: 'l',
    piece: 'pieces', pieces: 'pieces', pc: 'pieces', pcs: 'pieces', each: 'pieces',
    can: 'cans', cans: 'cans', box: 'boxes', boxes: 'boxes', bag: 'bags', bags: 'bags',
    bottle: 'bottles', bottles: 'bottles', jug: 'jugs', jugs: 'jugs',
    pack: 'packs', packs: 'packs', 'case': 'cases', cases: 'cases', crate: 'crates', crates: 'crates',
    jar: 'jars', jars: 'jars', tub: 'tubs', tubs: 'tubs'
  };
  const VOL_TSP = { tsp: 1, tbsp: 3, 'fl oz': 6, cups: 48, pints: 96, quarts: 192, gallons: 768, ml: 0.202884, l: 202.884 };
  const WT_OZ = { oz: 1, lbs: 16, g: 0.035274, kg: 35.274 };

  function normUnit(u) {
    const k = String(u || 'pieces').trim().toLowerCase();
    return UNIT_ALIASES[k] || k || 'pieces';
  }
  function convertCulinaryUnit(qty, fromU, toU) {
    const f = normUnit(fromU), t = normUnit(toU);
    if (f === t) return qty;
    if (VOL_TSP[f] && VOL_TSP[t]) return (qty * VOL_TSP[f]) / VOL_TSP[t];
    if (WT_OZ[f] && WT_OZ[t]) return (qty * WT_OZ[f]) / WT_OZ[t];
    return null;
  }

  // Fuzzy Spelling Matcher (Levenshtein + Token Overlap)
  function levenshteinDist(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    const dp = Array.from({ length: m + 1 }, (_, i) => [i]);
    for (let j = 1; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }
  function findFuzzyCatalogMatch(rawName) {
    const q = String(rawName || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!q || q.length < 2) return null;
    let best = null;
    let bestScore = 0;
    const qTokens = q.split(' ').filter(Boolean);
    (state.items || []).filter(i => !i.discontinued).forEach(item => {
      const target = item.name.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
      if (target === q) { best = item; bestScore = 1; return; }
      const maxLen = Math.max(q.length, target.length);
      const levSim = 1 - (levenshteinDist(q, target) / maxLen);
      const tTokens = target.split(' ').filter(Boolean);
      let tokenHits = 0;
      qTokens.forEach(qt => {
        if (tTokens.some(tt => tt === qt || tt.startsWith(qt) || qt.startsWith(tt) || (qt.length >= 4 && levenshteinDist(qt, tt) <= 1))) {
          tokenHits++;
        }
      });
      const tokSim = qTokens.length ? (tokenHits / Math.max(qTokens.length, tTokens.length)) : 0;
      const score = Math.max(levSim, tokSim * 0.92);
      if (score > bestScore) { bestScore = score; best = item; }
    });
    return best && bestScore >= 0.56 ? { item: best, score: bestScore } : null;
  }

  // Cross-Unit Converter for Counts & Donations (e.g. lbs <-> cases/packs)
  function convertToStockUnit(qty, countedUnit, item, customPerStockUnit) {
    const q = Number(qty) || 0;
    if (!item) return { qty: q, unit: normUnit(countedUnit), needsPackSize: false, converted: false };
    const fromU = normUnit(countedUnit || item.unit);
    const toU = normUnit(item.unit);
    if (fromU === toU) return { qty: q, unit: toU, needsPackSize: false, converted: false };
    const direct = convertCulinaryUnit(q, fromU, toU);
    if (direct !== null) {
      return { qty: Math.round(direct * 100) / 100, unit: toU, needsPackSize: false, converted: true, note: `${q} ${fromU} = ${fmtNum(direct)} ${toU}` };
    }
    const perPack = Number(customPerStockUnit) || (Number(item.units_per_pack) > 1 ? Number(item.units_per_pack) : 0);
    if (perPack > 0) {
      const conv = q / perPack;
      return { qty: Math.round(conv * 100) / 100, unit: toU, needsPackSize: false, converted: true, note: `${q} ${fromU} ÷ ${perPack} ${fromU}/${toU} = ${fmtNum(conv)} ${toU}` };
    }
    return { qty: q, unit: toU, needsPackSize: true, converted: false, fromU, toU };
  }

  function formatKitchenFraction(val) {
    const v = Math.max(0, Number(val) || 0);
    if (v === 0) return '0';
    const whole = Math.floor(v + 1e-6);
    const rem = v - whole;
    const fracs = [
      [0.125, '⅛'], [0.25, '¼'], [1/3, '⅓'], [0.375, '⅜'],
      [0.5, '½'], [0.625, '⅝'], [2/3, '⅔'], [0.75, '¾'], [0.875, '⅞']
    ];
    for (const [f, sym] of fracs) {
      if (Math.abs(rem - f) < 0.035) return (whole > 0 ? String(whole) : '') + sym;
    }
    if (rem > 0.965) return String(whole + 1);
    if (rem < 0.035 && whole > 0) return String(whole);
    return fmtNum(v);
  }
  function formatKitchenAmt(qty, unit) {
    const rawU = String(unit || '').trim().toLowerCase();
    if (rawU === 'to taste' || rawU === 'as needed') return 'To taste';
    let q = Number(qty) || 0;
    if (q <= 0) return 'To taste';
    let u = normUnit(unit);
    if (u === 'tsp' && q >= 3) { q = q / 3; u = 'tbsp'; }
    if (u === 'cups' && q > 0 && q < 0.25) { q = q * 16; u = 'tbsp'; }
    if (u === 'tbsp' && q > 0 && q < 1) { q = q * 3; u = 'tsp'; }
    else if (u === 'tbsp' && q >= 16) { q = q / 16; u = 'cups'; }
    if (u === 'oz' && q >= 16) { q = q / 16; u = 'lbs'; }
    else if (u === 'lbs' && q > 0 && q < 1) { q = q * 16; u = 'oz'; }
    if (u === 'quarts' && q > 0 && q < 1) { q = q * 4; u = 'cups'; }
    if (u === 'gallons' && q > 0 && q < 1) { q = q * 4; u = 'quarts'; }
    return formatKitchenFraction(q) + ' ' + u;
  }
  function recomputeIngredientPer100(ing, baseServings) {
    const base = Math.max(1, Number(baseServings) || 65);
    const inv = ing.inv_id ? state.items.find(x => x.id === ing.inv_id) : null;
    if (!inv) return;
    if (Number(ing.stock_per_unit) > 0) {
      ing.per100 = Math.round(((Number(ing.qty) || 0) / Number(ing.stock_per_unit)) * (100 / base) * 1000) / 1000;
      return;
    }
    const conv = convertCulinaryUnit(Number(ing.qty) || 0, ing.unit, inv.unit);
    if (conv !== null) {
      ing.per100 = Math.round(conv * (100 / base) * 1000) / 1000;
    }
  }

  function parseIngredientLine(rawLine, baseServings) {
    const uniMap = { '⅛': ' 1/8', '¼': ' 1/4', '⅓': ' 1/3', '⅜': ' 3/8', '½': ' 1/2', '⅝': ' 5/8', '⅔': ' 2/3', '¾': ' 3/4', '⅞': ' 7/8' };
    let ln = String(rawLine || '').trim();
    Object.keys(uniMap).forEach(k => { ln = ln.split(k).join(uniMap[k]); });
    ln = ln.replace(/^[-*•]\s*/, '').replace(/\s+/g, ' ').trim();
    const m = ln.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(?:\s*[-–]\s*(\d+(?:\.\d+)?))?\s*(fl\s+oz|[a-zA-Z#]+)?\s+(.+)$/i);
    if (!m) return { name: ln, qty: 0, unit: 'to taste', inv_id: '', stock_per_unit: 0, per100: 0 };
    const parseFrac = (tok) => {
      const parts = String(tok).trim().split(/\s+/);
      let sum = 0;
      parts.forEach(p => {
        if (p.includes('/')) { const [a, b] = p.split('/').map(Number); sum += b ? (a / b) : 0; }
        else sum += parseFloat(p) || 0;
      });
      return sum || 1;
    };
    const q = parseFrac(m[1]);
    const rawU = (m[3] || '').toLowerCase();
    const knownUnit = rawU && (UNIT_ALIASES[rawU] || KITCHEN_UNITS.includes(rawU));
    const unit = knownUnit ? normUnit(rawU) : 'pieces';
    const ingName = (knownUnit ? m[4] : ((m[3] ? m[3] + ' ' : '') + m[4])).trim();
    const words = ingName.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
    const matchInv = state.items.find(i => {
      const iname = i.name.toLowerCase();
      return words.some(w => iname.includes(w));
    });
    const ingObj = { name: ingName, qty: Math.round(q * 100) / 100, unit, inv_id: matchInv ? matchInv.id : '', stock_per_unit: 0, per100: 0 };
    recomputeIngredientPer100(ingObj, baseServings);
    return ingObj;
  }

  function normalizeRecipe(r) {
    if (!r || typeof r !== 'object') return r;
    const baseServ = Math.max(1, Number(r.base_servings) || 65);
    const rawSteps = Array.isArray(r.steps) && r.steps.length
      ? r.steps
      : String(r.directions || '').split(/\r?\n+/).filter(Boolean);
    const steps = rawSteps.map(s => String(s || '').replace(/^\d+[\.\)]\s*/, '').trim()).filter(Boolean);
    const ingredients = (Array.isArray(r.ingredients) ? r.ingredients : []).map(g => {
      const unit = normUnit(g.unit || (Number(g.qty) > 0 ? 'pieces' : 'to taste'));
      const ing = {
        name: String(g.name || 'Ingredient').trim(),
        qty: unit === 'to taste' ? 0 : (Number(g.qty) || 0),
        unit,
        inv_id: g.inv_id || '',
        stock_per_unit: Number(g.stock_per_unit) || 0,
        per100: Number(g.per100) || 0
      };
      recomputeIngredientPer100(ing, baseServ);
      return ing;
    });
    const out = {
      ...r,
      name: String(r.name || 'Untitled Recipe').trim(),
      category: String(r.category || 'Main Entree').trim() || 'Main Entree',
      base_servings: baseServ,
      prep_min: Math.max(0, Number(r.prep_min) || 20),
      cook_min: Math.max(0, Number(r.cook_min) || 35),
      allergens: Array.from(new Set((Array.isArray(r.allergens) ? r.allergens : []).map(a => String(a || '').toLowerCase().trim()).filter(Boolean))),
      photo_url: String(r.photo_url || '').trim(),
      notes: String(r.notes || '').trim(),
      steps,
      ingredients
    };
    delete out.directions;
    return out;
  }

  function getFederalHoliday(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    if (isNaN(d.getTime())) return '';
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate(), dow = d.getDay();
    if (m === 1 && day === 1) return "New Year's Day";
    if (m === 1 && dow === 1 && day >= 15 && day <= 21) return 'MLK Jr. Day';
    if (m === 2 && dow === 1 && day >= 15 && day <= 21) return "Presidents' Day";
    if (m === 5 && dow === 1 && day >= 25) return 'Memorial Day';
    if (m === 6 && day === 19) return 'Juneteenth';
    if (m === 7 && day === 4) return 'Independence Day';
    if (m === 9 && dow === 1 && day <= 7) return 'Labor Day';
    if (m === 10 && dow === 1 && day >= 8 && day <= 14) return 'Columbus Day';
    if (m === 11 && day === 3) return 'Election Day (Closed)';
    if (m === 11 && day === 11) return 'Veterans Day';
    if (m === 11) {
      const nov1Dow = new Date(y, 10, 1).getDay();
      const thx = 1 + ((4 - nov1Dow + 7) % 7) + 21;
      if (day === thx) return 'Thanksgiving Day';
      if (day === thx + 1) return 'Thanksgiving Friday (Closed)';
    }
    if (m === 12 && day === 25) return 'Christmas Day';
    return '';
  }

  function getThirdFriday(year, month0) {
    const firstDow = new Date(year, month0, 1).getDay();
    const firstFri = 1 + ((5 - firstDow + 7) % 7);
    return localDateStr(new Date(year, month0, firstFri + 14));
  }

  function isHolidayOrClosedDay(ds) {
    if (getFederalHoliday(ds)) return getFederalHoliday(ds);
    const mp = (state.menuPlan || []).find(m => m.service_date === ds && m.status === 'CLOSED');
    return mp ? (mp.custom_title || 'Office Closed') : '';
  }

  function adjustOrderDateForHoliday(targetDateStr) {
    let d = targetDateStr;
    const holOn = isHolidayOrClosedDay(d);
    const holPrev = getFederalHoliday(addDays(d, -1));
    const holNext = getFederalHoliday(addDays(d, 1));
    const nearHol = holOn || holPrev || holNext;
    if (!nearHol) return { date: d, adjusted: false, reason: '' };
    let cursor = d;
    for (let i = 0; i < 7; i++) {
      const dow = new Date(cursor + 'T12:00:00').getDay();
      if ([1, 2, 3, 4, 5].includes(dow) && !isHolidayOrClosedDay(cursor) && !getFederalHoliday(addDays(cursor, 1))) {
        return { date: cursor, adjusted: cursor !== targetDateStr, reason: nearHol };
      }
      cursor = addDays(cursor, -1);
    }
    return { date: d, adjusted: false, reason: nearHol };
  }

  function getAutoHolidayAndOrderAnnouncements(todayStr) {
    const today = todayStr || localDateStr();
    const list = [];

    const holHits = [];
    for (let i = 0; i <= 14; i++) {
      const ds = addDays(today, i);
      const h = getFederalHoliday(ds);
      if (h) holHits.push({ date: ds, name: h, daysAway: i });
    }
    if (holHits.length) {
      const first = holHits[0];
      const labels = holHits.map(x => `${dLabel(x.date)} (${x.name})`).join(', ');
      list.push({
        id: 'auto-hol-' + first.date,
        isAuto: true,
        priority: 'urgent',
        title: `Upcoming Holiday Closing: ${first.name}`,
        body: `Salvation Army Community Kitchen is closed on ${labels}. Plan extra portions on the open service day before the holiday and adjust deliveries accordingly.`,
        author: 'Holiday Schedule',
        created_at: today
      });
    }

    const todayDow = new Date(today + 'T12:00:00').getDay();
    const daysToFri = (5 - todayDow + 7) % 7;
    const nextFri = addDays(today, daysToFri);
    const wAdj = adjustOrderDateForHoliday(nextFri);
    const wLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'W' && itemStatus(x) !== 'OK').length;
    if (wAdj.date >= today && wAdj.date <= addDays(today, 4)) {
      list.push({
        id: 'auto-ord-w-' + wAdj.date,
        isAuto: true,
        priority: wAdj.adjusted ? 'urgent' : 'reminder',
        title: wAdj.adjusted
          ? `Weekly Marberger & Produce Order — Adjusted for ${wAdj.reason}`
          : `Weekly Marberger & Produce Order Due ${wAdj.date === today ? 'Today' : dLabel(wAdj.date)}`,
        body: wAdj.adjusted
          ? `Normal Friday order (${dLabel(nextFri)}) falls on or near ${wAdj.reason}. Submit & approve your weekly PO early on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`
          : `Review Orders & POs and submit your weekly Marberger & Produce order on ${dLabel(wAdj.date)}. (${wLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }

    const nowD = new Date(today + 'T12:00:00');
    let m3Fri = getThirdFriday(nowD.getFullYear(), nowD.getMonth());
    if (addDays(m3Fri, 1) < today) {
      const nextMo = new Date(nowD.getFullYear(), nowD.getMonth() + 1, 1, 12);
      m3Fri = getThirdFriday(nextMo.getFullYear(), nextMo.getMonth());
    }
    const mAdj = adjustOrderDateForHoliday(m3Fri);
    const mLowCount = state.items.filter(x => !x.discontinued && x.cadence === 'M' && itemStatus(x) !== 'OK').length;
    if (mAdj.date >= today && mAdj.date <= addDays(today, 7)) {
      list.push({
        id: 'auto-ord-m-' + mAdj.date,
        isAuto: true,
        priority: mAdj.adjusted ? 'urgent' : 'reminder',
        title: mAdj.adjusted
          ? `Monthly Jordan Banana Order — Adjusted for ${mAdj.reason}`
          : `Monthly Jordan Banana Order Due ${mAdj.date === today ? 'Today' : dLabel(mAdj.date)}`,
        body: mAdj.adjusted
          ? `3rd-Friday order (${dLabel(m3Fri)}) falls on or near ${mAdj.reason}. Submit & approve your monthly whole-case PO early on ${dLabel(mAdj.date)}. (${mLowCount} item(s) below par)`
          : `Monthly dry & frozen whole-case order for Jordan Banana is due ${dLabel(mAdj.date)}. (${mLowCount} item(s) below par)`,
        author: 'Order Schedule',
        created_at: today
      });
    }
    return list;
  }

  function buildSeedRecipes() {
    return [
      {

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.items)) {
          return Object.assign(getDefaultState(), parsed);
        }
      }
    } catch (e) {}
    return getDefaultState();
  }

  function saveState(skipCloud) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
    if (!skipCloud) syncToSupabase();
  }

  // Universal In-Progress Draft Capture & Resume on Lock
  function captureInProgressWork() {
    const tab = state.activeTab || 'dashboard';
    const openModalTitle = document.getElementById('modal-backdrop')?.classList.contains('flex')
      ? (document.getElementById('modal-title')?.textContent || '') : '';
    const workTabs = ['stock', 'orders', 'receive', 'records', 'menu', 'recipes', 'safety', 'storage', 'forecasting'];
    const draft = { tab, savedAt: Date.now(), modal: null, fields: {} };
    let hasWork = workTabs.includes(tab) && tab !== 'dashboard';

    // Capture open modal form values
    if (openModalTitle) {
      const modalForm = document.querySelector('#modal-body form');
      if (modalForm && modalForm.id) {
        const vals = {};
        modalForm.querySelectorAll('input, select, textarea').forEach(el => {
          if (el.name && el.type !== 'password' && el.type !== 'file') {
            vals[el.name] = el.type === 'checkbox' ? el.checked : el.value;
          }
        });
        draft.modal = { id: modalForm.id, title: openModalTitle, vals };
        hasWork = true;
      }
    }

    // Capture donation intake rows if filled
    const donForm = document.getElementById('form-donation-intake');
    if (donForm) {
      const rows = Array.from(donForm.querySelectorAll('.don-row')).map(tr => ({
        name: tr.querySelector('[name="donItemName"]')?.value || '',
        qty: tr.querySelector('[name="donQty"]')?.value || '',
        unit: tr.querySelector('[name="donUnit"]')?.value || 'cases',
        exp: tr.querySelector('[name="donExp"]')?.value || ''
      })).filter(r => r.name || r.qty);
      draft.fields.donation = {
        donorName: donForm.querySelector('[name="donorName"]')?.value || '',
        donDate: donForm.querySelector('[name="donDate"]')?.value || '',
        donorContact: donForm.querySelector('[name="donorContact"]')?.value || '',
        donorAddress: donForm.querySelector('[name="donorAddress"]')?.value || '',
        donNotes: donForm.querySelector('[name="donNotes"]')?.value || '',
        rows
      };
      if (draft.fields.donation.donorName || rows.length) hasWork = true;
    }

    // Capture pasted recipe / suggestion forms
    const pasteForm = document.getElementById('form-paste-recipe');
    if (pasteForm && pasteForm.querySelector('[name="raw"]')?.value.trim()) {
      draft.fields.pasteRaw = pasteForm.querySelector('[name="raw"]').value;
      hasWork = true;
    }
    const sugForm = document.getElementById('form-suggest-recipe');
    if (sugForm && (sugForm.querySelector('[name="title"]')?.value.trim() || sugForm.querySelector('[name="raw"]')?.value.trim())) {
      draft.fields.sug = {
        url: sugForm.querySelector('[name="url"]')?.value || '',
        title: sugForm.querySelector('[name="title"]')?.value || '',
        servings: sugForm.querySelector('[name="servings"]')?.value || '',
        raw: sugForm.querySelector('[name="raw"]')?.value || ''
      };
      hasWork = true;
    }

    if (hasWork) {
      state._savedWorkDraft = draft;
    } else {
      delete state._savedWorkDraft;
    }
  }

  function restoreInProgressWork() {
    const draft = state._savedWorkDraft;
    delete state._savedWorkDraft;
    if (!draft) {
      state.activeTab = 'dashboard';
      state.selectedSheetDate = null;
      return;
    }
    state.activeTab = draft.tab || 'dashboard';
    setTimeout(() => {
      if (draft.fields?.donation) {
        const d = draft.fields.donation;
        const f = document.getElementById('form-donation-intake');
        if (f) {
          if (f.querySelector('[name="donorName"]')) f.querySelector('[name="donorName"]').value = d.donorName;
          if (f.querySelector('[name="donDate"]') && d.donDate) f.querySelector('[name="donDate"]').value = d.donDate;
          if (f.querySelector('[name="donorContact"]')) f.querySelector('[name="donorContact"]').value = d.donorContact;
          if (f.querySelector('[name="donorAddress"]')) f.querySelector('[name="donorAddress"]').value = d.donorAddress;
          if (f.querySelector('[name="donNotes"]')) f.querySelector('[name="donNotes"]').value = d.donNotes;
        }
      }
      if (draft.fields?.pasteRaw) {
        const ta = document.querySelector('#form-paste-recipe [name="raw"]');
        if (ta) ta.value = draft.fields.pasteRaw;
      }
      if (draft.fields?.sug) {
        const f = document.getElementById('form-suggest-recipe');

          if (f.querySelector('[name="title"]')) f.querySelector('[name="title"]').value = draft.fields.sug.title;

        const mf = document.getElementById(draft.modal.id);
        if (mf && draft.modal.vals) {
          Object.entries(draft.modal.vals).forEach(([k, v]) => {

            if (el) {
              if (el.type === 'checkbox') el.checked = !!v;
              else el.value = v;
            }

        }
      }
      showToast('Resumed your in-progress work');

  // Role Access Control (ADMIN, MANAGER, STAFF, VOLUNTEER)
  const ROLE_TABS = {
    ADMIN: ['dashboard', 'stock', 'orders', 'receive', 'menu', 'prep', 'recipes', 'safety', 'storage', 'checklists', 'forecasting', 'records', 'report', 'users', 'help'],
    MANAGER: ['dashboard', 'stock', 'orders', 'receive', 'menu', 'prep', 'recipes', 'safety', 'storage', 'checklists', 'forecasting', 'records', 'report', 'users', 'help'],
    STAFF: ['dashboard', 'stock', 'orders', 'receive', 'menu', 'prep', 'recipes', 'safety', 'storage', 'checklists', 'forecasting', 'records', 'help'],
    VOLUNTEER: ['dashboard', 'stock', 'menu', 'prep', 'recipes', 'safety', 'storage', 'checklists', 'records', 'help']
  };

  function normalizeRole(role) {
    const r = String(role || '').trim().toUpperCase();
    if (r === 'ADMIN') return 'ADMIN';
    if (r === 'MANAGER') return 'MANAGER';
    if (r === 'STAFF') return 'STAFF';
    if (r === 'VOLUNTEER') return 'VOLUNTEER';
    return 'VOLUNTEER';
  }
  const ROLE_RANK = { ADMIN: 4, MANAGER: 3, STAFF: 2, VOLUNTEER: 1 };
  function sortUsersByRoleAndName(list) { return [...(list || [])].sort((a, b) => (ROLE_RANK[normalizeRole(b.role)] || 0) - (ROLE_RANK[normalizeRole(a.role)] || 0) || (a.name || '').localeCompare(b.name || '')); }
  function isAdminRole(u) { return normalizeRole((u || getActiveUser()).role) === 'ADMIN'; }
  function canManageUserAccount(actor, target) {
    const a = actor || getActiveUser();
    const aRole = normalizeRole(a.role);
    if (aRole !== 'ADMIN' && aRole !== 'MANAGER') return false;
    if (!target) return false;
    if (target.id === 'usr-1') return false;
    const tRank = ROLE_RANK[normalizeRole(target.role)] || 0;
    const aRank = ROLE_RANK[aRole] || 0;
    return aRole === 'ADMIN' ? tRank <= aRank : tRank < aRank;
  }
  function isMgmtOrHigher(u) { const r = normalizeRole((u || getActiveUser()).role); return r === 'ADMIN' || r === 'MANAGER'; }
  function isStaffOrHigher(u) { const r = normalizeRole((u || getActiveUser()).role); return r === 'ADMIN' || r === 'MANAGER' || r === 'STAFF'; }

  function getActiveUser() {
    const u = (state.users || []).find(x => x.id === state.activeUserId && x.active !== false) || state.users[0];
    if (u) u.role = normalizeRole(u.role);
    return u;
  }
  function getAllowedTabs(user) {
    const r = normalizeRole((user || getActiveUser()).role);
    return ROLE_TABS[r] || ROLE_TABS.VOLUNTEER;
  }

  function ensureOwnerIntegrity() {
    if (!Array.isArray(state.users)) state.users = [];
    let owner = state.users.find(u => u.id === 'usr-1');
    if (!owner) {
      owner = makeUser('usr-1', 'William Clark', 'ADMIN', 'WC', '1234', true);
      state.users.unshift(owner);
    }
    owner.role = 'ADMIN';
    owner.active = true;
    return owner;
  }

  // Auto-Learning Par Levels
  function recordUsage(item, amount) {
    if (amount <= 0) return;
    item.usage_log = item.usage_log || [];
    const now = Date.now();
    item.usage_log.push([now, amount]);
    item.usage_log = item.usage_log.filter(e => now - e[0] < 8 * WK_MS);
  }
  function relearnPars() {
    const weeks = Math.min(8, (Date.now() - (state.startTimestamp || Date.now())) / WK_MS);
    if (weeks < 1) return;
    const now = Date.now();
    state.items.forEach(x => {
      if (x.par_manual || !x.usage_log || !x.usage_log.length) return;
      let total = 0;
      x.usage_log.forEach(e => { if (now - e[0] <= weeks * WK_MS) total += e[1]; });
      if (total <= 0) return;
      const cycleWeeks = x.cadence === 'W' ? 1 : 4.33;
      x.par = Math.round(((total / weeks) * cycleWeeks * 1.25) * 100) / 100;
      x.par_learned = true;
    });
  }
  function learnMessage() {
    const weeks = (Date.now() - (state.startTimestamp || Date.now())) / WK_MS;
    if (weeks < 1) {
      return `Learning: ${Math.max(1, Math.ceil(7 - weeks * 7))} more day(s) of use needed before par levels auto-update.`;
    }
    return `Par levels auto-update from the last ${Math.min(8, Math.floor(weeks))} week(s) of use (+25% safety stock). Editing a par manually locks that item.`;
  }

  // Stock Status & Forecasting Helpers
  function itemStatus(x) {
    if (x.on_hand <= 0) return 'OUT';
    if (x.par > 0 && itemNeed(x) >= 1) return 'LOW';
    return 'OK';
  }
  function itemNeed(x) { return Math.max(0, Math.round(((Number(x.par) || 0) - (Number(x.on_hand) || 0)) * 100) / 100); }

  function serviceDaysBetween(startStr, endStr) {
    const res = [];
    let cur = startStr;
    while (cur <= endStr) {
      const dow = new Date(cur + 'T12:00:00').getDay();
      if ([1, 2, 3, 5].includes(dow) && !getFederalHoliday(cur)) res.push(cur);
      cur = addDays(cur, 1);
    }
    return res;
  }

  function getOpenServedHistory() {
    return (state.menuPlan || [])
      .filter(m => m.status === 'SERVED' && Number(m.served_portions) > 0 && m.circumstance !== 'Closed / Federal Holiday')
      .sort((a, b) => a.service_date.localeCompare(b.service_date));
  }

  function isNearFederalHoliday(dateStr) {
    for (let o = -3; o <= 3; o++) {
      if (o === 0) continue;
      const hol = getFederalHoliday(addDays(dateStr, o));
      if (hol) return hol;
    }
    return '';
  }

  function getForecastMetrics() {
    const open = getOpenServedHistory().slice(-210);
    const recent = open.slice(-40);
    const avgAll = open.length ? open.reduce((s, m) => s + Number(m.served_portions), 0) / open.length : 60;
    const avgRecent = recent.length ? recent.reduce((s, m) => s + Number(m.served_portions), 0) / recent.length : avgAll;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dowFactor = {};
    [1, 2, 3, 5].forEach(d => {
      const arr = recent.filter(m => new Date(m.service_date + 'T12:00:00').getDay() === d);
      const dAvg = arr.length ? arr.reduce((s, m) => s + Number(m.served_portions), 0) / arr.length : avgRecent;
      dowFactor[dowNames[d]] = avgRecent > 0 ? Math.min(1.4, Math.max(0.65, dAvg / avgRecent)) : 1;
    });
    const buckets = { start: [], mid: [], end: [] };
    recent.forEach(m => {
      const day = parseInt(String(m.service_date).slice(8, 10), 10) || 15;
      buckets[day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end'].push(Number(m.served_portions));
    });
    const bucketFactor = {};
    ['start', 'mid', 'end'].forEach(k => {
      const arr = buckets[k];
      const bAvg = arr.length >= 2 ? arr.reduce((a, b) => a + b, 0) / arr.length : avgRecent;
      bucketFactor[k] = avgRecent > 0 ? Math.min(1.25, Math.max(0.8, bAvg / avgRecent)) : 1;
    });

    const mealMap = {};
    open.forEach(m => {
      const r = m.recipe_id ? state.recipes.find(x => x.id === m.recipe_id) : null;
      const title = ((r ? r.name : m.custom_title) || '').trim();
      if (!title || /bulk history/i.test(title)) return;
      const key = title.toLowerCase();
      if (!mealMap[key]) mealMap[key] = { title, vals: [] };
      mealMap[key].vals.push(Number(m.served_portions));
    });
    const mealStats = Object.values(mealMap).map(g => {
      const avg = g.vals.reduce((a, b) => a + b, 0) / g.vals.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.7, avg / avgRecent)) : 1;
      return { title: g.title, count: g.vals.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    }).sort((a, b) => b.avg - a.avg);

    function mealFactor(titleOrId) {
      if (!titleOrId) return 1;
      const r = state.recipes.find(x => x.id === titleOrId);
      const q = ((r ? r.name : titleOrId) || '').trim().toLowerCase();
      if (!q) return 1;
      const hit = mealStats.find(ms => ms.title.toLowerCase() === q || ms.title.toLowerCase().includes(q) || q.includes(ms.title.toLowerCase()));
      return hit ? hit.mult : 1;
    }

    const circMap = {};
    open.forEach(m => {
      const c = (m.circumstance || 'Normal Day').trim();
      if (!circMap[c]) circMap[c] = [];
      circMap[c].push(Number(m.served_portions));
    });
    const defaultCircMult = { 'Normal Day': 1, 'Holiday Week': 1.15, 'Local Event / Drive': 1.15, 'Snow / Cold Snap': 0.85, 'Heavy Rain / Storm': 0.88 };
    const circStats = Object.keys(circMap).map(c => {
      const arr = circMap[c];
      const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
      const mult = avgRecent > 0 ? Math.min(1.4, Math.max(0.6, avg / avgRecent)) : (defaultCircMult[c] || 1);
      return { name: c, count: arr.length, avg, mult, pct: Math.round((mult - 1) * 100) };
    });
    function circFactor(cName) {
      if (!cName || cName === 'Normal Day') return 1;
      const hit = circStats.find(cs => cs.name === cName);
      return hit ? hit.mult : (defaultCircMult[cName] || 1);
    }

    const nearHolVals = open.filter(m => isNearFederalHoliday(m.service_date)).map(m => Number(m.served_portions));
    const nearHolAvg = nearHolVals.length >= 2 ? nearHolVals.reduce((a, b) => a + b, 0) / nearHolVals.length : avgRecent * 1.10;
    const nearHolFactor = avgRecent > 0 ? Math.min(1.35, Math.max(0.75, nearHolAvg / avgRecent)) : 1.10;

    return { openCount: open.length, avgAll, avgRecent, dowFactor, bucketFactor, mealStats, mealFactor, circStats, circFactor, nearHolFactor };
  }

  function suggestPortionsOverall() {
    const m = getForecastMetrics();
    return m.openCount ? Math.round(m.avgRecent * 1.1) : 60;
  }

  function forecastWeekday(dateStr, mealTitleOrId, circumstance) {
    if (getFederalHoliday(dateStr)) return 0;
    const mp = (state.menuPlan || []).find(x => x.service_date === dateStr);
    if (mp && mp.status === 'CLOSED') return 0;
    const m = getForecastMetrics();
    if (!m.openCount) return 60;
    const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dn = dowNames[new Date(dateStr + 'T12:00:00').getDay()];
    const day = parseInt(String(dateStr).slice(8, 10), 10) || 15;
    const bKey = day <= 10 ? 'start' : day <= 20 ? 'mid' : 'end';
    const mRef = mealTitleOrId || (mp ? (mp.recipe_id || mp.custom_title) : '');
    const mMult = mRef ? m.mealFactor(mRef) : 1;
    const cRef = circumstance || (mp ? mp.circumstance : '');
    const cMult = cRef ? m.circFactor(cRef) : 1;
    const holMult = isNearFederalHoliday(dateStr) ? m.nearHolFactor : 1;
    const raw = m.avgRecent * (m.dowFactor[dn] || 1) * ((1 + (m.bucketFactor[bKey] || 1)) / 2) * mMult * cMult * holMult;
    return Math.max(10, Math.round(raw));
  }

  function syncFutureMenuPortionsToForecast(forceAll) {
    const today = localDateStr();
    let updated = 0;
    (state.menuPlan || []).forEach(mp => {
      if (mp.service_date < today || mp.status === 'SERVED' || mp.status === 'CLOSED') return;
      if (mp.portions_manual && !forceAll) return;
      mp.planned_portions = forecastWeekday(mp.service_date, mp.recipe_id || mp.custom_title, mp.circumstance);
      if (forceAll) mp.portions_manual = false;
      updated++;
    });
    return updated;
  }

  function importNov2026MenuAndRecipes() {
    const seedRecs = buildSeedRecipes();
    let recAdded = 0;
    seedRecs.forEach(sr => {
      if (!state.recipes.some(r => r.id === sr.id || r.name.toLowerCase() === sr.name.toLowerCase())) {
        state.recipes.push(normalizeRecipe(sr));
        recAdded++;
      }
    });
    let daysAdded = 0;
    NOV_2026_MENU_SEED.forEach((m, idx) => {
      const pred = m.status === 'CLOSED' ? 0 : forecastWeekday(m.service_date, m.recipe_id || m.custom_title, m.circumstance);
      const existing = state.menuPlan.find(x => x.service_date === m.service_date);
      if (existing) {
        existing.recipe_id = m.recipe_id;
        existing.custom_title = m.custom_title;
        existing.menu_type = m.menu_type;
        existing.circumstance = m.circumstance;
        if (existing.status !== 'SERVED') {
          existing.status = m.status;
          existing.planned_portions = pred;
        }
      } else {
        state.menuPlan.push({
          id: 'mp-nov26-' + idx,
          service_date: m.service_date,
          recipe_id: m.recipe_id,
          custom_title: m.custom_title,
          menu_type: m.menu_type,
          planned_portions: pred,
          served_portions: m.status === 'SERVED' ? pred : null,
          status: m.status,
          circumstance: m.circumstance,
          note: '',
          logged_by: m.status === 'SERVED' ? getActiveUser().name : ''
        });
        daysAdded++;
      }
    });
    syncFutureMenuPortionsToForecast(true);
    return { recCount: seedRecs.length, recAdded, daysAdded };
  }

  function onOrderQty(itemId) {
    let total = 0;
    (state.purchaseOrders || []).forEach(po => {
      if (['requested', 'approved', 'ordered'].includes(po.status)) {
        (po.lines || []).forEach(l => {
          if (l.item_id === itemId) total += Math.max(0, (l.qty || 0) - (l.received || 0));
        });
      }
    });
    return total;
  }

  function demandForDays(dayList) {
    const d = {};
    dayList.forEach(ds => {
      const mp = state.menuPlan.find(m => m.service_date === ds && m.status !== 'SERVED' && m.status !== 'CLOSED');
      if (!mp || !mp.recipe_id) return;
      const rec = state.recipes.find(r => r.id === mp.recipe_id);
      if (!rec) return;
      const portions = mp.portions_manual ? mp.planned_portions : forecastWeekday(ds, mp.recipe_id || mp.custom_title, mp.circumstance);
      (rec.ingredients || []).forEach(ing => {
        if (ing.inv_id && ing.per100) {
          d[ing.inv_id] = (d[ing.inv_id] || 0) + (ing.per100 * portions) / 100;
        }
      });
    });
    return d;
  }

  function suggestedOrderAmount(x, d7, d30) {
    const dem = (x.cadence === 'W' ? d7 : d30)[x.id] || 0;
    const demTarget = Math.round(dem * 1.1 * 100) / 100;
    const target = Math.max(Number(x.par) || 0, demTarget);
    const gap = Math.round((target - (Number(x.on_hand) || 0) - onOrderQty(x.id)) * 100) / 100;
    if (gap <= 0) return 0;
    if ((Number(x.on_hand) || 0) <= 0 && target > 0) return Math.max(1, Math.floor(gap));
    return gap >= 1 ? Math.floor(gap) : 0;
  }

  // UI Utilities: Toast & Modal
  function showToast(msg, type) {
    const box = document.getElementById('toast-container');
    if (!box) return;
    const el = document.createElement('div');
    const bg = type === 'error' ? 'bg-red-700' : type === 'warn' ? 'bg-amber-600' : 'bg-[#1b365d]';
    el.className = `${bg} text-white px-4 py-2.5 rounded-lg shadow-lg text-xs sm:text-sm font-semibold transition-opacity duration-300`;
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 4000);
  }

  // Supabase Relational Sync Engine (Steady Green Sync)
  let lastLocalSyncMs = 0;

  function updateSyncUI() {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (!dot || !lbl) return;
    if (syncStatus === 'live') {
      dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
      lbl.textContent = 'Live Supabase Sync';
    } else if (syncStatus === 'connecting') {
      dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
      lbl.textContent = 'Connecting...';
    } else {
      dot.className = 'w-2 h-2 rounded-full bg-amber-400';
      lbl.textContent = 'Local Mode';
    }
  }

  async function syncToSupabase() {
    if (!sbClient) return;
    lastLocalSyncMs = Date.now();
    try {
      const results = await Promise.allSettled([
        sbClient.from('kms_inventory_items').upsert(state.items.map(x => ({
          id: x.id, sku: x.sku, name: x.name, location: x.location, category: x.category,
          unit: x.unit, pack_label: x.pack_label, units_per_pack: x.units_per_pack || 1,
          on_hand: x.on_hand, par: x.par, par_manual: !!x.par_manual, par_learned: !!x.par_learned,
          cadence: x.cadence, vendor: x.vendor, unit_price: x.unit_price, usage_log: x.usage_log || [],
          discontinued: !!x.discontinued, updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_recipes').upsert(state.recipes.map(r => ({
          id: r.id, name: r.name, category: r.category, base_servings: r.base_servings,
          prep_min: r.prep_min || 20, cook_min: r.cook_min || 35, allergens: r.allergens || [],
          steps: r.steps || [], ingredients: r.ingredients || [], updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_menu_plan').upsert(state.menuPlan.map(m => ({
          id: m.id, service_date: m.service_date, recipe_id: m.recipe_id || '', custom_title: m.custom_title || '',
          menu_type: m.menu_type || 'RECIPE', planned_portions: m.planned_portions || 65,
          served_portions: m.served_portions, status: m.status || 'PLANNED', circumstance: m.circumstance || 'Normal Day',
          note: m.note || '', logged_by: m.logged_by || '', prep_checked_items: m.prep_checked_items || {},
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_purchase_orders').upsert(state.purchaseOrders.map(p => ({
          id: p.id, po_number: p.po_number, vendor: p.vendor, cadence: p.cadence, status: p.status,
          requested_by: p.requested_by, requested_date: p.requested_date, approved_by: p.approved_by || '',
          approved_date: p.approved_date || '', expected_arrival: p.expected_arrival || '',
          vendor_conf: p.vendor_conf || '', notes: p.notes || '', lines: p.lines || [],
          updated_at: new Date().toISOString()
        })), { onConflict: 'id' }),
        sbClient.from('kms_transactions').upsert(state.transactions.slice(0, 100).map(t => ({
          id: t.id, tx_date: t.tx_date, tx_type: t.tx_type, item_id: t.item_id || '', item_name: t.item_name,
          unit: t.unit, qty: t.qty, source: t.source || '', exp_date: t.exp_date || '', cleared: !!t.cleared,
          reason: t.reason || '', cost: t.cost || 0, po_number: t.po_number || '', staff_name: t.staff_name || '',
          note: t.note || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_storage_tags').upsert(state.storageTags.map(t => ({
          id: t.id, item_name: t.item_name, tag_category: t.tag_category || 'LEFTOVER', zone: t.zone,
          qty_label: t.qty_label || '', prep_date: t.prep_date, prep_time: t.prep_time || '',
          use_by_date: t.use_by_date, temp_f: t.temp_f, notes: t.notes || '', tagged_by: t.tagged_by || '',
          status: t.status || 'STORED', closed_by: t.closed_by || '', closed_at: t.closed_at || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_checklists').upsert(state.checklists.map(c => ({
          id: c.id, freq: c.freq, category: c.category, title: c.title, done: !!c.done,
          done_by: c.done_by || '', done_at: c.done_at || '', priority_carryover: !!c.priority_carryover
        })), { onConflict: 'id' }),
        sbClient.from('kms_users').upsert(state.users.map(u => ({
          id: u.id, name: u.name, role: normalizeRole(u.role), initials: u.initials, pin_hash: u.pin_hash,
          pin_salt: u.pin_salt, must_change_pin: !!u.must_change_pin, active: u.active !== false,
          onboarding_completed: !!u.onboarding_completed, completed_training_ids: u.completed_training_ids || [],
          email: u.email || ''
        })), { onConflict: 'id' }),
        sbClient.from('kms_announcements').upsert(state.announcements.map(a => ({
          id: a.id, priority: a.priority, title: a.title, body: a.body, alert_at: a.alert_at || '', repeat_rule: a.repeat_rule || 'none',
          repeat_days: a.repeat_days || [], expires_at: a.expires_at || '', author: a.author || '',
          dismissed_by: a.dismissed_by || {}, created_at: a.created_at
        })), { onConflict: 'id' })
      ]);
      const invRes = results[0];
      if (invRes && invRes.status === 'fulfilled' && !invRes.value?.error) {
        if (syncStatus !== 'live') { syncStatus = 'live'; updateSyncUI(); }
      }
      const todayLog = state.safetyLogs[localDateStr()];
      if (todayLog) {
        await sbClient.from('kms_safety_logs').upsert({
          log_date: localDateStr(), temps: todayLog.temps || {}, cleaning: todayLog.cleaning || {},
          logged_by: todayLog.logged_by || getActiveUser().name, updated_at: new Date().toISOString()
        }, { onConflict: 'log_date' });
      }
      if (state.messages.length) {
        await sbClient.from('kms_messages').upsert(state.messages.slice(-50).map(m => ({
          id: m.id, sender_id: m.sender_id, sender_name: m.sender_name, sender_role: m.sender_role,
          recipient_id: m.recipient_id || 'ALL', recipient_name: m.recipient_name || 'Everyone',
          priority: m.priority || 'normal', body: m.body, created_at_ms: m.created_at_ms, timestamp_label: m.timestamp_label
        })), { onConflict: 'id' });
      }
      if (state.activityLogs && state.activityLogs.length) {
        await sbClient.from('kms_activity_logs').upsert(state.activityLogs.slice(0, 120).map(a => ({
          id: a.id, actor_name: a.actor_name || 'System', actor_role: a.actor_role || '',
          category: a.category || 'ACTION', detail: a.detail || '',
          timestamp_label: a.timestamp_label || '', created_at_ms: Math.round(Number(a.created_at_ms) || Date.now())
        })), { onConflict: 'id' });
      }
      await sbClient.from('kms_settings').upsert({
        key: 'suggestions',
        value: { recipeSuggestions: (state.recipeSuggestions || []).slice(0, 50), menuSuggestions: (state.menuSuggestions || []).slice(0, 50) },
        updated_at: new Date().toISOString()
      }, { onConflict: 'key' });
    } catch (e) {}
  }

  let sbRealtimeChannel = null;
  let sbRefreshTimer = null;
  let sbRefreshing = false;

  async function refreshFromCloud(forcePull) {
    if (!sbClient || sbRefreshing) return;
    if (!forcePull && Date.now() - lastLocalSyncMs < 2500) return;
    sbRefreshing = true;
    try {
      const { data: invData, error } = await sbClient.from('kms_inventory_items').select('*');
      if (error) {
        if (syncStatus !== 'live') { syncStatus = 'local'; updateSyncUI(); }
        return;
      }
      if (invData && invData.length > 0) {
        const [recR, mpR, poR, txR, tagR, chkR, usrR, annR, msgR, safR, actR, setR] = await Promise.all([
          sbClient.from('kms_recipes').select('*'),
          sbClient.from('kms_menu_plan').select('*'),
          sbClient.from('kms_purchase_orders').select('*'),
          sbClient.from('kms_transactions').select('*').order('created_at', { ascending: false }).limit(120),
          sbClient.from('kms_storage_tags').select('*'),
          sbClient.from('kms_checklists').select('*'),
          sbClient.from('kms_users').select('*'),
          sbClient.from('kms_announcements').select('*'),
          sbClient.from('kms_messages').select('*').order('created_at_ms', { ascending: true }).limit(50),
          sbClient.from('kms_safety_logs').select('*'),
          sbClient.from('kms_activity_logs').select('*').order('created_at_ms', { ascending: false }).limit(150),
          sbClient.from('kms_settings').select('*').eq('key', 'suggestions')
        ]);
        state.items = invData;
        if (recR.data && recR.data.length) state.recipes = recR.data.map(normalizeRecipe);
        if (mpR.data && mpR.data.length) state.menuPlan = mpR.data;
        if (poR.data) state.purchaseOrders = poR.data;
        if (txR.data) state.transactions = txR.data;
        if (tagR.data) state.storageTags = tagR.data;
        if (chkR.data && chkR.data.length) state.checklists = chkR.data;
        if (usrR.data && usrR.data.length) { state.users = usrR.data; ensureOwnerIntegrity(); }
        if (annR.data) state.announcements = annR.data;
        if (msgR.data) state.messages = msgR.data;
        if (actR && actR.data && actR.data.length) {
          const byId = new Map();
          [...(state.activityLogs || []), ...actR.data].forEach(a => { if (a && a.id) byId.set(a.id, a); });
          state.activityLogs = Array.from(byId.values()).sort((a, b) => (Number(b.created_at_ms) || 0) - (Number(a.created_at_ms) || 0)).slice(0, 200);
        }
        if (setR && setR.data && setR.data[0] && setR.data[0].value) {
          const sv = setR.data[0].value;
          if (Array.isArray(sv.recipeSuggestions)) state.recipeSuggestions = sv.recipeSuggestions;
          if (Array.isArray(sv.menuSuggestions)) state.menuSuggestions = sv.menuSuggestions;
        }
        if (safR.data) {
          safR.data.forEach(s => { state.safetyLogs[s.log_date] = s; });
        }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      } else {
        syncStatus = 'live';
        await syncToSupabase();
      }
      syncStatus = 'live';
      updateSyncUI();
      if (!document.activeElement || !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        render();
      }
    } catch (e) {
      if (syncStatus !== 'live') { syncStatus = 'local'; updateSyncUI(); }
    } finally {
      sbRefreshing = false;
    }
  }

  async function initSupabase() {
    if (!window.supabase || !window.supabase.createClient) {
      syncStatus = 'local';
      updateSyncUI();
      return;
    }
    if (!sbClient) sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    if (syncStatus !== 'live') {
      syncStatus = 'connecting';
      updateSyncUI();
    }
    await refreshFromCloud(true);
    if (!sbRealtimeChannel && sbClient) {
      sbRealtimeChannel = sbClient.channel('kms_relational_live')
        .on('postgres_changes', { event: '*', schema: 'public' }, () => {
          if (Date.now() - lastLocalSyncMs < 2500) return;
          clearTimeout(sbRefreshTimer);
          sbRefreshTimer = setTimeout(() => { refreshFromCloud(false); }, 1500);
        }).subscribe();
    }
  }

  // Mandatory Modals (PIN Change & Training)
  function checkMandatoryModals() {
    const u = getActiveUser();
    const pinB = document.getElementById('pin-change-backdrop');
    const trnB = document.getElementById('training-backdrop');
    if (state.isLocked) {
      pinB.classList.add('hidden'); pinB.classList.remove('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    if (u.must_change_pin) {
      document.getElementById('pin-change-sub').textContent = `Hi ${u.name}, please set your personal 6+ character PIN before using the system.`;
      pinB.classList.remove('hidden'); pinB.classList.add('flex');
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
      return;
    }
    pinB.classList.add('hidden'); pinB.classList.remove('flex');
    const pendingTrn = (state.trainingModules || []).filter(m => (m.role === 'ALL' || normalizeRole(m.role) === normalizeRole(u.role)) && !(u.completed_training_ids || []).includes(m.id));
    if (pendingTrn.length && !u.onboarding_completed) {
      if (trainingStep >= pendingTrn.length) trainingStep = pendingTrn.length - 1;
      const mod = pendingTrn[trainingStep];
      document.getElementById('trn-title').textContent = mod.title;
      document.getElementById('trn-body').textContent = mod.content;
      document.getElementById('trn-step').textContent = `${trainingStep + 1} / ${pendingTrn.length}`;
      document.getElementById('btn-trn-prev').disabled = trainingStep === 0;
      document.getElementById('btn-trn-next').textContent = trainingStep === pendingTrn.length - 1 ? 'Complete Training ✓' : 'Next →';
      trnB.classList.remove('hidden'); trnB.classList.add('flex');
    } else {
      trnB.classList.add('hidden'); trnB.classList.remove('flex');
    }
  }

      cur = addDays(cur, 1);

    openModal('Bulk Add, Edit & Update Menu (Past & Future Dates)', `

  function showPrintMenuModal() {
    const mode = state._printMenuMode || 'monthly';
    const targetMonth = state._printMenuMonth || '2026-11';
    const targetDate = state._printMenuDate || localDateStr();
    document.body.classList.add('printing-modal');

    let bodyHtml = '';
    if (mode === 'daily') {
      const mp = state.menuPlan.find(m => m.service_date === targetDate) || {};
      const rec = mp.recipe_id ? state.recipes.find(r => r.id === mp.recipe_id) : null;
      const title = rec ? rec.name : (mp.custom_title || 'Daily Community Lunch');
      const portions = mp.status === 'CLOSED' ? 0 : (mp.portions_manual ? mp.planned_portions : forecastWeekday(targetDate, mp.recipe_id || title, mp.circumstance));
      bodyHtml = `
        <div class="p-4 border-2 border-[#1b365d] rounded-xl space-y-3 text-center">
          <div class="text-xs uppercase tracking-widest font-bold text-[#b3122b]">The Salvation Army &bull; Butler, PA</div>
          <h2 class="text-xl font-extrabold">Today's Community Lunch Menu</h2>
          <div class="text-sm font-semibold opacity-80">${dLabel(targetDate)} &bull; Served 11:30 AM – 12:30 PM</div>
          <div class="py-4 px-3 rounded-lg bg-black/5 text-lg font-bold">${esc(title)}</div>
          <div class="text-xs opacity-75">Includes Daily Salad Bar, Beverage &amp; Dessert &bull; Planned Service: ${portions} portions</div>
        </div>
      `;
    } else if (mode === 'weekly') {
      const days = serviceDaysBetween(targetDate, addDays(targetDate, 10)).slice(0, 4);
      bodyHtml = `
        <div class="space-y-3">
          <div class="text-center border-b border-[var(--line)] pb-2">
            <div class="text-xs uppercase font-bold text-[#b3122b]">The Salvation Army &bull; Butler, PA</div>
            <h2 class="text-lg font-extrabold">Weekly Community Meals Schedule (11:30 AM – 12:30 PM)</h2>
          </div>
          <table class="w-full text-left border-collapse text-xs">
            <thead><tr class="border-b-2 border-[#1b365d] uppercase"><th class="py-2">Day &amp; Date</th><th class="py-2">Featured Meal</th><th class="py-2 text-right">Planned Portions</th></tr></thead>
            <tbody class="divide-y divide-[var(--line)]">
              ${days.map(ds => {
                const mp = state.menuPlan.find(m => m.service_date === ds) || {};
                const rec = mp.recipe_id ? state.recipes.find(r => r.id === mp.recipe_id) : null;
                const title = rec ? rec.name : (mp.custom_title || 'Chef Special');
                const pred = mp.status === 'CLOSED' ? 0 : (mp.portions_manual ? mp.planned_portions : forecastWeekday(ds, mp.recipe_id || title, mp.circumstance));
                return `<tr><td class="py-2.5 font-bold">${dLabel(ds)}</td><td class="py-2.5">${esc(title)}</td><td class="py-2.5 text-right font-semibold">${pred}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    } else {
      const [yStr, mStr] = targetMonth.split('-');
      const y = Number(yStr), m0 = Number(mStr) - 1;

  // 7. RECIPES (Bulk Add/Edit + Pre-Approval Suggestion Review + 40-80 Scaling)
  function parsePastedRecipe(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const name = lines[0] || 'Imported Recipe';
    let servings = 4;
    const srvMatch = raw.match(/servings?\s*[:\-]?\s*(\d+)/i) || raw.match(/makes?\s*(\d+)/i);
    if (srvMatch) servings = Math.max(1, parseInt(srvMatch[1], 10));

    const allergenKeywords = {
      milk: /milk|butter|cheese|cream|yogurt|cheddar|mozzarella|parmesan/i,
      eggs: /\beggs?\b/i,
      wheat: /flour|pasta|spaghetti|penne|noodles|macaroni|bread|biscuit|cracker|wheat/i,
      soy: /\bsoy\b|tofu/i,
      peanuts: /peanut/i,
      'tree nuts': /almond|walnut|pecan|cashew/i,
      fish: /tuna|salmon|fish|cod/i,
      shellfish: /shrimp|crab|lobster/i,
      sesame: /sesame|tahini/i
    };
    const allergens = Object.keys(allergenKeywords).filter(a => allergenKeywords[a].test(raw));

    const ingredients = [];
    const steps = [];
    let mode = 'ing';
    lines.slice(1).forEach(ln => {
      if (/^(directions|instructions|steps|method)/i.test(ln)) { mode = 'step'; return; }
      if (/^(ingredients)/i.test(ln)) { mode = 'ing'; return; }
      if (mode === 'step' || /^\d+[\.\)]\s/.test(ln)) {
        steps.push(ln.replace(/^\d+[\.\)]\s*/, ''));
      } else {
        ingredients.push(parseIngredientLine(ln, servings));
      }
    });
    return normalizeRecipe({ id: uid('rec'), name, category: 'Main Entree', base_servings: servings, prep_min: 20, cook_min: 35, allergens, steps, ingredients });
  }

                      <div class="min-w-0">
                        <div class="font-bold truncate">${esc(m.title)}</div>
                        <div class="text-[10px] opacity-65">${esc(m.subtitle || 'Main')}</div>
                      </div>
                      <button type="button" data-import-mealdb="${esc(m.uid)}" class="kms-btn-ok px-2.5 py-1 text-[11px] shrink-0">Import</button>
                    </div>
                  `).join('')}</div>`}

          ` : `
            <form id="form-suggest-recipe" class="kms-card p-4 space-y-2.5">
              <h2 class="text-sm font-bold">Suggest a New Recipe</h2>
              <p class="text-[11px] opacity-75">Paste a recipe URL or recipe text—we'll format it cleanly and notify Management for approval.</p>
              <div class="flex gap-1.5">
                <input id="sug-url-inp" name="url" type="url" placeholder="Paste recipe URL (optional)..." class="kms-input flex-1 text-xs" />

              <input id="sug-title-inp" name="title" type="text" placeholder="Recipe title (auto-filled from URL or type here)" class="kms-input w-full text-xs" />
              <div class="grid grid-cols-2 gap-1.5">
                <input id="sug-serv-inp" name="servings" type="number" min="1" max="250" value="${predToday}" class="kms-input text-xs" />
                <input name="targetDate" type="date" class="kms-input text-xs" />
              </div>
              <textarea id="sug-raw-inp" name="raw" rows="4" placeholder="Paste ingredients &amp; directions..." class="kms-input w-full text-xs"></textarea>
              <button type="submit" id="btn-submit-sug" class="kms-btn-primary w-full py-2 text-xs">Submit &amp; Notify Management</button>
            </form>
          `}

          ${(() => {
            const pendSug = (state.recipeSuggestions || []).filter(s => s.status === 'PENDING');
            if (!pendSug.length) return '';
            return `
              <div class="kms-card p-4 space-y-2 border-l-4 border-l-amber-500">
                <h3 class="text-xs font-bold uppercase">Pending Recipe Suggestions (${pendSug.length})</h3>
                ${pendSug.map(s => `
                  <div class="p-2.5 rounded border border-[var(--line)] text-xs space-y-1.5">
                    <div class="font-bold">${esc(s.title)} <span class="opacity-65 font-normal">(Base ${s.servings || predToday})</span></div>
                    <div class="text-[11px] opacity-75">Suggested by ${esc(s.suggested_by)}</div>
                    ${isMgmtOrHigher() ? `
                      <div class="flex flex-wrap gap-1.5 pt-1">
                        <button type="button" data-review-recsug="${s.id}" class="kms-btn-navy px-2.5 py-1 text-[11px]">Review &amp; Edit</button>
                        <button type="button" data-approve-recsug="${s.id}" class="kms-btn-ok px-2.5 py-1 text-[11px]">Quick Approve</button>
                        <button type="button" data-reject-recsug="${s.id}" class="kms-btn-alt px-2.5 py-1 text-[11px]">Reject</button>
                      </div>
                    ` : '<span class="tag tag-LOW">Awaiting Management Approval</span>'}
                  </div>
                `).join('')}
              </div>
            `;
          })()}

          <div class="kms-card p-4 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <h3 class="text-sm font-bold">Saved Recipes (${state.recipes.length})</h3>
              <button type="button" id="btn-scan-recipe-qr" class="kms-btn-navy px-2.5 py-1 text-xs">Scan Recipe QR</button>
            </div>
            <input id="rec-search-inp" type="text" value="${esc(state._recSearch || '')}" placeholder="Search or scan recipe code..." class="kms-input w-full text-xs" />
            <div id="rec-qr-wrap" class="hidden border border-[var(--line)] rounded-lg p-2 bg-black/5">
              <div id="rec-qr-reader" class="w-full"></div>
              <button type="button" id="btn-stop-recipe-qr" class="kms-btn-alt w-full py-1 text-xs mt-1.5">Stop Camera</button>
            </div>
            <div class="space-y-1.5 max-h-96 overflow-y-auto">
              ${!filteredRecs.length ? '<p class="text-xs opacity-65 py-2 text-center">No matching recipes.</p>' : filteredRecs.map(r => `
                <button type="button" data-sel-rec="${r.id}" class="w-full text-left p-2.5 rounded-lg border text-xs ${rec && r.id === rec.id ? 'border-[#b3122b] bg-[#b3122b]/10 font-bold' : 'border-[var(--line)] hover:bg-black/5'}">
                  <div>${esc(r.name)}</div>
                  <div class="opacity-65 font-normal">${esc(r.category)} · Base ${r.base_servings} servings</div>
                </button>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="lg:col-span-2 kms-card p-4 space-y-4">
          ${!rec ? '<p class="text-sm opacity-70">Select or add a recipe.</p>' : `
            <div class="flex flex-wrap justify-between items-start gap-2 border-b border-[var(--line)] pb-3">
              <div class="flex items-start gap-3">
                ${rec.photo_url ? `<img src="${esc(rec.photo_url)}" alt="${esc(rec.name)}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-xl object-cover border border-[var(--line)] shrink-0" />` : ''}
                <div>
                  <div class="text-[11px] font-bold uppercase opacity-60">${esc(rec.category || 'Main')} &bull; Prep ${rec.prep_min || 20}m &bull; Cook ${rec.cook_min || 35}m &bull; ID: ${esc(rec.id)}</div>
                  <h2 class="text-lg font-bold">${esc(rec.name)}</h2>
                  ${(rec.allergens || []).length ? `<p class="text-xs font-bold text-[#b3122b]">Contains: ${esc(rec.allergens.join(', '))}</p>` : ''}
                  ${rec.notes ? `<p class="text-xs opacity-75 mt-0.5">${esc(rec.notes)}</p>` : ''}
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 no-print">
                <button type="button" id="btn-toggle-rec-matrix" class="kms-btn-alt px-3 py-1 text-xs">${showMatrix ? 'Single Scale View' : '40–80 Quick-Scan Table'}</button>
                <button type="button" id="btn-print-recipe-sheet" class="kms-btn-navy px-3 py-1 text-xs">Print Recipe + QR</button>
                ${isMgmtOrHigher() ? `<button type="button" data-edit-rec="${rec.id}" class="kms-btn-alt px-3 py-1 text-xs">Edit Details &amp; Directions</button><button type="button" data-del-rec="${rec.id}" class="kms-btn-alt px-3 py-1 text-xs">Delete</button>` : ''}
              </div>
            </div>

            <div class="bg-black/5 p-3.5 rounded-xl space-y-2.5 text-xs">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-3">
                  <label class="font-bold">Portions (40–80): <input id="rec-scale-inp" type="number" min="1" max="250" value="${scale}" class="kms-input w-20 text-center font-bold ml-1" /></label>
                  <label class="font-bold opacity-80">Recipe Base: <input id="rec-base-inp" type="number" min="1" value="${rec.base_servings}" data-rec-base="${rec.id}" ${!isMgmtOrHigher() ? 'disabled' : ''} class="kms-input w-16 text-center font-bold ml-1" /></label>
                </div>
                <div class="flex flex-wrap gap-1">
                  <button type="button" data-rec-preset="${predToday}" class="px-2.5 py-1 rounded-md font-bold ${scale === predToday ? 'bg-emerald-700 text-white' : 'bg-emerald-50 border border-emerald-300 text-emerald-800'}">Predicted (${predToday})</button>
                  ${[40, 45, 50, 55, 60, 65, 70, 75, 80].map(p => `
                    <button type="button" data-rec-preset="${p}" class="px-2 py-1 rounded-md font-semibold border ${scale === p ? 'bg-[#b3122b] text-white border-[#b3122b]' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}">${p}</button>
                  `).join('')}
                </div>
              </div>
              <input id="rec-scale-slider" type="range" min="40" max="80" step="1" value="${Math.min(80, Math.max(40, scale))}" class="w-full accent-[#b3122b]" />
            </div>

            ${showMatrix ? `
              <div class="overflow-x-auto border border-[var(--line)] rounded-lg">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-[var(--line)] bg-black/5 uppercase">
                      <th class="p-2">Ingredient</th>
                      ${[40, 50, 60, 70, 80].map(p => `<th class="p-2 text-center ${scale === p ? 'text-[#b3122b] font-bold' : ''}">${p} Port.</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[var(--line)]">
                    ${(rec.ingredients || []).map(g => `
                      <tr>
                        <td class="p-2 font-bold">${esc(g.name)}</td>
                        ${[40, 50, 60, 70, 80].map(p => {
                          const f = p / (rec.base_servings || 65);
                          return `<td class="p-2 text-center font-semibold ${scale === p ? 'bg-[#b3122b]/10 text-[#b3122b]' : ''}">${esc(formatKitchenAmt((g.qty || 0) * f, g.unit))}</td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : `
              <div class="space-y-2">
                ${(rec.ingredients || []).map((g, i) => {
                  const invItem = g.inv_id ? state.items.find(x => x.id === g.inv_id) : null;
                  const deductAtScale = invItem && g.per100 ? fmtNum((g.per100 * scale) / 100) : null;
                  const unitOpts = Array.from(new Set([...KITCHEN_UNITS, normUnit(g.unit)]));
                  return `
                  <div class="p-2.5 rounded-lg border border-[var(--line)] text-xs space-y-1.5">
                    <div class="flex justify-between items-center gap-2 font-bold">
                      <span>${esc(g.name)}${g.inv_id && onOrderQty(g.inv_id) > 0 ? ` <span class="tag tag-LOW ml-1">On PO: ${onOrderQty(g.inv_id)}</span>` : ''}</span>
                      <span class="text-sm text-[#b3122b]">${esc(formatKitchenAmt((g.qty || 0) * factor, g.unit))}</span>
                    </div>
                    ${invItem && deductAtScale ? `<div class="text-[11px] opacity-65">Background inventory: deducts ~${deductAtScale} ${esc(invItem.unit)} of ${esc(invItem.name)} at ${scale} portions</div>` : ''}
                    ${isMgmtOrHigher() ? `
                      <div class="flex flex-wrap items-center gap-1.5 pt-1 border-t border-[var(--line)]/60 opacity-85 no-print">
                        <input type="text" value="${esc(g.name)}" data-rec-ing="${rec.id}:${i}:name" class="kms-input w-36 text-xs font-semibold" />
                        <span class="font-semibold">Base (${rec.base_servings}):</span>
                        <input type="number" step="0.25" min="0" value="${g.qty || 0}" data-rec-ing="${rec.id}:${i}:qty" class="kms-input w-16 text-xs text-center" />
                        <select data-rec-ing="${rec.id}:${i}:unit" class="kms-input text-xs">${unitOpts.map(u => `<option value="${esc(u)}" ${normUnit(g.unit) === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
                        <span>→ Stock:</span>
                        <select data-rec-ing="${rec.id}:${i}:inv_id" class="kms-input text-xs max-w-[170px]">
                          <option value="">(not tracked)</option>
                          ${state.items.map(x => `<option value="${x.id}" ${g.inv_id === x.id ? 'selected' : ''}>${esc(x.name)} (${esc(x.unit)})</option>`).join('')}
                        </select>
                        ${invItem ? `
                          <span>1 ${esc(invItem.unit)} =</span>
                          <input type="number" step="0.5" min="0" value="${g.stock_per_unit || ''}" placeholder="auto" data-rec-ing="${rec.id}:${i}:stock_per_unit" class="kms-input w-16 text-xs text-center" />
                          <span>${esc(normUnit(g.unit))}</span>
                        ` : ''}
                        <button type="button" data-del-rec-ing="${rec.id}:${i}" class="ml-auto text-red-600 hover:underline font-semibold">Remove</button>
                      </div>
                    ` : ''}
                  </div>
                `; }).join('')}
                ${isMgmtOrHigher() ? `
                  <form id="form-add-rec-ing" data-rec-id="${esc(rec.id)}" class="p-2.5 rounded-lg border border-dashed border-[var(--line)] flex flex-wrap items-center gap-1.5 text-xs no-print">
                    <input name="name" type="text" required placeholder="+ Add ingredient" class="kms-input flex-1 min-w-[150px] text-xs" />
                    <input name="qty" type="number" step="0.25" min="0.1" required placeholder="Qty" class="kms-input w-16 text-xs text-center" />
                    <select name="unit" class="kms-input text-xs">${KITCHEN_UNITS.map(u => `<option value="${esc(u)}" ${u === 'cups' ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
                    <select name="inv_id" class="kms-input text-xs max-w-[160px]">
                      <option value="">Stock link (opt.)</option>
                      ${state.items.map(x => `<option value="${x.id}">${esc(x.name)} (${esc(x.unit)})</option>`).join('')}
                    </select>
                    <input name="stock_per_unit" type="number" step="0.5" min="0" placeholder="per stock unit" class="kms-input w-24 text-xs text-center" />
                    <button type="submit" class="kms-btn-alt px-2.5 py-1 text-xs font-semibold">+ Add</button>
                  </form>
                ` : ''}
              </div>
            `}

            ${(rec.directions || (rec.steps && rec.steps.length)) ? `
              <div class="p-3 rounded-lg bg-black/5 text-xs space-y-1">
                <div class="font-bold uppercase opacity-65">Directions</div>
                ${rec.steps && rec.steps.length
                  ? `<ol class="list-decimal list-inside space-y-1 leading-relaxed">${rec.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
                  : `<p class="whitespace-pre-line leading-relaxed">${esc(rec.directions)}</p>`}
              </div>
            ` : ''}
          `}
        </div>
      </div>
    `;
  }

  // 8. SAFETY
  function renderSafety(main) {
    const today = localDateStr();
    const log = state.safetyLogs[today] || { temps: {}, cleaning: {} };
    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h2 class="text-base font-bold">Daily Temperature Log — ${dLabel(today)}</h2>
              <p class="text-xs opacity-75">Coolers: ≤41°F · Freezers: ≤0°F · Hot Hold: ≥135°F</p>
            </div>
            <button type="button" onclick="window.print()" class="kms-btn-navy px-3 py-1.5 text-xs no-print">Print Daily Safety Log</button>
          </div>
          <div class="space-y-2">
            ${TEMP_CHECKS.map((c, i) => {
              const v = (log.temps || {})[i];
              const has = v !== undefined && v !== null && v !== '';
              const pass = has ? (c[1] === 'max' ? Number(v) <= c[2] : Number(v) >= c[2]) : null;
              return `
                <div class="p-2.5 rounded-lg border border-[var(--line)] flex flex-wrap items-center justify-between gap-2 text-xs sm:text-sm">
                  <div><strong>${esc(c[0])}</strong> <span class="opacity-70 text-xs">(${c[1] === 'max' ? 'at or below ' : 'at or above '}${c[2]}°F)</span></div>
                  <div class="flex items-center gap-2">
                    ${pass === null ? '' : `<span class="tag tag-${pass ? 'OK' : 'OUT'}">${pass ? 'PASS' : 'FIX NOW'}</span>`}
                    <input type="number" step="0.1" value="${has ? v : ''}" data-temp-idx="${i}" placeholder="°F" class="kms-input w-20 text-center font-bold" />
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="kms-card p-4 space-y-2">
          <h3 class="text-sm font-bold">Daily Cleaning Checklist</h3>
          ${CLEANING_TASKS.map((t, i) => `
            <label class="flex items-center gap-2.5 p-2 rounded border border-[var(--line)] text-xs sm:text-sm cursor-pointer">
              <input type="checkbox" data-clean-idx="${i}" ${(log.cleaning || {})[i] ? 'checked' : ''} />
              <span>${esc(t)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
  }

  // 9. STORAGE & DATE LABELS
  function renderStorage(main) {
    const today = localDateStr();
    const activeLeft = state.storageTags.filter(t => t.status === 'STORED' && t.tag_category !== 'SALAD_BAR').sort((a, b) => a.use_by_date.localeCompare(b.use_by_date));
    const activeSalad = state.storageTags.filter(t => t.status === 'STORED' && t.tag_category === 'SALAD_BAR').sort((a, b) => a.use_by_date.localeCompare(b.use_by_date));

    const tagCard = (t) => {
      const diff = Math.round((new Date(t.use_by_date + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000);
      const cls = diff < 0 ? 'OUT' : diff <= 1 ? 'LOW' : 'OK';
      return `
        <div class="p-3 rounded-lg border border-[var(--line)] flex flex-wrap items-center justify-between gap-2 text-xs">
          <div>
            <div class="font-bold text-sm">${esc(t.item_name)} ${t.qty_label ? `— ${esc(t.qty_label)}` : ''}</div>
            <div class="opacity-75">${esc(t.zone)} · Prepped ${dLabel(t.prep_date)} · Use by <strong>${dLabel(t.use_by_date)}</strong> <span class="tag tag-${cls}">${diff < 0 ? 'PAST – THROW OUT' : diff === 0 ? 'USE TODAY' : diff + ' day(s) left'}</span></div>
          </div>
          <div class="flex gap-1.5">
            <button type="button" data-tag-act="${t.id}:USED" class="kms-btn-ok px-2.5 py-1 text-xs">Used</button>
            <button type="button" data-tag-act="${t.id}:DISCARDED" class="kms-btn-alt px-2.5 py-1 text-xs">Toss</button>
          </div>
        </div>
      `;
    };

    main.innerHTML = `
      <div class="space-y-4">
        <form id="form-add-tag" class="kms-card p-4 space-y-3">
          <h2 class="text-base font-bold">Date-Label Leftovers &amp; Salad Bar (&gt;24 Hours)</h2>
          <div class="flex flex-wrap gap-1.5">
            ${SHELF_PRESETS.map((p, idx) => `<button type="button" data-tag-preset="${idx}" class="kms-btn-alt px-2.5 py-1 text-xs">${esc(p.label)}</button>`).join('')}
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2">
            <input name="itemName" required placeholder="What is it?" class="kms-input text-sm lg:col-span-2" />
            <input name="qtyLabel" placeholder="Amount (e.g. 2 pans)" class="kms-input text-sm" />
            <select name="tagCategory" class="kms-input text-sm">
              <option value="LEFTOVER">Meal Leftover</option>
              <option value="SALAD_BAR">Daily Salad Bar</option>
            </select>
            <select name="days" class="kms-input text-sm">
              <option value="7">Cooked Entree (7 days)</option>
              <option value="4">Dairy / Deli Salad (4 days)</option>
              <option value="3">Cut Greens / Fruit (3 days)</option>
              <option value="90">Freezer (90 days)</option>
            </select>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <select name="zone" class="kms-input text-sm">${LOCATIONS.map(l => `<option>${esc(l)}</option>`).join('')}</select>
            <button type="submit" class="kms-btn-primary px-4 py-2 text-sm">Add &amp; Date-Label</button>
          </div>
        </form>

        <div class="kms-card p-4 space-y-2">
          <h3 class="text-sm font-bold">Meal Leftovers FIFO (${activeLeft.length})</h3>
          ${!activeLeft.length ? '<p class="text-xs opacity-70">No meal leftovers logged.</p>' : activeLeft.map(tagCard).join('')}
        </div>

        <div class="kms-card p-4 space-y-2">
          <h3 class="text-sm font-bold">Daily Salad Bar &amp; Cold Prep FIFO (${activeSalad.length})</h3>
          ${!activeSalad.length ? '<p class="text-xs opacity-70">No Salad Bar items logged.</p>' : activeSalad.map(tagCard).join('')}
        </div>
      </div>
    `;
  }

  // 10. CHECKLISTS
  function renderChecklists(main) {
    const freq = state.checklistFreq || 'daily';
    const list = state.checklists.filter(c => c.freq === freq);
    const doneCount = list.filter(c => c.done).length;

    main.innerHTML = `
      <div class="space-y-4">
        <div class="kms-card p-4 space-y-3">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <div>
              <h2 class="text-base font-bold">Operational Checklists (${doneCount}/${list.length})</h2>
              <p class="text-xs opacity-75">Ticks stamp your name &amp; time automatically.</p>
