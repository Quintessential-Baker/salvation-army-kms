        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.inventory)) {
          const def = getDefaultState();
          if (!Array.isArray(parsed.users) || !parsed.users.length) parsed.users = def.users;
          if (!parsed.activeUserId) parsed.activeUserId = parsed.users[0].id;
          if (!Array.isArray(parsed.auditLogs)) parsed.auditLogs = [];
          if (!parsed.blindAuditDraft) parsed.blindAuditDraft = def.blindAuditDraft;
          if (!Array.isArray(parsed.menuPlan)) parsed.menuPlan = def.menuPlan;
          if (!parsed.checklistFreq) parsed.checklistFreq = 'daily';
          if (!Array.isArray(parsed.checklists)) parsed.checklists = def.checklists;
          if (!Array.isArray(parsed.checklistLogs)) parsed.checklistLogs = [];
          return parsed;
        }
      }
    } catch (e) {
      console.warn('localStorage unavailable, using in-memory state');
    }
    return getDefaultState();

    Volunteer: ['recipes', 'menu', 'prep', 'checklists', 'haccp', 'help'],
    Other: ['dashboard', 'menu', 'prep', 'checklists', 'help']
  };

  function normalizeRole(role) {
    if (ROLE_TABS[role]) return role;
    if (/manager|admin|lead|extern/i.test(role || '')) return 'Management';
    if (/staff|cook/i.test(role || '')) return 'Staff';
    if (/volunteer/i.test(role || '')) return 'Volunteer';
    return 'Other';
  }

  function getActiveUser() {
    const u = (state.users || []).find(x => x.id === state.activeUserId && x.active !== false);
    const user = u || (state.users && state.users[0]) || { id: 'usr-1', name: 'William Clark', role: 'Management', initials: 'WC', pin: '1234' };
    user.role = normalizeRole(user.role);
    if (!user.pin) user.pin = '1234';
    return user;
  }

  function getAllowedTabs(user) {
    const role = normalizeRole((user || getActiveUser()).role);
    return ROLE_TABS[role] || ROLE_TABS.Other;
  }

  function getSyncSlices() {
    return {
      inventory: state.inventory,
      recipes: state.recipes,
      prepQueue: state.prepQueue,
      transactions: state.transactions,
      haccpLogs: state.haccpLogs,
      serviceHistory: state.serviceHistory,
      users: state.users,
      auditLogs: state.auditLogs,
      menuPlan: state.menuPlan,
      checklists: { checklists: state.checklists, checklistLogs: state.checklistLogs }
    };
  }

  function applyCloudRow(id, data) {
    if (id === 'checklists' && data && Array.isArray(data.checklists)) {
      state.checklists = data.checklists;
      state.checklistLogs = Array.isArray(data.checklistLogs) ? data.checklistLogs : [];
    } else if (id in state && data !== undefined) {
      state[id] = data;
    }
  }

  function updateSyncBadge() {
    const dot = document.getElementById('sync-dot');
    const lbl = document.getElementById('sync-label');
    if (!dot || !lbl) return;
    if (syncStatus === 'live') {
      dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      lbl.textContent = 'Live Cloud Sync';
    } else if (syncStatus === 'connecting') {
      dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      lbl.textContent = 'Connecting...';
    } else {
      dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      lbl.textContent = 'Local Mode';
    }
  }

  async function pushChangedSlicesToCloud(forceAll) {
    if (!sbClient || suppressCloudPush) return;
    const slices = getSyncSlices();
    const user = getActiveUser();
    const rowsToUpsert = [];
    Object.keys(slices).forEach(k => {
      const json = JSON.stringify(slices[k]);
      if (forceAll || lastSliceHashes[k] !== json) {
        lastSliceHashes[k] = json;
        rowsToUpsert.push({
          id: k,
          data: slices[k],
          updated_by: user.name,
          updated_at: new Date().toISOString()
        });
      }
    });
    if (!rowsToUpsert.length) return;
    try {
      const { error } = await sbClient.from('kitchen_records').upsert(rowsToUpsert, { onConflict: 'id' });
      if (error) {
        syncStatus = 'offline';
        syncErrorMsg = error.message;
      } else {
        syncStatus = 'live';
        syncErrorMsg = '';
      }
    } catch (err) {
      syncStatus = 'offline';
      syncErrorMsg = err && err.message ? err.message : 'Network error';
    }
    updateSyncBadge();
  }

  async function pullFromCloud() {
    if (!sbClient) return;
    try {
      const { data, error } = await sbClient.from('kitchen_records').select('id, data, updated_by, updated_at');
      if (error) {
        syncStatus = 'offline';
        syncErrorMsg = error.message;
        updateSyncBadge();
        return;
      }
      if (data && data.length > 0) {
        suppressCloudPush = true;
        data.forEach(row => {
          applyCloudRow(row.id, row.data);
          lastSliceHashes[row.id] = JSON.stringify(row.data);
        });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        suppressCloudPush = false;
        syncStatus = 'live';
        syncErrorMsg = '';
        render();
      } else {
        // First time setup: seed cloud with initial data
        await pushChangedSlicesToCloud(true);
      }
    } catch (err) {
      syncStatus = 'offline';
      syncErrorMsg = err && err.message ? err.message : 'Connection failed';
    }
    updateSyncBadge();
  }

  function initSupabaseSync() {
    if (!window.supabase || !window.supabase.createClient) {
      syncStatus = 'offline';
      syncErrorMsg = 'Supabase SDK unavailable offline';
      updateSyncBadge();
      return;
    }
    try {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      pullFromCloud();
      sbClient.channel('kitchen_records_live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'kitchen_records' }, (payload) => {
          const row = payload.new;
          if (!row || !row.id) return;
          const incomingJson = JSON.stringify(row.data);
          if (lastSliceHashes[row.id] === incomingJson) return;
          suppressCloudPush = true;
          applyCloudRow(row.id, row.data);
          lastSliceHashes[row.id] = incomingJson;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          suppressCloudPush = false;
          render();
          showToast(`Live update (${row.id}) from ${row.updated_by || 'another device'}`);
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            syncStatus = 'live';
            updateSyncBadge();
          }
        });
    } catch (err) {
      syncStatus = 'offline';
      syncErrorMsg = err && err.message ? err.message : 'Init error';
      updateSyncBadge();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // ignore storage quota/sandbox restrictions
    }
    pushChangedSlicesToCloud(false);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')

      .replace(/"/g, '&quot;');

  function formatMass(grams) {
    const g = Number(grams) || 0;
    if (state.unitMode === 'us') {
      const lbs = g / 453.592;
      if (lbs >= 1) return lbs.toFixed(2) + ' lb';
      const oz = g / 28.3495;
      return oz.toFixed(1) + ' oz';
    }
    if (Math.abs(g) >= 1000) {
      return (g / 1000).toFixed(2) + ' kg (' + Math.round(g).toLocaleString() + ' g)';
    }
    return Math.round(g).toLocaleString() + ' g';
  }

  function formatShortMass(grams) {
    const g = Number(grams) || 0;
    if (state.unitMode === 'us') {
      const lbs = g / 453.592;
      return lbs >= 1 ? lbs.toFixed(1) + ' lb' : (g / 28.3495).toFixed(1) + ' oz';
    }
    return Math.round(g).toLocaleString() + ' g';
  }

  function getStockStatus(item) {
    if (item.stockGrams <= 0) return { label: 'Out of Stock', cls: 'bg-rose-100 text-rose-800 border-rose-200' };
    if (item.stockGrams < item.parGrams * 0.5) return { label: 'Critical', cls: 'bg-rose-100 text-rose-800 border-rose-200' };
    if (item.stockGrams < item.parGrams) return { label: 'Low Stock', cls: 'bg-amber-100 text-amber-800 border-amber-200' };
    return { label: 'In Stock', cls: 'bg-emerald-100 text-emerald-800 border-emerald-200' };
  }

  function getTomorrowPrepDemandByItem() {
    const demand = {};
    state.prepQueue.forEach(pq => {
      if (pq.deducted) return;
      const rec = state.recipes.find(r => r.id === pq.recipeId);
      if (!rec) return;
      const factor = pq.portions / rec.basePortions;
      rec.ingredients.forEach(ing => {
        demand[ing.itemId] = (demand[ing.itemId] || 0) + ing.grams * factor;
      });
    });
    (state.menuPlan || []).forEach(mp => {
      if (mp.status === 'DEDUCTED') return;
      const rec = state.recipes.find(r => r.id === mp.recipeId);
      if (!rec) return;
      const factor = mp.portions / rec.basePortions;
      rec.ingredients.forEach(ing => {
        demand[ing.itemId] = (demand[ing.itemId] || 0) + ing.grams * factor;
      });
    });
    return demand;
  }

  function getOrderSuggestions() {
    const prepDemand = getTomorrowPrepDemandByItem();
    const list = [];
    state.inventory.forEach(item => {
      const reserved = prepDemand[item.id] || 0;
      const projectedStock = item.stockGrams - reserved;
      if (projectedStock < item.parGrams) {
        const deficit = item.parGrams - projectedStock;
        const pack = item.packSizeGrams || 1000;
        const suggestedPacks = Math.max(1, Math.ceil(deficit / pack));
        list.push({
          item,
          reserved,
          projectedStock,
          deficit,
          suggestedPacks,
          suggestedGrams: suggestedPacks * pack
        });
      }
    });
    return list;
  }

  // --- Forecasting Engine ---
  function computeForecasts() {
    const hist = state.serviceHistory.slice().sort((a, b) => a.date.localeCompare(b.date));
    const avgAll = hist.length ? hist.reduce((s, r) => s + r.served, 0) / hist.length : 65;
    const recent4 = hist.slice(-4);
    const avgRecent = recent4.length ? recent4.reduce((s, r) => s + r.served, 0) / recent4.length : avgAll;
    const trendDelta = avgRecent - avgAll;

    // Day-of-week averages (Mon, Tue, Wed, Fri)
    const dowMap = { Mon: [], Tue: [], Wed: [], Fri: [] };
    hist.forEach(r => {
      if (dowMap[r.dayName]) dowMap[r.dayName].push(r.served);
    });
    const dowFactor = {};
    ['Mon', 'Tue', 'Wed', 'Fri'].forEach(d => {
      const arr = dowMap[d];
      const dAvg = arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : avgAll;
      dowFactor[d] = avgAll > 0 ? dAvg / avgAll : 1;
    });

    // Next 7 MTWF service days
    const days = [];
    let cursor = new Date();
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    while (days.length < 7) {
      cursor.setDate(cursor.getDate() + 1);
      const dn = dayNames[cursor.getDay()];
      if (dn === 'Mon' || dn === 'Tue' || dn === 'Wed' || dn === 'Fri') {
        const base = avgRecent * (dowFactor[dn] || 1);
        const pred = Math.min(80, Math.max(50, Math.round(base)));
        days.push({
          label: cursor.toISOString().slice(5, 10) + ' (' + dn + ')',
          predicted: pred,
          recommendedPrep: Math.min(80, Math.max(50, Math.ceil(pred / 5) * 5))
        });
      }
    }

    // Next 8 weeks (4 service days per week)
    const weeks = [];
    const weeklyBase = avgRecent * 4;
    for (let w = 1; w <= 8; w++) {
      const proj = Math.round(weeklyBase + trendDelta * 0.25 * w);
      weeks.push({
        label: 'Week +' + w,
        predicted: Math.max(200, proj),
        recommendedPrep: Math.min(320, Math.max(200, Math.round(proj * 1.05)))
      });
    }

    // Next 12 months (~17 service days/mo, seasonal winter bump)
    const months = [];
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const nowM = new Date().getMonth();
    const seasonal = [1.06, 1.05, 1.02, 0.98, 0.95, 0.96, 0.97, 0.98, 1.0, 1.03, 1.07, 1.08];
    for (let m = 1; m <= 12; m++) {
      const mIdx = (nowM + m) % 12;
      const proj = Math.round(avgRecent * 17 * seasonal[mIdx]);
      months.push({
        label: monthNames[mIdx],
        predicted: proj,
        recommendedPrep: Math.round(proj * 1.05)
      });
    }

    // Next 3 years (~200 service days/year)
    const years = [];
    const baseYear = new Date().getFullYear();
    for (let y = 0; y < 3; y++) {
      const growth = 1 + 0.03 * y;
      const proj = Math.round(avgRecent * 200 * growth);
      years.push({
        label: String(baseYear + y),
        predicted: proj,
        recommendedPrep: Math.round(proj * 1.05)
      });
    }

    return { avgAll, avgRecent, days, weeks, months, years };
  }

  function renderInventory(main) {
    const searchVal = (document.getElementById('inv-search')?.value || '').toLowerCase();

    const filtered = state.inventory.filter(i => {
      const matchText = !searchVal || i.name.toLowerCase().includes(searchVal) || i.sku.toLowerCase().includes(searchVal) || i.vendor.toLowerCase().includes(searchVal);
      const matchZone = zoneVal === 'ALL' || i.zone === zoneVal;

  // 6. NEXT-DAY PREP LIST
  function renderPrep(main) {
    // Aggregate ingredient pulls by storage zone
    const byZone = { 'Walk-In Cooler': [], 'Walk-In Freezer': [], 'Dry Storage': [] };
    state.prepQueue.forEach(pq => {
      const rec = state.recipes.find(r => r.id === pq.recipeId);
      if (!rec) return;
      const factor = pq.portions / rec.basePortions;
      rec.ingredients.forEach(ing => {
        const inv = state.inventory.find(i => i.id === ing.itemId);
        if (!inv) return;
        const zone = byZone[inv.zone] ? inv.zone : 'Dry Storage';
        byZone[zone].push({
          prepId: pq.id,
          key: pq.id + '_' + inv.id,
          recipeName: rec.name,
          itemName: inv.name,
          grams: ing.grams * factor,
          checked: !!(pq.checkedItems && pq.checkedItems[inv.id])
        });
      });
    });

    main.innerHTML = `
      <div class="space-y-5">
        <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 shadow-sm flex flex-wrap items-center justify-between gap-3">

                <div>
                  <span class="font-semibold text-slate-900">${escapeHtml(pq.recipeName)}</span>
                  <span class="ml-2 text-xs font-bold text-red-700">${pq.portions} portions</span>
                  <span class="ml-2 px-2 py-0.5 rounded text-xs font-medium ${pq.deducted ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${pq.deducted ? 'Stock Deducted' : 'Pending Deduction'}</span>

                </div>

        <!-- Pull List by Zone -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

  // 9. BLIND AUDIT & RECONCILIATION
  function renderAudit(main) {
    const draft = state.blindAuditDraft || { zone: 'ALL', revealed: false, counts: {}, units: {}, reasons: {} };
    const zone = draft.zone || 'ALL';
    const items = state.inventory.filter(i => zone === 'ALL' || i.zone === zone);

    function toGrams(val, unit, item) {
      const n = Number(val);
      if (isNaN(n) || val === '' || val === null) return null;
      if (unit === 'kg') return Math.round(n * 1000);
      if (unit === 'lb') return Math.round(n * 453.592);
      if (unit === 'pack') return Math.round(n * (item.packSizeGrams || 1000));
      return Math.round(n);
    }

    const enteredItems = items.filter(i => draft.counts[i.id] !== undefined && draft.counts[i.id] !== '');

    main.innerHTML = `
      <div class="space-y-5">
        <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-base font-bold text-slate-900">Blind Inventory Audit &amp; Reconciliation</h2>
              <p class="text-xs text-slate-500">Auditor: <strong>${escapeHtml(getActiveUser().name)}</strong> (${escapeHtml(getActiveUser().role)}). System quantities stay hidden until you reveal.</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              <select id="audit-zone-filter" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs sm:text-sm bg-white" ${draft.revealed ? 'disabled' : ''}>
                <option value="ALL" ${zone === 'ALL' ? 'selected' : ''}>All Storage Zones</option>
                <option value="Dry Storage" ${zone === 'Dry Storage' ? 'selected' : ''}>Dry Storage</option>
                <option value="Walk-In Cooler" ${zone === 'Walk-In Cooler' ? 'selected' : ''}>Walk-In Cooler</option>
                <option value="Walk-In Freezer" ${zone === 'Walk-In Freezer' ? 'selected' : ''}>Walk-In Freezer</option>
              </select>
              ${!draft.revealed
                ? `<button id="btn-audit-reveal" class="px-3.5 py-1.5 rounded-lg bg-red-700 hover:bg-red-800 text-white text-xs sm:text-sm font-semibold">Reveal &amp; Calculate Variances (${enteredItems.length})</button>`
                : `<button id="btn-audit-reconcile-all" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold">Reconcile All (${enteredItems.length})</button>
                   <button id="btn-audit-reset" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs sm:text-sm font-medium hover:bg-slate-50">New Blind Audit</button>`
              }
            </div>
          </div>

          <div class="p-3 rounded-lg text-xs font-medium ${draft.revealed ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}">
            ${draft.revealed
              ? 'Variance Review Mode: Compare your physical counts against expected system stock, add a reason note if needed, and reconcile to update Living Stock.'
              : 'Blind Count Mode Active: Expected system stock is hidden so counts remain unbiased. Enter physical counts for the items you are auditing, then click "Reveal & Calculate Variances".'}
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase">
                  <th class="py-2 pr-3">SKU</th>
                  <th class="py-2 pr-3">Item</th>
                  <th class="py-2 pr-3">Zone</th>
                  ${draft.revealed ? '<th class="py-2 pr-3">System Expected</th>' : ''}
                  <th class="py-2 pr-3">Physical Count</th>
                  <th class="py-2 pr-3">Unit</th>
                  ${draft.revealed ? '<th class="py-2 pr-3">Variance</th><th class="py-2 pr-3">Audit Note</th><th class="py-2 text-right">Action</th>' : ''}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${items.map(item => {
                  const rawVal = draft.counts[item.id] !== undefined ? draft.counts[item.id] : '';
                  const unit = draft.units[item.id] || (state.unitMode === 'us' ? 'lb' : 'g');
                  const physG = toGrams(rawVal, unit, item);
                  const varianceG = physG !== null ? physG - item.stockGrams : null;
                  const varPct = (varianceG !== null && item.stockGrams > 0) ? ((varianceG / item.stockGrams) * 100).toFixed(1) + '%' : '';
                  const reasonVal = draft.reasons[item.id] || '';
                  return `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2 pr-3 font-mono text-xs text-slate-500">${escapeHtml(item.sku)}</td>
                      <td class="py-2 pr-3 font-medium text-slate-900">${escapeHtml(item.name)}</td>

                        </select>
                      </td>
                      ${draft.revealed ? `
                        <td class="py-2 pr-3 font-bold ${varianceG === null ? 'text-slate-400' : varianceG === 0 ? 'text-emerald-700' : varianceG > 0 ? 'text-blue-700' : 'text-rose-700'}">
                          ${varianceG === null ? '—' : `${varianceG >= 0 ? '+' : ''}${formatShortMass(varianceG)} ${varPct ? '(' + varPct + ')' : ''}`}
                        </td>
                        <td class="py-2 pr-3">
                          <input type="text" data-audit-reason="${item.id}" value="${escapeHtml(reasonVal)}" placeholder="Reason (optional)" class="w-36 px-2 py-1 rounded border border-slate-300 text-xs" />
                        </td>
                        <td class="py-2 text-right">
                          ${physG !== null
                            ? `<button data-reconcile-item="${item.id}" class="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold">Reconcile</button>`
                            : '<span class="text-xs text-slate-400">Not counted</span>'}
                        </td>
                      ` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <!-- Audit Reconciliation History -->
        <div class="bg-white rounded-xl border border-slate-200 p-4 sm:p-5 shadow-sm">

          ${state.auditLogs.length === 0

                        <td class="py-2 text-xs text-slate-600">${escapeHtml(a.reason || '—')}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>`
          }
        </div>
      </div>
    `;

  let html5QrInstance = null;

  function applyScannedCode(code) {
    const clean = String(code || '').trim().toLowerCase();
    if (!clean) return;
    const match = state.inventory.find(i =>
      i.sku.toLowerCase() === clean ||
      i.id.toLowerCase() === clean ||
      i.name.toLowerCase().includes(clean)
    );
    if (!match) {
      showToast(`No inventory item matched "${code}"`, 'warn');
      return;
    }
    const targetMode = document.getElementById('quick-scan-target')?.value || 'checkin';
    const sel = document.getElementById(targetMode === 'waste' ? 'waste-item-select' : 'checkin-item-select');
    const form = document.getElementById(targetMode === 'waste' ? 'form-waste' : 'form-checkin');
    if (sel) sel.value = match.id;
    const qtyInput = form ? form.querySelector('input[name="qty"]') : null;
    if (qtyInput) qtyInput.focus();
    showToast(`Scanned: ${match.name} (${match.sku}) → ready for ${targetMode === 'waste' ? 'Waste' : 'Check-In'}`);
  }

  function downloadFile(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function deductRecipeFromInventory(rec, portions, labelPrefix) {
    const factor = portions / rec.basePortions;
    rec.ingredients.forEach(ing => {
      const inv = state.inventory.find(i => i.id === ing.itemId);
      if (!inv) return;
      const usedG = Math.round(ing.grams * factor);
      inv.stockGrams = Math.max(0, inv.stockGrams - usedG);
      inv.lastUpdated = new Date().toISOString().slice(0, 10);
      state.transactions.unshift({
        id: uid('tx'),
        timestamp: nowStamp(),
        type: 'USAGE',
        itemId: inv.id,
        itemName: inv.name,
        grams: -usedG,
        note: `${labelPrefix}: ${rec.name} (${portions} portions)`,
        staff: getActiveUser().name
      });
    });
  }

  // --- Global Event Delegation ---
  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) {
      state.activeTab = tabBtn.dataset.tab;
      saveState();
      render();
      return;
    }

    const gotoBtn = e.target.closest('[data-goto]');
    if (gotoBtn) {
      state.activeTab = gotoBtn.dataset.goto;
      saveState();
      render();
      return;
    }

    if (e.target.id === 'btn-quick-checkin') {
      state.activeTab = 'transactions';
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-quick-waste') {
      state.activeTab = 'transactions';
      saveState();
      render();
      return;
    }
    if (e.target.closest('#btn-sync-status')) {
      showSyncModal();
      return;
    }
    if (e.target.id === 'btn-force-pull') {
      pullFromCloud().then(() => { closeModal(); showToast('Pulled latest cloud data'); });
      return;
    }
    if (e.target.id === 'btn-force-push') {
      pushChangedSlicesToCloud(true).then(() => { closeModal(); showToast('Pushed local data to Supabase'); });
      return;
    }
    if (e.target.id === 'btn-backup-modal') {
      showBackupModal();
      return;
    }
    if (e.target.id === 'modal-close' || e.target.id === 'modal-backdrop') {
      closeModal();
      return;
    }
    if (e.target.id === 'btn-toggle-units' || e.target.id === 'btn-toggle-units-rec') {
      state.unitMode = state.unitMode === 'grams' ? 'us' : 'grams';
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-print-qr-labels') {
      showQrLabelsModal();
      return;
    }
    if (e.target.id === 'btn-start-cam-scan') {
      const wrap = document.getElementById('cam-reader-wrap');
      const startBtn = document.getElementById('btn-start-cam-scan');
      const stopBtn = document.getElementById('btn-stop-cam-scan');
      if (!window.Html5Qrcode) {
        showToast('Camera scanner library unavailable offline — use USB/Bluetooth scanner or SKU search.', 'warn');
        return;
      }
      if (wrap) wrap.classList.remove('hidden');
      if (startBtn) startBtn.classList.add('hidden');
      if (stopBtn) stopBtn.classList.remove('hidden');
      try {
        html5QrInstance = new window.Html5Qrcode('cam-reader');
        html5QrInstance.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 140 } },
          (decodedText) => {
            applyScannedCode(decodedText);
            stopCameraScan();
          },
          () => {}
        ).catch(() => {
          stopCameraScan();
          showToast('Camera access blocked in this window. Open the HTML file directly in Safari/Chrome or use a USB/Bluetooth scanner.', 'warn');
        });
      } catch (err) {
        stopCameraScan();
        showToast('Camera unavailable here — open standalone file in Safari/Chrome.', 'warn');
      }
      return;
    }
    if (e.target.id === 'btn-stop-cam-scan') {
      stopCameraScan();
      return;
    }
    if (e.target.id === 'btn-nfc-scan') {
      if (!('NDEFReader' in window)) {
        showToast('Web NFC is only supported in Chrome on Android (not iPad/iOS Safari). Use Camera QR or a Bluetooth RFID/barcode scanner.', 'warn');
        return;
      }
      try {
        const ndef = new window.NDEFReader();
        ndef.scan().then(() => {
          showToast('NFC ready — tap tag to back of device');
          ndef.onreading = (ev) => {
            const dec = new TextDecoder();
            for (const rec of ev.message.records) {
              applyScannedCode(dec.decode(rec.data));
              break;
            }
          };
        }).catch(() => showToast('NFC permission denied or disabled.', 'warn'));
      } catch (err) {
        showToast('Could not start NFC reader.', 'warn');
      }
      return;
    }
    if (e.target.id === 'btn-add-inv-item') {
      showAddItemModal();
      return;
    }
    if (e.target.id === 'btn-new-recipe') {
      showAddRecipeModal();
      return;
    }

    const adjBtn = e.target.closest('[data-adj]');
    if (adjBtn) {
      const item = state.inventory.find(i => i.id === adjBtn.dataset.adj);
      const delta = Number(adjBtn.dataset.delta);
      if (item) {
        item.stockGrams = Math.max(0, item.stockGrams + delta);
        state.transactions.unshift({
          id: uid('tx'),
          timestamp: nowStamp(),
          type: delta >= 0 ? 'INCOMING' : 'USAGE',
          itemId: item.id,
          itemName: item.name,
          grams: delta,
          note: 'Quick manual adjustment',
          staff: getActiveUser().name
        });
        saveState();
        render();
        showToast(`${item.name} adjusted by ${delta >= 0 ? '+' : ''}${delta} g`);
      }
      return;
    }

    const recBtn = e.target.closest('[data-select-recipe]');
    if (recBtn) {
      state.selectedRecipeId = recBtn.dataset.selectRecipe;
      saveState();
      render();
      return;
    }

    const presetBtn = e.target.closest('[data-scale-preset]');
    if (presetBtn) {
      state.recipeScalePortions = Number(presetBtn.dataset.scalePreset);
      saveState();
      render();
      return;
    }

    if (e.target.id === 'btn-deduct-today') {
      const rec = state.recipes.find(r => r.id === state.selectedRecipeId);
      if (rec) {
        deductRecipeFromInventory(rec, state.recipeScalePortions, 'Today Service');
        saveState();
        render();
        showToast(`Deducted ingredients for ${rec.name} (${state.recipeScalePortions} portions)`);
      }
      return;
    }

    if (e.target.id === 'btn-queue-tomorrow') {
      const rec = state.recipes.find(r => r.id === state.selectedRecipeId);
      if (rec) {
        deductRecipeFromInventory(rec, state.recipeScalePortions, 'Next-Day Prep');
        state.prepQueue.push({
          id: uid('prep'),
          recipeId: rec.id,
          recipeName: rec.name,
          portions: state.recipeScalePortions,
          deducted: true,
          targetDate: 'Tomorrow',
          checkedItems: {}
        });
        saveState();
        render();
        showToast(`Added ${rec.name} (${state.recipeScalePortions} portions) to Next-Day Prep & deducted stock`);
      }
      return;
    }

    const deductPrepBtn = e.target.closest('[data-deduct-prep]');
    if (deductPrepBtn) {
      const pq = state.prepQueue.find(p => p.id === deductPrepBtn.dataset.deductPrep);
      const rec = pq && state.recipes.find(r => r.id === pq.recipeId);
      if (pq && rec && !pq.deducted) {
        deductRecipeFromInventory(rec, pq.portions, 'Next-Day Prep');
        pq.deducted = true;
        saveState();
        render();
        showToast(`Deducted stock for ${rec.name}`);
      }
      return;
    }

    const commitMenuBtn = e.target.closest('[data-commit-menu]');
    if (commitMenuBtn) {
      const mp = (state.menuPlan || []).find(m => m.id === commitMenuBtn.dataset.commitMenu);
      const rec = mp && state.recipes.find(r => r.id === mp.recipeId);
      if (mp && rec && mp.status !== 'DEDUCTED') {
        deductRecipeFromInventory(rec, mp.portions, `Menu Plan (${mp.date})`);
        mp.status = 'DEDUCTED';
        state.prepQueue.push({
          id: uid('prep'),
          recipeId: rec.id,
          recipeName: rec.name,
          portions: mp.portions,
          deducted: true,
          targetDate: mp.date,
          checkedItems: {}
        });
        saveState();
        render();
        showToast(`Committed ${rec.name} (${mp.portions} portions): Stock deducted & added to Prep`);
      }
      return;
    }

    if (e.target.id === 'btn-commit-all-menu') {
      let committed = 0;
      (state.menuPlan || []).forEach(mp => {
        if (mp.status === 'DEDUCTED') return;
        const rec = state.recipes.find(r => r.id === mp.recipeId);
        if (!rec) return;
        deductRecipeFromInventory(rec, mp.portions, `Menu Plan (${mp.date})`);
        mp.status = 'DEDUCTED';
        state.prepQueue.push({
          id: uid('prep'),
          recipeId: rec.id,
          recipeName: rec.name,
          portions: mp.portions,
          deducted: true,
          targetDate: mp.date,
          checkedItems: {}
        });
        committed++;
      });
      saveState();
      render();
      showToast(`Committed ${committed} planned meal(s) & updated Living Stock`);
      return;
    }

    const removeMenuBtn = e.target.closest('[data-remove-menu]');
    if (removeMenuBtn) {
      state.menuPlan = (state.menuPlan || []).filter(m => m.id !== removeMenuBtn.dataset.removeMenu);
      saveState();
      render();
      return;
    }

    const removePrepBtn = e.target.closest('[data-remove-prep]');
    if (removePrepBtn) {
      state.prepQueue = state.prepQueue.filter(p => p.id !== removePrepBtn.dataset.removePrep);
      saveState();
      render();
      return;
    }

    const receiveBtn = e.target.closest('[data-receive-item]');
    if (receiveBtn) {
      const item = state.inventory.find(i => i.id === receiveBtn.dataset.receiveItem);
      const grams = Number(receiveBtn.dataset.receiveGrams);
      if (item) {
        item.stockGrams += grams;
        state.transactions.unshift({
          id: uid('tx'),
          timestamp: nowStamp(),
          type: 'INCOMING',
          itemId: item.id,
          itemName: item.name,
          grams,
          note: `Received Suggested Order (${receiveBtn.dataset.receiveLabel})`,
          staff: getActiveUser().name
        });
        saveState();
        render();
        showToast(`Received ${item.name} (+${formatShortMass(grams)})`);
      }
      return;
    }

    const chkFreqBtn = e.target.closest('[data-chk-freq]');
    if (chkFreqBtn) {
      state.checklistFreq = chkFreqBtn.dataset.chkFreq;
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-reset-chk-cycle') {
      const freq = state.checklistFreq || 'daily';
      (state.checklists || []).forEach(c => {
        if (c.freq === freq) { c.done = false; c.doneBy = ''; c.doneAt = ''; }
      });
      saveState();
      render();
      showToast(`Reset ${freq} checklist for new cycle`);
      return;
    }
    const chkDelBtn = e.target.closest('[data-chk-delete]');
    if (chkDelBtn) {
      state.checklists = (state.checklists || []).filter(c => c.id !== chkDelBtn.dataset.chkDelete);
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-export-chk-csv') {
      const rows = [['Timestamp', 'User', 'Frequency', 'Category', 'Task']];
      (state.checklistLogs || []).forEach(l => rows.push([l.timestamp, l.user, l.freq, l.category, l.title]));
      downloadFile('checklist_log.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      return;
    }

    const horizonBtn = e.target.closest('[data-horizon]');
    if (horizonBtn) {
      state.forecastHorizon = horizonBtn.dataset.horizon;
      saveState();
      render();
      return;
    }

    if (e.target.id === 'btn-print-prep' || e.target.id === 'btn-print-orders' || e.target.id === 'btn-print-haccp' || e.target.id === 'btn-print-help' || e.target.id === 'btn-print-qr-now' || e.target.id === 'btn-print-checklists') {
      window.print();
      return;
    }

    if (e.target.id === 'btn-export-tx-csv') {
      const rows = [['Timestamp', 'Type', 'Item', 'Grams', 'Notes', 'Staff']];
      state.transactions.forEach(t => rows.push([t.timestamp, t.type, t.itemName, t.grams, t.note, t.staff]));
      downloadFile('inventory_ledger.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      return;
    }

    if (e.target.id === 'btn-export-orders-csv') {
      const orders = getOrderSuggestions();
      const rows = [['Vendor', 'SKU', 'Item', 'On Hand (g)', 'Par (g)', 'Suggested Packs', 'Pack Label']];
      orders.forEach(o => rows.push([o.item.vendor, o.item.sku, o.item.name, o.item.stockGrams, o.item.parGrams, o.suggestedPacks, o.item.packLabel]));
      downloadFile('order_suggestions.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      return;
    }

    if (e.target.id === 'btn-download-json') {
      downloadFile('salvation_army_kms_backup.json', JSON.stringify(state, null, 2), 'application/json');
      return;
    }

    if (e.target.id === 'btn-audit-reveal') {
      state.blindAuditDraft.revealed = true;
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-audit-reset') {
      state.blindAuditDraft = { zone: state.blindAuditDraft.zone || 'ALL', revealed: false, counts: {}, units: {}, reasons: {} };
      saveState();
      render();
      return;
    }
    if (e.target.id === 'btn-audit-reconcile-all' || e.target.closest('[data-reconcile-item]')) {
      const singleBtn = e.target.closest('[data-reconcile-item]');
      const draft = state.blindAuditDraft;
      const targetIds = singleBtn ? [singleBtn.dataset.reconcileItem] : Object.keys(draft.counts).filter(id => draft.counts[id] !== '' && draft.counts[id] !== undefined);
      let countReconciled = 0;
      const user = getActiveUser();
      targetIds.forEach(id => {
        const item = state.inventory.find(i => i.id === id);
        if (!item) return;
        const raw = draft.counts[id];
        if (raw === '' || raw === undefined) return;
        const unit = draft.units[id] || (state.unitMode === 'us' ? 'lb' : 'g');
        const n = Number(raw);
        if (isNaN(n)) return;
        const physG = unit === 'kg' ? Math.round(n * 1000) : unit === 'lb' ? Math.round(n * 453.592) : unit === 'pack' ? Math.round(n * (item.packSizeGrams || 1000)) : Math.round(n);
        const sysG = item.stockGrams;
        const varianceG = physG - sysG;
        const reason = draft.reasons[id] || 'Blind audit reconciliation';
        item.stockGrams = physG;
        item.lastUpdated = new Date().toISOString().slice(0, 10);
        state.transactions.unshift({
          id: uid('tx'),
          timestamp: nowStamp(),
          type: 'AUDIT_RECONCILE',
          itemId: item.id,
          itemName: item.name,
          grams: varianceG,
          note: `Blind Audit (${formatShortMass(sysG)} → ${formatShortMass(physG)}): ${reason}`,
          staff: user.name
        });
        state.auditLogs.unshift({
          id: uid('aud'),
          timestamp: nowStamp(),
          userName: user.name,
          userRole: user.role,
          zone: item.zone,
          itemId: item.id,
          itemName: item.name,
          sku: item.sku,
          systemGrams: sysG,
          physicalGrams: physG,
          varianceGrams: varianceG,
          reason
        });
        delete draft.counts[id];
        delete draft.reasons[id];
        countReconciled++;
      });
      if (!Object.keys(draft.counts).length) draft.revealed = false;
      saveState();
      render();
      showToast(`Reconciled ${countReconciled} item(s) by ${user.name}`);
      return;
    }
    if (e.target.id === 'btn-export-audit-csv') {
      const rows = [['Timestamp', 'Auditor', 'SKU', 'Item', 'Zone', 'System (g)', 'Physical (g)', 'Variance (g)', 'Reason']];
      state.auditLogs.forEach(a => rows.push([a.timestamp, a.userName, a.sku, a.itemName, a.zone, a.systemGrams, a.physicalGrams, a.varianceGrams, a.reason]));
      downloadFile('blind_audit_history.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      return;
    }
    if (e.target.closest('#btn-switch-user-modal')) {
      showSwitchUserModal();
      return;
    }
    if (e.target.id === 'btn-lock-app') {
      state.isLocked = true;
      saveState();
      render();
      return;
    }
    const editPinBtn = e.target.closest('[data-edit-pin]');
    if (editPinBtn) {
      showEditPinModal(editPinBtn.dataset.editPin);
      return;
    }
    const swBtn = e.target.closest('[data-switch-user]');
    if (swBtn) {
      showSwitchUserModal(swBtn.dataset.switchUser);
      return;
    }
    const togBtn = e.target.closest('[data-toggle-user]');
    if (togBtn) {
      const u = state.users.find(x => x.id === togBtn.dataset.toggleUser);
      if (u) {
        u.active = u.active === false ? true : false;
        if (!u.active && state.activeUserId === u.id) {
          const fallback = state.users.find(x => x.active !== false);
          if (fallback) state.activeUserId = fallback.id;
        }
        saveState();
        render();
      }
      return;
    }
    if (e.target.id === 'btn-reset-demo') {
      state = getDefaultState();
      saveState();
      closeModal();
      render();
      showToast('Restored default kitchen data');
      return;
    }
  });

  document.addEventListener('input', (e) => {
    if (e.target.matches('[data-audit-count]')) {
      state.blindAuditDraft.counts[e.target.dataset.auditCount] = e.target.value;
      saveState();
    }
    if (e.target.matches('[data-audit-reason]')) {
      state.blindAuditDraft.reasons[e.target.dataset.auditReason] = e.target.value;
      saveState();
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'active-user-select') {
      state.activeUserId = e.target.value;
      saveState();
      render();
      showToast(`Active user: ${getActiveUser().name}`);
      return;
    }
    if (e.target.id === 'audit-zone-filter') {
      state.blindAuditDraft.zone = e.target.value;
      saveState();
      render();
      return;
    }
    if (e.target.matches('[data-audit-unit]')) {
      state.blindAuditDraft.units[e.target.dataset.auditUnit] = e.target.value;
      saveState();
      return;
    }
    if (e.target.matches('[data-chk-toggle]')) {
      const item = (state.checklists || []).find(c => c.id === e.target.dataset.chkToggle);
      if (item) {
        const u = getActiveUser();
        item.done = e.target.checked;
        item.doneBy = item.done ? u.name : '';
        item.doneAt = item.done ? nowStamp() : '';
        if (item.done) {
          if (!Array.isArray(state.checklistLogs)) state.checklistLogs = [];
          state.checklistLogs.unshift({
            id: uid('clg'),
            timestamp: item.doneAt,
            user: u.name,
            freq: item.freq,
            category: item.category,
            title: item.title
          });
        }
        saveState();
        render();
        if (item.done) showToast(`Logged: ${item.title} (${u.name})`);
      }
      return;
    }
    if (e.target.matches('[data-prep-check]')) {
      const [prepId, invId] = e.target.dataset.prepCheck.split('_');
      const pq = state.prepQueue.find(p => p.id === prepId);
      if (pq) {
        if (!pq.checkedItems) pq.checkedItems = {};
        pq.checkedItems[invId] = e.target.checked;
        saveState();
        render();
      }
    }
    if (e.target.id === 'input-restore-json' && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (parsed && Array.isArray(parsed.inventory)) {
            state = parsed;
            saveState();
            closeModal();
            render();
            showToast('Backup restored successfully');
          } else {
            showToast('Invalid backup file format', 'error');
          }
        } catch (err) {
          showToast('Could not parse JSON file', 'error');
        }
      };
      reader.readAsText(e.target.files[0]);
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

    if (e.target.id === 'form-checkin') {
      const item = state.inventory.find(i => i.id === fd.get('itemId'));
      const rawQty = Number(fd.get('qty'));
      const unit = fd.get('unit');
      const grams = unit === 'kg' ? rawQty * 1000 : unit === 'lb' ? rawQty * 453.592 : unit === 'pack' ? rawQty * (item.packSizeGrams || 1000) : rawQty;
      item.stockGrams += Math.round(grams);
      item.lastUpdated = new Date().toISOString().slice(0, 10);
      state.transactions.unshift({
        id: uid('tx'),
        timestamp: nowStamp(),
        type: 'INCOMING',
        itemId: item.id,
        itemName: item.name,
        grams: Math.round(grams),
        note: (fd.get('note') || 'Delivery Check-In') + ` | Vendor: ${item.vendor}`,
        staff: fd.get('staff')
      });
      saveState();
      render();
      showToast(`Checked in +${formatShortMass(grams)} of ${item.name}`);
      return;
    }

    if (e.target.id === 'form-waste') {
      const item = state.inventory.find(i => i.id === fd.get('itemId'));
      const rawQty = Number(fd.get('qty'));
      const unit = fd.get('unit');
      const grams = Math.round(unit === 'kg' ? rawQty * 1000 : unit === 'lb' ? rawQty * 453.592 : rawQty);
      item.stockGrams = Math.max(0, item.stockGrams - grams);
      item.lastUpdated = new Date().toISOString().slice(0, 10);
      state.transactions.unshift({
        id: uid('tx'),
        timestamp: nowStamp(),
        type: 'WASTE',
        itemId: item.id,
        itemName: item.name,
        grams: -grams,
        note: `Reason: ${fd.get('reason')}`,
        staff: fd.get('staff')
      });
      saveState();
      render();
      showToast(`Logged waste: -${formatShortMass(grams)} of ${item.name}`, 'warn');
      return;
    }

    if (e.target.id === 'form-new-inv') {
      const newItem = {
        id: uid('inv'),
        sku: fd.get('sku'),
        name: fd.get('name'),
        category: 'General',
        zone: fd.get('zone'),
        vendor: fd.get('vendor'),
        stockGrams: Number(fd.get('stockGrams')),
        parGrams: Number(fd.get('parGrams')),
        unitLabel: 'g',
        packSizeGrams: Number(fd.get('packSizeGrams')),
        packLabel: fd.get('packLabel'),
        lastUpdated: new Date().toISOString().slice(0, 10)
      };
      state.inventory.push(newItem);
      saveState();
      closeModal();
      render();
      showToast(`Added ${newItem.name} to Living Stock`);
      return;
    }

    if (e.target.id === 'form-new-recipe') {
      const ings = [];
      [[fd.get('ing1'), Number(fd.get('g1'))], [fd.get('ing2'), Number(fd.get('g2'))], [fd.get('ing3'), Number(fd.get('g3'))]].forEach(([id, g]) => {
        if (id && g > 0) ings.push({ itemId: id, grams: g });
      });
      const totalMin = Number(fd.get('totalMin')) || 60;
      const newRec = {
        id: uid('rec'),
        name: fd.get('name'),
        category: fd.get('category'),
        basePortions: Number(fd.get('basePortions')) || 50,
        prepMin: Math.round(totalMin * 0.4),
        cookMin: Math.round(totalMin * 0.6),
        isBakers: false,
        instructions: fd.get('instructions'),
        ingredients: ings
      };
      state.recipes.push(newRec);
      state.selectedRecipeId = newRec.id;
      saveState();
      closeModal();
      render();
      showToast(`Saved recipe: ${newRec.name}`);
      return;
    }

    if (e.target.id === 'form-haccp') {
      const type = fd.get('type');
      const tempF = Number(fd.get('tempF'));
      let pass = true;
      if (type.includes('≤41°F') && tempF > 41) pass = false;
      if (type.includes('≤0°F') && tempF > 0) pass = false;
      if (type.includes('≥165°F') && tempF < 165) pass = false;
      if (type.includes('≥135°F') && tempF < 135) pass = false;
      state.haccpLogs.unshift({
        id: uid('hac'),
        timestamp: nowStamp(),
        type,
        target: fd.get('target'),
        tempF,
        status: pass ? 'PASS' : 'FLAGGED',
        corrective: fd.get('corrective') || (pass ? '—' : 'Action required'),
        staff: fd.get('staff')
      });
      saveState();
      render();
      showToast(pass ? `HACCP Check Passed (${tempF}°F)` : `HACCP Check FLAGGED (${tempF}°F)`, pass ? 'ok' : 'error');
      return;
    }

    if (e.target.id === 'form-served') {
      const dateStr = fd.get('date');
      const dObj = new Date(dateStr + 'T12:00:00');
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      state.serviceHistory.push({
        id: uid('srv'),
        date: dateStr,
        dayName: dayNames[dObj.getDay()],
        meal: fd.get('meal'),
        planned: Number(fd.get('planned')),
        served: Number(fd.get('served')),
        notes: ''
      });
      saveState();
      render();
      showToast(`Logged ${fd.get('served')} people served — forecasts updated!`);
      return;
    }

    if (e.target.id === 'form-unlock-user' || e.target.id === 'form-switch-user') {
      const targetUser = state.users.find(u => u.id === fd.get('userId') && u.active !== false);
      const pin = String(fd.get('pin') || '');
      if (!targetUser || String(targetUser.pin || '1234') !== pin) {
        const errEl = document.getElementById(e.target.id === 'form-unlock-user' ? 'unlock-error' : 'switch-error');
        if (errEl) errEl.classList.remove('hidden');
        return;
      }
      state.activeUserId = targetUser.id;
      state.isLocked = false;
      const allowed = getAllowedTabs(targetUser);
      if (!allowed.includes(state.activeTab)) state.activeTab = allowed[0];
      saveState();
      closeModal();
      render();
      showToast(`Signed in as ${targetUser.name} (${normalizeRole(targetUser.role)})`);
      return;
    }

    if (e.target.id === 'form-edit-pin') {
      const u = state.users.find(x => x.id === fd.get('userId'));
      if (u) {
        u.role = fd.get('role');
        u.pin = String(fd.get('pin'));
        saveState();
        closeModal();
        render();
        showToast(`Updated role & password for ${u.name}`);
      }
      return;
    }

    if (e.target.id === 'form-add-checklist') {
      const freq = fd.get('freq');
      const task = {
        id: uid('chk'),
        freq,
        category: fd.get('category'),
        title: fd.get('title').trim(),
        done: false,
        doneBy: '',
        doneAt: ''
      };
      if (!Array.isArray(state.checklists)) state.checklists = [];
      state.checklists.push(task);
      state.checklistFreq = freq;
      saveState();
      render();
      showToast(`Added task to ${freq} checklist`);
      return;
    }

    if (e.target.id === 'form-add-menu-item') {
      const mp = {
        id: uid('mp'),
        date: fd.get('date'),
        mealSlot: 'Lunch (11:30 AM)',
        recipeId: fd.get('recipeId'),
        portions: Number(fd.get('portions')) || 65,
        status: 'PLANNED'
      };
      if (!Array.isArray(state.menuPlan)) state.menuPlan = [];
      state.menuPlan.push(mp);
      saveState();
      render();
      showToast('Added recipe to Menu Plan (Order Suggestions updated)');
      return;
    }

    if (e.target.id === 'form-add-user') {
      const newUser = {
        id: uid('usr'),
        name: fd.get('name').trim(),
        role: fd.get('role'),
        initials: fd.get('initials').trim().toUpperCase(),
        pin: String(fd.get('pin') || '1234'),
        active: true
      };
      state.users.push(newUser);
      saveState();
      render();
      showToast(`Added ${newUser.name} (${newUser.role})`);
    }
  });

  // Real-time cross-tab sync
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY && e.newValue) {
      try {
        state = JSON.parse(e.newValue);
        render();
        showToast('Synced real-time update from another tab');
      } catch (err) {}
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'quick-scan-input' && e.key === 'Enter') {
      e.preventDefault();
      applyScannedCode(e.target.value);
      e.target.value = '';
    }
  });

  // Initial render + start Supabase real-time sync
  function bootApp() {
    render();
    initSupabaseSync();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootApp);
  } else {
    bootApp();
  }
})();
</script>
</body>
</html>
